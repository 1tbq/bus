<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Mix Master | Year 10 Business</title>
<style>
  :root{
    --navy:#2F3C7E;
    --navy-dark:#1B2354;
    --coral:#F96167;
    --coral-dark:#D9464C;
    --gold:#F9E795;
    --gold-dark:#E0C542;
    --cream:#FFF9F2;
    --charcoal:#2B2B2B;
    --grey:#6E6E6E;
    --green:#1E7A3B;
    --green-bg:#DDEFE0;
    --red:#B23A3A;
    --red-bg:#FBE0E0;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Calibri, Arial, sans-serif;
    background:
      radial-gradient(circle at 90% -10%, rgba(249,97,103,0.18), transparent 45%),
      radial-gradient(circle at -10% 110%, rgba(249,231,149,0.35), transparent 45%),
      var(--navy-dark);
    min-height:100vh;
    color:var(--charcoal);
    display:flex;
    justify-content:center;
    padding:24px 14px 60px;
  }
  h1,h2,h3{font-family:'Georgia', 'Cambria', serif; margin:0;}
  .app{width:100%; max-width:760px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; color:var(--cream); margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .grid4{
    width:34px; height:34px; border-radius:9px; overflow:hidden;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
  }
  .brand .grid4 span:nth-child(1){background:var(--navy);}
  .brand .grid4 span:nth-child(2){background:var(--coral);}
  .brand .grid4 span:nth-child(3){background:var(--coral-dark);}
  .brand .grid4 span:nth-child(4){background:var(--gold);}
  .brand-text .title{font-size:19px; font-weight:700; letter-spacing:0.3px;}
  .brand-text .sub{font-size:11px; letter-spacing:1.5px; color:var(--gold); text-transform:uppercase;}
  .scorepill{background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.25); padding:7px 14px; border-radius:999px; font-size:14px; font-weight:600;}
  .progresswrap{margin-bottom:18px;}
  .progressbar{height:8px; background:rgba(255,255,255,0.15); border-radius:6px; overflow:hidden;}
  .progressfill{height:100%; background:linear-gradient(90deg, var(--coral), var(--gold)); width:0%; transition:width 0.4s ease;}
  .roundlabel{color:var(--gold); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; margin-top:6px; font-weight:700;}
  .card{background:var(--cream); border-radius:var(--radius); padding:28px 26px; box-shadow:0 18px 40px rgba(0,0,0,0.28);}
  .screen-title{font-size:26px; color:var(--navy); margin-bottom:8px;}
  .screen-body{font-size:15px; color:var(--charcoal); line-height:1.55; margin-bottom:18px;}
  .btn{display:inline-block; border:none; cursor:pointer; font-weight:700; font-size:15px; padding:13px 26px; border-radius:999px; transition:transform 0.12s ease, box-shadow 0.12s ease; font-family:inherit;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--coral); color:#fff; box-shadow:0 8px 18px rgba(249,97,103,0.35);}
  .btn-primary:hover{background:var(--coral-dark);}
  .btn-ghost{background:transparent; color:var(--navy); border:2px solid var(--navy);}
  .btn-ghost:hover{background:var(--navy); color:#fff;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .rules{list-style:none; padding:0; margin:0 0 20px;}
  .rules li{display:flex; gap:12px; align-items:flex-start; margin-bottom:12px; font-size:14px;}
  .rules .num{flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;}
  .stage-badge{display:inline-flex; align-items:center; gap:8px; background:var(--navy); color:var(--gold); padding:6px 14px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:14px;}
  .qcounter{font-size:12px; color:var(--grey); font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;}
  .qtext{font-size:19px; color:var(--charcoal); line-height:1.4; margin-bottom:20px; font-weight:600;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .options.two-col{flex-direction:row; gap:12px; flex-wrap:wrap;}
  .options.two-col .opt{flex:1 1 45%;}
  .opt{text-align:left; background:#fff; border:2px solid #E3DCD0; border-radius:12px; padding:14px 16px; font-size:14.5px; cursor:pointer; font-family:inherit; color:var(--charcoal); transition:all 0.15s ease; flex:1;}
  .opt:hover:not(:disabled){border-color:var(--coral); transform:translateY(-1px);}
  .opt.correct{background:var(--green-bg); border-color:var(--green); color:var(--green); font-weight:700;}
  .opt.incorrect{background:var(--red-bg); border-color:var(--red); color:var(--red); font-weight:700;}
  .opt.dim{opacity:0.55;}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:16px; padding:14px 16px; border-radius:12px; font-size:14px; line-height:1.5; display:none;}
  .feedback.show{display:block;}
  .feedback.good{background:var(--green-bg); color:var(--green);}
  .feedback.bad{background:var(--red-bg); color:var(--red);}
  .feedback strong{display:block; font-size:13px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;}
  .nextrow{margin-top:20px; text-align:right;}
  .matchgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px;}
  .matchcol h4{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--grey); margin-bottom:10px;}
  .chip{background:#fff; border:2px solid #E3DCD0; border-radius:10px; padding:12px 12px; font-size:13.5px; margin-bottom:10px; cursor:pointer; transition:all 0.15s ease; min-height:44px; display:flex; align-items:center;}
  .chip.term{font-weight:700; color:var(--navy);}
  .chip:hover:not(.locked):not(.disabled){border-color:var(--coral);}
  .chip.selected{border-color:var(--coral); background:#FFF1F1;}
  .chip.locked{background:var(--green-bg); border-color:var(--green); color:var(--green); cursor:default;}
  .chip.wrongflash{background:var(--red-bg); border-color:var(--red); color:var(--red);}
  .matchstatus{margin-top:14px; font-size:13px; color:var(--grey); text-align:center;}
  .toast{position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-20px); background:var(--navy); color:var(--gold); padding:10px 22px; border-radius:999px; font-weight:700; font-size:13.5px; opacity:0; transition:all 0.35s ease; z-index:50; box-shadow:0 10px 24px rgba(0,0,0,0.3); pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .resultstop{text-align:center; margin-bottom:20px;}
  .badgecircle{width:110px; height:110px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; font-size:44px; box-shadow:0 12px 24px rgba(0,0,0,0.15);}
  .scorebig{font-size:44px; font-weight:800; color:var(--navy); font-family:'Georgia',serif;}
  .scoresub{font-size:13px; color:var(--grey); letter-spacing:0.5px;}
  .breakdown{margin:22px 0; border-top:1px solid #E3DCD0; padding-top:16px;}
  .brow{display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0; border-bottom:1px dashed #E3DCD0;}
  .brow:last-child{border-bottom:none;}
  .nameinput{width:100%; padding:12px 14px; border-radius:10px; border:2px solid #E3DCD0; font-size:14px; font-family:inherit; margin-bottom:16px;}
  .certline{text-align:center; font-size:13px; color:var(--grey); margin-top:6px; font-style:italic;}
  .actionrow{display:flex; gap:12px; justify-content:center; margin-top:22px; flex-wrap:wrap;}
  @media (max-width:520px){
    .card{padding:20px 16px;}
    .matchgrid{grid-template-columns:1fr;}
    .options.two-col .opt{flex:1 1 100%;}
    .screen-title{font-size:22px;}
    .qtext{font-size:17px;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="grid4"><span></span><span></span><span></span><span></span></div>
      <div class="brand-text">
        <div class="title">Marketing Mix Master</div>
        <div class="sub">Year 10 Business · The 4 Ps</div>
      </div>
    </div>
    <div class="scorepill" id="scorepill">Score: 0</div>
  </div>

  <div class="progresswrap" id="progresswrap" style="display:none;">
    <div class="progressbar"><div class="progressfill" id="progressfill"></div></div>
    <div class="roundlabel" id="roundlabel"></div>
  </div>

  <div class="card" id="card"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   MARKETING MIX MASTER
   A four-stage Product / Price / Place / Promotion game
   for Year 10 Business
   ============================================================ */

const ROUND1 = { // Which P Is It?
  name: "Stage 1 · Which P Is It?",
  intro: "Read each business decision. Decide which part of the marketing mix it belongs to: Product, Price, Place or Promotion.",
  items: [
    { q: "A shoe company adds a lighter, more breathable fabric to its running shoe.", a: "Product", why: "Changing the features of the item itself is a Product decision." },
    { q: "A drink brand releases a sugar-free version of its most popular flavour.", a: "Product", why: "A new variation of the item is a Product decision." },
    { q: "A telco prices its new plan $5 below its biggest competitor.", a: "Price", why: "Setting what customers pay, relative to rivals, is a Price decision." },
    { q: "A furniture store prices its own-brand sofas well below name-brand rivals.", a: "Price", why: "Choosing where to sit on cost is a Price decision." },
    { q: "A skincare brand chooses to sell only in pharmacies, not supermarkets.", a: "Place", why: "Choosing the channel customers buy through is a Place decision." },
    { q: "A clothing label opens its first physical store in a major shopping centre.", a: "Place", why: "Choosing where and how customers can access the product is Place." },
    { q: "A fast food chain sponsors a local junior sports league's jerseys.", a: "Promotion", why: "Building awareness and goodwill is a Promotion decision." },
    { q: "A drink brand partners with an influencer to post an unboxing video.", a: "Promotion", why: "Communicating with customers to create demand is Promotion." }
  ]
};

const ROUND2 = { // Term Match
  name: "Stage 2 · Term Match",
  intro: "Click a term on the left, then click the definition on the right that matches it. Match all five to move on.",
  pairs: [
    { term: "Marketing mix", def: "The set of controllable decisions a business makes to market its product effectively." },
    { term: "Product", def: "What the business offers, its features, quality, design, branding and packaging." },
    { term: "Price", def: "What the customer pays, and the strategy behind that price point." },
    { term: "Place", def: "How and where the product reaches the customer." },
    { term: "Promotion", def: "How the business communicates and creates demand for the product." }
  ]
};

const ROUND3 = { // Myth Buster True/False
  name: "Stage 3 · Myth Buster",
  intro: "The 4 Ps are full of myths too. Decide TRUE or FALSE for each statement, then check the explanation.",
  items: [
    { q: "Price only reflects how much something costs to make.", a: "False", why: "Price also signals quality and positioning, and reflects how a business wants to compete, not just its costs." },
    { q: "Place is only about which physical shop a product is sold in.", a: "False", why: "Place covers every channel a product reaches customers through, including online and direct delivery." },
    { q: "Promotion always means paid advertising.", a: "False", why: "Promotion includes free tools too, like organic social media, sponsorships and word of mouth." },
    { q: "Product includes packaging and branding, not just the physical item.", a: "True", why: "Product covers the whole offer: features, quality, design, packaging and brand." },
    { q: "A business can usually change just one P without affecting the others.", a: "False", why: "The four Ps usually need to work together, changing one often means the others need to change too." },
    { q: "Two businesses selling a similar product can have completely different marketing mixes.", a: "True", why: "Different target markets and strategies lead to very different Product, Price, Place and Promotion choices." }
  ]
};

const ROUND4 = { // Brand Mix Detective
  name: "Stage 4 · Brand Mix Detective",
  intro: "Four real Australian businesses. Read each scenario and identify which P it most clearly demonstrates.",
  items: [
    {
      q: "ALDI keeps its prices consistently lower than Coles and Woolworths across almost its entire range. Budget shoppers know exactly what to expect.",
      options: ["Product", "Price", "Place", "Promotion"],
      a: "Price",
      why: "Consistently low prices, relative to competitors, is a Price strategy."
    },
    {
      q: "Bunnings operates large warehouse-style stores in almost every Australian suburb, easy to drive to and park at.",
      options: ["Product", "Price", "Place", "Promotion"],
      a: "Place",
      why: "Where and how customers can physically access the business is a Place decision."
    },
    {
      q: "Kmart's products regularly go viral through customer-made \u201cKmart hacks\u201d videos on social media, free publicity the brand didn't pay for.",
      options: ["Product", "Price", "Place", "Promotion"],
      a: "Promotion",
      why: "Generating buzz and awareness, even unpaid, is a Promotion outcome." 
    },
    {
      q: "Cotton On constantly refreshes its clothing ranges with new, on-trend styles to keep customers coming back.",
      options: ["Product", "Price", "Place", "Promotion"],
      a: "Product",
      why: "Refreshing the range and styles on offer is a Product decision."
    }
  ]
};

let state = {
  score: 0, correctCount: 0,
  totalQuestions: ROUND1.items.length + ROUND2.pairs.length + ROUND3.items.length + ROUND4.items.length,
  streak: 0, bonusAwarded: 0, roundIndex: 0, qIndex: 0, matchedPairs: 0
};

const ROUNDS_META = [
  { key: 1, total: ROUND1.items.length },
  { key: 2, total: ROUND2.pairs.length },
  { key: 3, total: ROUND3.items.length },
  { key: 4, total: ROUND4.items.length }
];

const cardEl = document.getElementById('card');
const scorepillEl = document.getElementById('scorepill');
const progresswrapEl = document.getElementById('progresswrap');
const progressfillEl = document.getElementById('progressfill');
const roundlabelEl = document.getElementById('roundlabel');
const toastEl = document.getElementById('toast');

function updateScorePill(){ scorepillEl.textContent = "Score: " + state.score; }

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 1400);
}

function registerAnswer(correct, points){
  if(correct){
    state.score += points;
    state.correctCount += 1;
    state.streak += 1;
    if(state.streak > 0 && state.streak % 3 === 0){
      state.score += 5;
      state.bonusAwarded += 5;
      showToast("\uD83D\uDD25 Streak bonus! +5 points (" + state.streak + " in a row)");
    }
  } else {
    state.streak = 0;
  }
  updateScorePill();
}

function overallQuestionNumber(){
  let done = 0;
  for(let i=0;i<state.roundIndex-1;i++){ done += ROUNDS_META[i].total; }
  done += state.qIndex;
  return done;
}

function updateProgress(roundName){
  progresswrapEl.style.display = 'block';
  const done = overallQuestionNumber();
  const pct = Math.round((done / state.totalQuestions) * 100);
  progressfillEl.style.width = pct + "%";
  roundlabelEl.textContent = roundName + " \u2014 question " + (state.qIndex+1) + " of " + ROUNDS_META[state.roundIndex-1].total;
}

function renderIntro(){
  progresswrapEl.style.display = 'none';
  cardEl.innerHTML = `
    <div class="stage-badge">Mission briefing</div>
    <div class="screen-title">Can you master the marketing mix?</div>
    <div class="screen-body">
      Every business plans its marketing around four decisions: Product, Price, Place and Promotion.
      Get the mix wrong and even a great product can flop. Get it right, and a business builds a real edge.
      Four challenges stand between you and mastery.
    </div>
    <ul class="rules">
      <li><div class="num">1</div><div><strong>Which P Is It?</strong> \u2014 sort 8 real business decisions into the right P.</div></li>
      <li><div class="num">2</div><div><strong>Term Match</strong> \u2014 pair 5 key vocabulary words with their definitions.</div></li>
      <li><div class="num">3</div><div><strong>Myth Buster</strong> \u2014 bust 6 common myths about the 4 Ps, true or false.</div></li>
      <li><div class="num">4</div><div><strong>Brand Mix Detective</strong> \u2014 decode the marketing mix behind 4 real Australian brands.</div></li>
    </ul>
    <div class="screen-body" style="margin-bottom:24px;"><strong>23 questions total.</strong> Score points, build streaks, and earn your marketing mix rank at the end.</div>
    <button class="btn btn-primary" id="startBtn">Start the mission \u2192</button>
  `;
  document.getElementById('startBtn').onclick = () => {
    state.roundIndex = 1; state.qIndex = 0;
    renderRoundIntro();
  };
}

function currentRoundData(){
  return [null, ROUND1, ROUND2, ROUND3, ROUND4][state.roundIndex];
}

function renderRoundIntro(){
  const r = currentRoundData();
  progresswrapEl.style.display = 'none';
  cardEl.innerHTML = `
    <div class="stage-badge">${r.name}</div>
    <div class="screen-title">Ready?</div>
    <div class="screen-body">${r.intro}</div>
    <button class="btn btn-primary" id="goBtn">Begin stage ${state.roundIndex} \u2192</button>
  `;
  document.getElementById('goBtn').onclick = () => {
    state.qIndex = 0;
    if(state.roundIndex === 2){ state.matchedPairs = 0; renderMatchRound(); }
    else { renderQuestion(); }
  };
}

function renderQuestion(){
  const r = currentRoundData();
  const roundKey = state.roundIndex;
  const item = r.items[state.qIndex];
  updateProgress(r.name);

  let options;
  if(roundKey === 1) options = ["Product", "Price", "Place", "Promotion"];
  else if(roundKey === 3) options = ["True", "False"];
  else options = item.options;

  const twoCol = options.length > 2;

  cardEl.innerHTML = `
    <div class="qcounter">${r.name} \u00B7 Question ${state.qIndex+1} of ${r.items.length}</div>
    <div class="qtext">${item.q}</div>
    <div class="options ${twoCol ? 'two-col' : ''}" id="optionsWrap"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nextrow"><button class="btn btn-primary" id="nextBtn" style="display:none;">Next \u2192</button></div>
  `;

  const wrap = document.getElementById('optionsWrap');
  options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => handleAnswer(opt, item, wrap);
    wrap.appendChild(b);
  });
}

function handleAnswer(chosen, item, wrap){
  const buttons = Array.from(wrap.children);
  buttons.forEach(b => b.disabled = true);
  const correct = chosen === item.a;

  buttons.forEach(b => {
    if(b.textContent === item.a) b.classList.add('correct');
    else if(b.textContent === chosen) b.classList.add('incorrect');
    else b.classList.add('dim');
  });

  registerAnswer(correct, 10);

  const fb = document.getElementById('feedback');
  fb.classList.add('show', correct ? 'good' : 'bad');
  fb.innerHTML = `<strong>${correct ? "Correct!" : "Not quite"}</strong>${item.why}`;

  document.getElementById('nextBtn').style.display = 'inline-block';
  document.getElementById('nextBtn').onclick = advance;
}

function advance(){
  const r = currentRoundData();
  state.qIndex += 1;
  if(state.qIndex >= r.items.length){
    state.roundIndex += 1;
    if(state.roundIndex > 4){ renderResults(); }
    else { renderRoundIntro(); }
  } else {
    renderQuestion();
  }
}

let matchSelection = { term: null, def: null };

function renderMatchRound(){
  const r = ROUND2;
  updateProgress(r.name);

  const defs = r.pairs.map(p => p.def);
  const shuffled = [...defs].sort(() => Math.random() - 0.5);

  cardEl.innerHTML = `
    <div class="qcounter">${r.name} \u00B7 Match all five</div>
    <div class="qtext" style="font-size:15px; font-weight:400;">Click a term, then click its matching definition.</div>
    <div class="matchgrid">
      <div class="matchcol"><h4>Terms</h4><div id="termCol"></div></div>
      <div class="matchcol"><h4>Definitions</h4><div id="defCol"></div></div>
    </div>
    <div class="matchstatus" id="matchStatus">Matched 0 of 5</div>
    <div class="nextrow"><button class="btn btn-primary" id="matchNextBtn" style="display:none;">Next stage \u2192</button></div>
  `;

  const termCol = document.getElementById('termCol');
  const defCol = document.getElementById('defCol');

  r.pairs.forEach(p => {
    const c = document.createElement('div');
    c.className = 'chip term';
    c.textContent = p.term;
    c.onclick = () => selectTerm(c, p.term);
    termCol.appendChild(c);
  });

  shuffled.forEach(d => {
    const c = document.createElement('div');
    c.className = 'chip def';
    c.textContent = d;
    c.onclick = () => selectDef(c, d);
    defCol.appendChild(c);
  });

  matchSelection = { term: null, def: null };
}

function selectTerm(el, term){
  if(el.classList.contains('locked')) return;
  document.querySelectorAll('.chip.term').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  matchSelection.term = { el, term };
  tryMatch();
}
function selectDef(el, def){
  if(el.classList.contains('locked')) return;
  document.querySelectorAll('.chip.def').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  matchSelection.def = { el, def };
  tryMatch();
}

function tryMatch(){
  if(!matchSelection.term || !matchSelection.def) return;
  const pair = ROUND2.pairs.find(p => p.term === matchSelection.term.term);
  const correct = pair.def === matchSelection.def.def;

  if(correct){
    matchSelection.term.el.classList.remove('selected');
    matchSelection.def.el.classList.remove('selected');
    matchSelection.term.el.classList.add('locked');
    matchSelection.def.el.classList.add('locked');
    registerAnswer(true, 10);
    state.matchedPairs += 1;
    document.getElementById('matchStatus').textContent = "Matched " + state.matchedPairs + " of 5";
    if(state.matchedPairs === 5){
      document.getElementById('matchStatus').textContent = "All matched! Nicely done.";
      document.getElementById('matchNextBtn').style.display = 'inline-block';
      document.getElementById('matchNextBtn').onclick = () => {
        state.roundIndex += 1;
        renderRoundIntro();
      };
    }
  } else {
    registerAnswer(false, 0);
    matchSelection.term.el.classList.add('wrongflash');
    matchSelection.def.el.classList.add('wrongflash');
    setTimeout(() => {
      matchSelection.term.el.classList.remove('wrongflash','selected');
      matchSelection.def.el.classList.remove('wrongflash','selected');
      matchSelection = { term: null, def: null };
    }, 550);
    return;
  }
  matchSelection = { term: null, def: null };
}

function getRank(pct){
  if(pct >= 90) return { label: "4Ps Virtuoso", emoji: "\uD83C\uDFC6", color: "#F9E795", ring:"#E0C542" };
  if(pct >= 75) return { label: "Mix Strategist", emoji: "\uD83E\uDD47", color: "#DDEFE0", ring:"#1E7A3B" };
  if(pct >= 50) return { label: "Mix Apprentice", emoji: "\uD83C\uDFAF", color: "#CADCFC", ring:"#2F3C7E" };
  return { label: "Keep Mixing", emoji: "\uD83D\uDCC8", color: "#FBE0E0", ring:"#B23A3A" };
}

function renderResults(){
  progresswrapEl.style.display = 'none';
  const pct = Math.round((state.correctCount / state.totalQuestions) * 100);
  const rank = getRank(pct);

  cardEl.innerHTML = `
    <div class="resultstop">
      <div class="badgecircle" style="background:${rank.color}; border:3px solid ${rank.ring};">${rank.emoji}</div>
      <div class="scorebig">${state.score} pts</div>
      <div class="scoresub">${state.correctCount} of ${state.totalQuestions} correct \u00B7 ${pct}% accuracy</div>
    </div>
    <div style="text-align:center; margin-bottom:10px;">
      <span class="stage-badge" style="background:${rank.ring}; color:#fff;">${rank.label}</span>
    </div>
    <div class="breakdown">
      <div class="brow"><span>Stage 1 \u00B7 Which P Is It?</span><span>${ROUND1.items.length} questions</span></div>
      <div class="brow"><span>Stage 2 \u00B7 Term Match</span><span>${ROUND2.pairs.length} pairs</span></div>
      <div class="brow"><span>Stage 3 \u00B7 Myth Buster</span><span>${ROUND3.items.length} questions</span></div>
      <div class="brow"><span>Stage 4 \u00B7 Brand Mix Detective</span><span>${ROUND4.items.length} questions</span></div>
      <div class="brow"><span>Streak bonuses earned</span><span>+${state.bonusAwarded} pts</span></div>
    </div>
    <input type="text" class="nameinput" id="nameInput" placeholder="Type your name for your certificate (optional)">
    <div id="certOut"></div>
    <div class="actionrow">
      <button class="btn btn-primary" id="restartBtn">Play again</button>
      <button class="btn btn-ghost" id="certBtn">Show certificate</button>
    </div>
  `;

  document.getElementById('restartBtn').onclick = resetGame;
  document.getElementById('certBtn').onclick = () => {
    const name = document.getElementById('nameInput').value.trim() || "Marketing Student";
    document.getElementById('certOut').innerHTML = `
      <div class="certline">This certifies that</div>
      <div style="text-align:center; font-family:Georgia,serif; font-size:22px; color:var(--navy); font-weight:700; margin:4px 0;">${escapeHtml(name)}</div>
      <div class="certline">has earned the rank of <strong>${rank.label}</strong> in Marketing Mix Master \u2014 ${pct}% accuracy, ${state.score} points.</div>
    `;
  };
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function resetGame(){
  state = {
    score: 0, correctCount: 0,
    totalQuestions: ROUND1.items.length + ROUND2.pairs.length + ROUND3.items.length + ROUND4.items.length,
    streak: 0, bonusAwarded: 0, roundIndex: 0, qIndex: 0, matchedPairs: 0
  };
  updateScorePill();
  renderIntro();
}

updateScorePill();
renderIntro();
</script>
</body>
</html>
