<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swipe Smart | Lesson 2</title>
<style>
  :root {
    --ink: #14213D; --accent: #6D28D9; --accent-soft: #EDE9FE;
    --good: #0E7C66; --good-soft: #E6F4F1; --bad: #B42318; --bad-soft: #FCEBEA;
    --yellow: #FFE14D; --tint: #F1F5F9; --muted: #64748B; --line: #CBD5E1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Calibri, Arial, sans-serif; color: var(--ink); background: #F8FAFC; min-height: 100vh; }
  button { font-family: inherit; }
  header { background: var(--ink); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header .logo { font-size: 30px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  header .sub { font-size: 13px; color: #CBD5E1; }
  header .hud { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { background: rgba(255,255,255,.12); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .chip b { color: var(--yellow); }
  .meter { padding: 10px 20px 0; max-width: 900px; margin: 0 auto; }
  .meter-track { height: 14px; background: #E2E8F0; border-radius: 999px; overflow: hidden; }
  .meter-fill { height: 100%; background: var(--accent); width: 50%; transition: width .4s, background .4s; }
  .meter-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
  main { max-width: 900px; margin: 0 auto; padding: 18px 20px 40px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 10px rgba(20,33,61,.08); padding: 26px; margin-bottom: 18px; }
  .tag { display: inline-block; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 2px; padding: 5px 12px; border-radius: 999px; text-transform: uppercase; }
  .tag.accent { background: var(--accent); }
  h2 { font-size: 28px; margin: 12px 0 8px; }
  p { line-height: 1.5; }
  .muted { color: var(--muted); }
  .big-btn { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 14px 26px; font-size: 18px; font-weight: 700; cursor: pointer; }
  .big-btn:hover { filter: brightness(1.08); }
  .big-btn.ghost { background: var(--tint); color: var(--ink); }
  input[type=text], input[type=number] { font-size: 18px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; width: 100%; max-width: 360px; font-family: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  .rounds-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 18px 0; }
  .round-pill { background: var(--tint); border-radius: 12px; padding: 12px 14px; }
  .round-pill .n { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; align-items: center; justify-content: center; font-weight: 700; margin-right: 8px; }
  .progress { display: flex; gap: 4px; margin: 14px 0 4px; }
  .progress span { flex: 1; height: 6px; border-radius: 3px; background: #E2E8F0; }
  .progress span.done-ok { background: var(--good); }
  .progress span.done-bad { background: var(--bad); }
  .progress span.now { background: var(--accent); }
  .prompt { font-size: 24px; font-weight: 700; line-height: 1.35; margin: 18px 0; min-height: 66px; }
  .opts { display: grid; gap: 12px; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  .opt { text-align: left; background: var(--tint); border: 2px solid transparent; border-radius: 12px; padding: 16px 18px; font-size: 18px; cursor: pointer; color: var(--ink); line-height: 1.35; }
  .opts.two .opt { text-align: center; font-weight: 700; font-size: 20px; padding: 22px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt.right { background: var(--good-soft); border-color: var(--good); }
  .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .opt .k { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; align-items: center; justify-content: center; font-weight: 700; margin-right: 10px; font-size: 14px; }
  .feedback { margin-top: 16px; border-radius: 12px; padding: 14px 18px; display: none; font-size: 17px; line-height: 1.45; }
  .feedback.ok { display: block; background: var(--good-soft); }
  .feedback.no { display: block; background: var(--bad-soft); }
  .feedback strong { display: block; margin-bottom: 4px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .float { position: fixed; top: 80px; right: 30px; font-size: 26px; font-weight: 800; color: var(--good); pointer-events: none; animation: up 1s forwards; }
  .float.neg { color: var(--bad); }
  @keyframes up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-50px); } }
  .streak-flash { animation: pulse .5s; }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  .badges { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 16px 0; }
  .badge { border-radius: 12px; padding: 14px; text-align: center; background: var(--tint); opacity: .45; }
  .badge.earned { opacity: 1; background: #FFF6BF; }
  .badge .i { font-size: 34px; }
  .badge .t { font-weight: 700; margin-top: 6px; }
  .badge .d { font-size: 13px; color: var(--muted); }
  .review-item { border-left: 0; background: var(--bad-soft); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .review-item .q { font-weight: 700; }
  .score-big { font-size: 64px; font-weight: 800; color: var(--accent); margin: 6px 0; }
  table.rounds { width: 100%; border-collapse: collapse; margin: 10px 0; }
  table.rounds td, table.rounds th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
  #cert { display: none; }
  @media (max-width: 640px) { .opts.two { grid-template-columns: 1fr; } .prompt { font-size: 20px; } header .hud { margin-left: 0; } }
  @media print {
    body { background: #fff; }
    header, .meter, main { display: none !important; }
    #cert { display: block !important; padding: 40px; text-align: center; border: 6px double #000; margin: 30px; color: #000; }
    #cert h1 { font-size: 40px; margin: 10px 0; }
    #cert .name { font-size: 34px; font-weight: 800; border-bottom: 2px solid #000; display: inline-block; padding: 0 30px 6px; margin: 16px 0; }
    #cert table { margin: 14px auto; border-collapse: collapse; }
    #cert td { border: 1px solid #000; padding: 6px 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">💳</div>
  <div><h1 id="gTitle"></h1><div class="sub" id="gSub"></div></div>
  <div class="hud">
    <span class="chip">Score <b id="hScore">0</b></span>
    <span class="chip" id="hStreakChip">Streak <b id="hStreak">0</b></span>
    <span class="chip">Round <b id="hRound">-</b></span>
  </div>
</header>
<div class="meter" id="meterWrap" hidden>
  <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
  <div class="meter-labels"><span id="meterMin"></span><span id="meterName"></span><span id="meterMax"></span></div>
</div>
<main id="app"></main>
<div id="cert"></div>

<script>
const CONFIG = {
 "lesson": 2,
 "title": "Swipe Smart",
 "tagline": "Credit cards, BNPL and compound interest",
 "icon": "💳",
 "accent": "6D28D9",
 "accentSoft": "EDE9FE",
 "intro": "You've just been handed a credit card with a $2,000 balance on it. Every correct answer pays $80 off the card. Every wrong answer costs you $40 in interest. Four rounds. Can you pay the whole thing off?",
 "meter": {
  "name": "Card paid off",
  "prefix": "$",
  "start": 0,
  "up": 80,
  "down": 40,
  "min": 0,
  "max": 2000,
  "blurb": "Your meter shows how much of the $2,000 card you've paid off.",
  "badge": {
   "icon": "🎉",
   "title": "Debt free",
   "desc": "Pay off the whole $2,000 card",
   "atLeast": 2000
  }
 },
 "verdicts": [
  {
   "min": 90,
   "text": "Card cleared, zero interest. The bank makes no money out of you."
  },
  {
   "min": 70,
   "text": "Nearly debt free. Check your mistake review and you're there."
  },
  {
   "min": 50,
   "text": "You're paying a fair bit of interest. Go back over the mistakes."
  },
  {
   "min": 0,
   "text": "The minimum repayment trap got you this time. Copy your mistakes, then play again."
  }
 ],
 "rounds": [
  {
   "type": "sort",
   "name": "Debit or credit?",
   "buckets": [
    "Debit (your money)",
    "Credit (borrowed)"
   ],
   "intro": "Is each one spending your own money (debit) or borrowed money (credit)? Remember: BNPL is borrowed money.",
   "items": [
    {
     "t": "Tapping a card linked to your everyday bank account",
     "a": 0,
     "why": "A debit card spends money already in your account."
    },
    {
     "t": "Using a card with a $3,000 limit from the bank",
     "a": 1,
     "why": "A credit limit is how much of the bank's money you can borrow."
    },
    {
     "t": "Paying for a $400 jacket in 4 Afterpay instalments",
     "a": 1,
     "why": "BNPL is a loan: the provider pays the shop and you owe them."
    },
    {
     "t": "Money leaves your account straight away",
     "a": 0,
     "why": "That's debit. Credit is paid back later."
    },
    {
     "t": "You get a monthly statement with a minimum repayment",
     "a": 1,
     "why": "Minimum repayments only exist when you owe money."
    },
    {
     "t": "You can't spend more than is in your account",
     "a": 0,
     "why": "Debit stops when your money runs out."
    },
    {
     "t": "Interest is charged if you don't pay the full balance by the due date",
     "a": 1,
     "why": "That's how credit cards charge interest."
    },
    {
     "t": "EFTPOS with your savings at a Werribee supermarket",
     "a": 0,
     "why": "EFTPOS from savings is your own money."
    },
    {
     "t": "Zip Pay for a gaming headset",
     "a": 1,
     "why": "Zip is buy now pay later, which is borrowed money."
    },
    {
     "t": "Your phone bill comes straight out of your bank account",
     "a": 0,
     "why": "A direct debit from your account uses your own money."
    }
   ]
  },
  {
   "type": "mcq",
   "name": "Card and BNPL basics",
   "intro": "Pick the best answer.",
   "items": [
    {
     "q": "When does a credit card's interest-free period actually save you interest?",
     "options": [
      "Always, on every purchase",
      "Only if you pay the full balance by the due date",
      "Only if you pay the minimum",
      "Only on purchases over $100"
     ],
     "a": 1,
     "why": "Pay the whole closing balance by the due date, or interest is charged."
    },
    {
     "q": "What is the average standard credit card interest rate in Australia, roughly?",
     "options": [
      "About 2% a year",
      "About 7% a year",
      "About 20% a year",
      "About 50% a year"
     ],
     "a": 2,
     "why": "RBA data puts the average standard card rate around 20% a year."
    },
    {
     "q": "What is compound interest?",
     "options": [
      "Interest on the original amount only",
      "Interest charged on interest",
      "A fee for paying early",
      "A discount for good customers"
     ],
     "a": 1,
     "why": "Interest is added to what you owe, then you're charged interest on the bigger amount."
    },
    {
     "q": "Why is paying only the minimum repayment a trap?",
     "options": [
      "It hurts your credit score straight away",
      "Most of the payment goes on interest, so the debt barely drops",
      "The bank cancels your card",
      "It's illegal"
     ],
     "a": 1,
     "why": "At the minimum, a $2,000 balance at 20% can take close to 20 years to clear."
    },
    {
     "q": "How does Afterpay make most of its money?",
     "options": [
      "Charging shoppers interest",
      "Fees paid by shops on each sale, plus late fees",
      "Government grants",
      "Selling phones"
     ],
     "a": 1,
     "why": "Shops pay a fee on every sale. Late payers pay late fees."
    },
    {
     "q": "Since 10 June 2025, BNPL providers in Australia must...",
     "options": [
      "Charge 20% interest",
      "Hold a credit licence and check you can afford it",
      "Only sell to people over 25",
      "Stop charging late fees"
     ],
     "a": 1,
     "why": "BNPL is now regulated as credit under the National Credit Act."
    },
    {
     "q": "Which number gives free financial counselling through the National Debt Helpline?",
     "options": [
      "000",
      "131 450",
      "1800 007 007",
      "13 11 14"
     ],
     "a": 2,
     "why": "1800 007 007 is the free, confidential National Debt Helpline."
    },
    {
     "q": "What helps build a good credit score?",
     "options": [
      "Applying for lots of cards at once",
      "Paying every bill and repayment on time",
      "Maxing out your limit",
      "Missing a BNPL payment"
     ],
     "a": 1,
     "why": "On-time repayments are the biggest thing lenders look for."
    }
   ]
  },
  {
   "type": "tf",
   "name": "Myth or fact?",
   "buckets": [
    "Fact",
    "Myth"
   ],
   "intro": "Decide if each statement is a fact or a myth.",
   "items": [
    {
     "t": "Paying only the minimum is the fastest way to clear a credit card.",
     "a": false,
     "why": "It's the slowest way. Most of the payment is interest."
    },
    {
     "t": "Buy now pay later is always cheaper than a credit card.",
     "a": false,
     "why": "Late fees can make BNPL dearer than a low-rate card."
    },
    {
     "t": "A missed BNPL payment can show up on your credit report.",
     "a": true,
     "why": "Lenders can see repayment history, including BNPL."
    },
    {
     "t": "Afterpay was started in Sydney in 2014.",
     "a": true,
     "why": "Nick Molnar and Anthony Eisen founded it in Sydney in 2014."
    },
    {
     "t": "Your credit limit is a spending target you should aim for.",
     "a": false,
     "why": "The limit is the most you can owe, not a goal."
    },
    {
     "t": "Banks generally refund fraud on a stolen card if you report it quickly.",
     "a": true,
     "why": "Unauthorised transactions are usually refunded if you weren't careless."
    },
    {
     "t": "The National Debt Helpline charges a fee for advice.",
     "a": false,
     "why": "It's free and confidential."
    }
   ]
  },
  {
   "type": "num",
   "name": "Compounding maths",
   "intro": "Use a calculator. Compound yearly means multiply by 1.2 for 20% each year. Type the number only.",
   "items": [
    {
     "q": "You owe $1,000 at 20% per year, no repayments. What do you owe after 1 year?",
     "a": 1200,
     "unit": "$",
     "tol": 0.5,
     "why": "$1,000 x 1.2 = $1,200"
    },
    {
     "q": "Same $1,000 at 20%, interest compounding yearly. What do you owe after 2 years?",
     "a": 1440,
     "unit": "$",
     "tol": 0.5,
     "why": "$1,200 x 1.2 = $1,440"
    },
    {
     "q": "Same $1,000 at 20%, compounding yearly. What do you owe after 3 years?",
     "a": 1728,
     "unit": "$",
     "tol": 0.5,
     "why": "$1,440 x 1.2 = $1,728"
    },
    {
     "q": "You owe $500 at 20% per year, compounding yearly, no repayments. What do you owe after 2 years?",
     "a": 720,
     "unit": "$",
     "tol": 0.5,
     "why": "$500 x 1.2 = $600, then $600 x 1.2 = $720"
    },
    {
     "q": "A card has a $2,000 balance at 20% a year. Roughly how much interest is charged in ONE month? (Yearly interest / 12)",
     "a": 33.33,
     "unit": "$",
     "tol": 0.05,
     "why": "$2,000 x 0.20 = $400 a year. $400 / 12 = $33.33"
    },
    {
     "q": "The minimum repayment is 2% of a $2,000 balance. How much is it?",
     "a": 40,
     "unit": "$",
     "tol": 0.5,
     "why": "$2,000 x 0.02 = $40"
    },
    {
     "q": "A $400 purchase is split into 4 equal BNPL payments. How much is each payment?",
     "a": 100,
     "unit": "$",
     "tol": 0.5,
     "why": "$400 / 4 = $100"
    },
    {
     "q": "Afterpay charges $10 for a late payment, then $7 more if it's still unpaid 7 days later. Total late fees on that one payment?",
     "a": 17,
     "unit": "$",
     "tol": 0.5,
     "why": "$10 + $7 = $17"
    }
   ]
  }
 ]
};

const $ = (id) => document.getElementById(id);
const app = $("app");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const S = { name: "", score: 0, streak: 0, best: 0, round: 0, idx: 0, items: [], roundStats: [], mistakes: [], meter: CONFIG.meter ? CONFIG.meter.start : 0, answered: false, total: 0, correct: 0 };

$("gTitle").textContent = CONFIG.title;
$("gSub").textContent = CONFIG.tagline || "";

function setHud() {
  $("hScore").textContent = S.score;
  $("hStreak").textContent = S.streak + (S.streak >= 3 ? " x2" : "");
  $("hRound").textContent = S.round < CONFIG.rounds.length ? `${S.round + 1}/${CONFIG.rounds.length}` : "Done";
  if (CONFIG.meter) {
    const m = CONFIG.meter;
    const pct = Math.max(0, Math.min(100, ((S.meter - m.min) / (m.max - m.min)) * 100));
    $("meterFill").style.width = pct + "%";
    $("meterFill").style.background = pct < 35 ? "var(--bad)" : pct < 65 ? "#F2B705" : "var(--good)";
    $("meterName").textContent = `${m.name}: ${m.prefix || ""}${S.meter.toLocaleString("en-AU")}${m.suffix || ""}`;
  }
}

function floatText(txt, neg) {
  const d = document.createElement("div");
  d.className = "float" + (neg ? " neg" : "");
  d.textContent = txt;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1000);
}

function start() {
  const rounds = CONFIG.rounds.map((r, i) => `<div class="round-pill"><span class="n">${i + 1}</span><b>${esc(r.name)}</b><div class="muted" style="font-size:14px;margin-top:6px">${r.items.length} items</div></div>`).join("");
  app.innerHTML = `
    <div class="card">
      <span class="tag accent">Lesson ${CONFIG.lesson}</span>
      <h2>${esc(CONFIG.title)}</h2>
      <p>${esc(CONFIG.intro)}</p>
      <div class="rounds-list">${rounds}</div>
      <p class="muted">Get 3 in a row and every correct answer is worth double until you miss. ${CONFIG.meter ? esc(CONFIG.meter.blurb || "") : ""}</p>
      <label for="nm"><b>Your first name</b> (goes on your certificate)</label><br><br>
      <input type="text" id="nm" maxlength="30" autocomplete="off" placeholder="First name">
      <div class="row"><button class="big-btn" id="go">Start</button></div>
    </div>`;
  $("nm").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
  $("go").onclick = () => { S.name = $("nm").value.trim() || "Student"; if (CONFIG.meter) $("meterWrap").hidden = false; roundIntro(); };
  setHud();
}

function roundIntro() {
  const r = CONFIG.rounds[S.round];
  S.items = r.shuffle === false ? r.items.slice() : shuffle(r.items);
  S.idx = 0;
  S.roundStats[S.round] = { name: r.name, correct: 0, total: S.items.length };
  setHud();
  app.innerHTML = `
    <div class="card">
      <span class="tag">Round ${S.round + 1} of ${CONFIG.rounds.length}</span>
      <h2>${esc(r.name)}</h2>
      <p>${esc(r.intro)}</p>
      ${r.type === "num" ? `<p class="muted">Type a number only. No $ sign or commas needed.</p>` : ""}
      <div class="row"><button class="big-btn" id="go">Let's go</button></div>
    </div>`;
  $("go").onclick = showItem;
  $("go").focus();
}

function progressBar() {
  return `<div class="progress">${S.items.map((it, i) => `<span class="${i < S.idx ? (it._ok ? "done-ok" : "done-bad") : i === S.idx ? "now" : ""}"></span>`).join("")}</div>`;
}

function showItem() {
  const r = CONFIG.rounds[S.round];
  const it = S.items[S.idx];
  S.answered = false;
  let body = "";
  if (r.type === "sort" || r.type === "tf") {
    const labels = r.type === "tf" ? (r.buckets || ["Fact", "Myth"]) : r.buckets;
    body = `<div class="prompt">${esc(it.t)}</div><div class="opts two">${labels.map((b, i) => `<button class="opt" data-i="${i}">${esc(b)}</button>`).join("")}</div>`;
  } else if (r.type === "mcq") {
    const order = shuffle(it.options.map((o, i) => i));
    body = `<div class="prompt">${esc(it.q)}</div><div class="opts">${order.map((oi, k) => `<button class="opt" data-i="${oi}"><span class="k">${"ABCD"[k]}</span>${esc(it.options[oi])}</button>`).join("")}</div>`;
  } else if (r.type === "num") {
    body = `<div class="prompt">${esc(it.q)}</div><div class="row"><span style="font-size:22px;font-weight:700">${esc(it.unit || "")}</span><input type="number" step="any" id="numIn" inputmode="decimal" placeholder="Your answer"><button class="big-btn" id="numGo">Check</button></div>`;
  }
  app.innerHTML = `
    <div class="card">
      <span class="tag accent">${esc(r.name)}</span>
      <span class="muted" style="float:right">${S.idx + 1} / ${S.items.length}</span>
      ${progressBar()}
      ${body}
      <div class="feedback" id="fb"></div>
      <div class="row" id="nextRow" hidden><button class="big-btn" id="next">Next</button></div>
    </div>`;
  if (r.type === "num") {
    const inp = $("numIn");
    inp.focus();
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") $("numGo").click(); });
    $("numGo").onclick = () => {
      if (S.answered) return;
      const v = parseFloat(String(inp.value).replace(/[$,\s]/g, ""));
      if (isNaN(v)) { inp.focus(); return; }
      const tol = it.tol !== undefined ? it.tol : 0.5;
      answer(Math.abs(v - it.a) <= tol, `Answer: ${it.unit || ""}${Number(it.a).toLocaleString("en-AU", Number.isInteger(it.a) ? {} : { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`, String(v));
      inp.disabled = true;
    };
  } else {
    app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => {
      if (S.answered) return;
      const pick = +b.dataset.i;
      let correctIdx;
      if (r.type === "tf") correctIdx = it.a ? 0 : 1; else correctIdx = it.a;
      const ok = pick === correctIdx;
      app.querySelectorAll(".opt").forEach((x) => { x.disabled = true; if (+x.dataset.i === correctIdx) x.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      const labels = r.type === "tf" ? (r.buckets || ["Fact", "Myth"]) : r.type === "sort" ? r.buckets : it.options;
      answer(ok, `Correct answer: ${labels[correctIdx]}`, labels[pick]);
    }));
  }
}

function answer(ok, correctText, picked) {
  const r = CONFIG.rounds[S.round];
  const it = S.items[S.idx];
  S.answered = true;
  it._ok = ok;
  S.total++;
  const fb = $("fb");
  if (ok) {
    S.correct++;
    S.roundStats[S.round].correct++;
    const pts = S.streak >= 3 ? 20 : 10;
    S.streak++;
    S.best = Math.max(S.best, S.streak);
    S.score += pts;
    if (CONFIG.meter) S.meter = Math.min(CONFIG.meter.max, S.meter + CONFIG.meter.up);
    floatText(`+${pts}`);
    if (S.streak === 3) { const c = $("hStreakChip"); c.classList.remove("streak-flash"); void c.offsetWidth; c.classList.add("streak-flash"); }
    fb.className = "feedback ok";
    fb.innerHTML = `<strong>${esc(pick(CONFIG.praise || ["Nice.", "Correct.", "Spot on.", "That's it."]))}${S.streak >= 3 ? ` Streak x${S.streak}: double points.` : ""}</strong>${esc(it.why || "")}`;
  } else {
    S.streak = 0;
    if (CONFIG.meter) S.meter = Math.max(CONFIG.meter.min, S.meter - CONFIG.meter.down);
    if (CONFIG.meter) floatText(`-${CONFIG.meter.prefix || ""}${CONFIG.meter.down.toLocaleString("en-AU")}${CONFIG.meter.suffix || ""}`, true);
    S.mistakes.push({ round: r.name, q: it.t || it.q, picked, correct: correctText, why: it.why || "" });
    fb.className = "feedback no";
    fb.innerHTML = `<strong>Not quite. ${esc(correctText)}</strong>${esc(it.why || "")}`;
  }
  setHud();
  $("nextRow").hidden = false;
  $("next").focus();
  $("next").onclick = () => {
    S.idx++;
    if (S.idx < S.items.length) showItem();
    else { S.round++; if (S.round < CONFIG.rounds.length) roundIntro(); else finish(); }
  };
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function badges() {
  const pct = S.total ? S.correct / S.total : 0;
  const clean = S.roundStats.some((r) => r.correct === r.total);
  const list = [
    { i: "🏁", t: "Finisher", d: "Completed every round", ok: true },
    { i: "🔥", t: "Hot streak", d: "5 correct in a row", ok: S.best >= 5 },
    { i: "⚡", t: "Unstoppable", d: "10 correct in a row", ok: S.best >= 10 },
    { i: "🧹", t: "Clean round", d: "A perfect round", ok: clean },
    { i: "🎯", t: "Sharp shooter", d: "90% or better overall", ok: pct >= 0.9 },
  ];
  if (CONFIG.meter && CONFIG.meter.badge) list.push({ i: CONFIG.meter.badge.icon, t: CONFIG.meter.badge.title, d: CONFIG.meter.badge.desc, ok: S.meter >= CONFIG.meter.badge.atLeast });
  return list;
}

function finish() {
  setHud();
  const pct = Math.round((S.correct / S.total) * 100);
  const b = badges();
  const verdict = (CONFIG.verdicts || []).find((v) => pct >= v.min) || { text: "Keep practising." };
  app.innerHTML = `
    <div class="card">
      <span class="tag accent">Results</span>
      <h2>${esc(S.name)}, you finished ${esc(CONFIG.title)}</h2>
      <div class="score-big">${S.score} pts</div>
      <p><b>${S.correct} / ${S.total} correct (${pct}%)</b>. Best streak: ${S.best}.${CONFIG.meter ? ` Final ${esc(CONFIG.meter.name.toLowerCase())}: ${CONFIG.meter.prefix || ""}${S.meter.toLocaleString("en-AU")}${CONFIG.meter.suffix || ""}.` : ""}</p>
      <p>${esc(verdict.text)}</p>
      <table class="rounds"><tr><th>Round</th><th>Correct</th></tr>${S.roundStats.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.correct} / ${r.total}</td></tr>`).join("")}</table>
      <h3>Badges</h3>
      <div class="badges">${b.map((x) => `<div class="badge ${x.ok ? "earned" : ""}"><div class="i">${x.i}</div><div class="t">${esc(x.t)}</div><div class="d">${esc(x.d)}</div></div>`).join("")}</div>
      <div class="row"><button class="big-btn" id="cert-btn">Print certificate</button><button class="big-btn ghost" id="again">Play again</button></div>
    </div>
    <div class="card">
      <span class="tag">Mistake review</span>
      ${S.mistakes.length ? `<p>Copy the ones you got wrong into your book with the correct answer.</p>` + S.mistakes.map((m) => `<div class="review-item"><div class="q">${esc(m.q)}</div><div>You said: ${esc(m.picked)}. ${esc(m.correct)}</div><div class="muted">${esc(m.why)}</div></div>`).join("") : `<p>No mistakes. Nothing to review.</p>`}
    </div>`;
  $("again").onclick = () => location.reload();
  $("cert-btn").onclick = () => {
    $("cert").innerHTML = `<div style="font-size:18px;letter-spacing:3px">YEAR 10 BUSINESS  |  LESSON ${CONFIG.lesson}</div>
      <h1>${esc(CONFIG.title)}</h1><div>This certifies that</div><div class="name">${esc(S.name)}</div>
      <div>completed every round with ${S.correct} / ${S.total} correct (${pct}%) and ${S.score} points.</div>
      <table>${S.roundStats.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.correct} / ${r.total}</td></tr>`).join("")}</table>
      <div>Badges: ${b.filter((x) => x.ok).map((x) => esc(x.t)).join(", ")}</div>
      <div style="margin-top:30px">${new Date().toLocaleDateString("en-AU", { day: "numeric", month: "long", year: "numeric" })}</div>`;
    window.print();
  };
}

start();
</script>
</body>
</html>
