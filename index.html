<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Spending Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: a bank-app style game panel on the left, a printed receipt tape logging every answer on the right; stacks on phones. */
:root {
  --bg: #EEF2F6;
  --panel: #FFFFFF;
  --ink: #15233B;
  --muted: #5B6675;
  --line: #D5DCE5;
  --soft: #F2F5F9;
  --green: #0B7A5A;
  --green-soft: #E3F2EC;
  --coral: #C8462A;
  --coral-soft: #FBE7E1;
  --yellow: #FFE066;
  --yellow-soft: #FFF6C7;
  --blue: #2E6FB7;
  --paper: #FFFDF7;
  --on-accent: #FFFFFF;
  --shadow: 0 2px 10px rgba(21,35,59,.10);
  --f-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", Calibri, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1726; --panel: #16233A; --ink: #E8EEF6; --muted: #A3AFC2; --line: #2B3B57; --soft: #1C2B45;
    --green: #3CC394; --green-soft: #133A31; --coral: #F27B5E; --coral-soft: #3F2420;
    --yellow: #FFD84D; --yellow-soft: #3A3317; --blue: #6FA6E8; --paper: #1A2638; --on-accent: #0E1726;
    --shadow: 0 2px 12px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1726; --panel: #16233A; --ink: #E8EEF6; --muted: #A3AFC2; --line: #2B3B57; --soft: #1C2B45;
  --green: #3CC394; --green-soft: #133A31; --coral: #F27B5E; --coral-soft: #3F2420;
  --yellow: #FFD84D; --yellow-soft: #3A3317; --blue: #6FA6E8; --paper: #1A2638; --on-accent: #0E1726;
  --shadow: 0 2px 12px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 44px; height: 44px; border-radius: 12px; background: var(--ink); color: var(--yellow); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 20px; }
.brand h1 { font-size: 28px; font-weight: 800; }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; min-width: 92px; }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .v { font-family: var(--f-mono); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat.jar .v { color: var(--green); }
.stat.streak.hot { border-color: var(--coral); }
.stat.streak.hot .v { color: var(--coral); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 24px; min-width: 0; }
@media (max-width: 500px) { .panel { padding: 18px; } }

/* round chips */
.rounds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.rchip { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.rchip.on { background: var(--ink); color: var(--panel); }
.rchip.done { background: var(--green-soft); color: var(--green); }

.progress { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
.progress span { display: block; height: 100%; background: var(--green); width: 0; transition: width .3s ease; }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-bottom: 6px; }
.prompt { font-family: var(--f-display); font-size: clamp(22px, 3.2vw, 30px); font-weight: 800; margin-bottom: 6px; }
.sub { color: var(--muted); margin: 0 0 18px; }

.item-card { display: flex; align-items: center; gap: 16px; background: var(--soft); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; }
.item-card .tag { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.item-card .name { font-size: 22px; font-weight: 700; }
.item-card .price { margin-left: auto; font-family: var(--f-mono); font-weight: 700; font-size: 20px; color: var(--coral); white-space: nowrap; }
.item-icon { width: 52px; height: 52px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font-size: 26px; flex: none; }

.choices { display: grid; gap: 10px; }
.choices.two { grid-template-columns: 1fr 1fr; }
.choices.four { grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .choices.four { grid-template-columns: 1fr; } }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; border: 2px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 14px; padding: 14px 16px; font-size: 17px; font-weight: 700; transition: transform .1s ease, border-color .15s; }
.choice:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-1px); }
.choice .key { font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; flex: none; }
.choice.big { justify-content: center; font-family: var(--f-display); font-size: 24px; padding: 20px; }
.choice.need { border-color: var(--green); color: var(--green); }
.choice.want { border-color: var(--coral); color: var(--coral); }
.choice.correct { background: var(--green); border-color: var(--green); color: var(--on-accent); }
.choice.wrong { background: var(--coral); border-color: var(--coral); color: var(--on-accent); }
.choice:disabled { cursor: default; }
.choice.dim { opacity: .45; }
.choice.picked .key { background: var(--ink); color: var(--panel); }

.feedback { margin-top: 16px; border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; }
.feedback.good { background: var(--green-soft); }
.feedback.bad { background: var(--coral-soft); }
.feedback strong { font-family: var(--f-display); font-size: 18px; }
.feedback.good strong { color: var(--green); }
.feedback.bad strong { color: var(--coral); }
.row-end { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; background: var(--ink); color: var(--panel); }
.btn.alt { background: var(--soft); color: var(--ink); }
.btn.go { background: var(--green); color: var(--on-accent); }
.btn:disabled { opacity: .4; cursor: default; }

/* statement */
.statement { overflow-x: auto; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 12px; }
.statement table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 420px; }
.statement th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; background: var(--soft); }
.statement td { padding: 7px 12px; border-top: 1px solid var(--line); }
.statement td.amt, .statement th.amt { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.statement td.amt { color: var(--coral); font-weight: 700; }
.statement td.cat { color: var(--blue); font-size: 14px; }
.statement tfoot td { font-weight: 700; background: var(--soft); }

/* order question */
.order-list { display: grid; gap: 8px; }
.order-item { display: flex; align-items: center; gap: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-weight: 700; text-align: left; }
.order-item .slot { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--f-mono); flex: none; }
.order-item.set .slot { border: 0; background: var(--ink); color: var(--panel); }
.scale { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin: 2px 4px 10px; }
.scale .f { color: var(--green); } .scale .v { color: var(--coral); }

/* receipt */
.receipt { background: var(--paper); border-radius: 6px 6px 0 0; box-shadow: var(--shadow); padding: 18px 16px 26px; font-family: var(--f-mono); font-size: 13px; position: relative; min-width: 0;
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
          mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%; }
.receipt h3 { font-family: var(--f-mono); font-size: 15px; text-align: center; letter-spacing: .15em; }
.receipt .meta { text-align: center; color: var(--muted); font-size: 11px; margin: 2px 0 10px; }
.dash { border-top: 1px dashed var(--muted); margin: 8px 0; }
.tape { max-height: 360px; overflow-y: auto; display: grid; gap: 3px; }
.tape .ln { display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: 6px; }
.tape .ln span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tape .ln.ok span:first-child, .tape .ln.ok span:last-child { color: var(--green); }
.tape .ln.no span:first-child, .tape .ln.no span:last-child { color: var(--coral); }
.tape .empty { color: var(--muted); text-align: center; padding: 10px 0; }
.tot { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.badge { font-family: var(--f-body); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 9px; background: var(--soft); color: var(--muted); }
.badge.got { background: var(--yellow); color: #15233B; }

/* start + end */
.hero-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 700px) { .hero-row { grid-template-columns: minmax(0, 1fr); } }
.how { display: grid; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
.how li { display: flex; gap: 10px; align-items: baseline; }
.how li b { font-family: var(--f-mono); color: var(--green); white-space: nowrap; }
.rlist { display: grid; gap: 8px; }
.rcard { background: var(--soft); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.rcard .n { font-family: var(--f-mono); font-weight: 700; background: var(--ink); color: var(--panel); border-radius: 8px; width: 30px; height: 30px; display: grid; place-items: center; flex: none; }
.rcard small { display: block; color: var(--muted); }
label.name { display: block; font-weight: 700; margin: 18px 0 6px; }
input[type=text] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); }

.cert { border: 3px double var(--ink); border-radius: 16px; padding: 24px; text-align: center; background: var(--yellow-soft); margin-bottom: 20px; }
.cert .eyebrow { color: var(--muted); }
.cert h2 { font-size: clamp(26px, 4vw, 38px); margin: 6px 0; }
.cert .who { font-family: var(--f-display); font-size: 26px; font-weight: 800; color: var(--green); margin: 6px 0; overflow-wrap: anywhere; }
.cert .nums { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px 28px; margin-top: 12px; font-family: var(--f-mono); }
.cert .nums b { display: block; font-size: 24px; }
.review { display: grid; gap: 8px; }
.review .mi { background: var(--coral-soft); border-radius: 12px; padding: 10px 14px; }
.review .mi small { color: var(--muted); display: block; }
.allgood { background: var(--green-soft); border-radius: 12px; padding: 12px 14px; color: var(--green); font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 12px; font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
.pop { animation: pop .35s ease; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@media print { body * { visibility: hidden; } #cert, #cert * { visibility: visible; } #cert { position: absolute; left: 0; top: 0; width: 100%; } }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">$</div>
      <div>
        <h1>The Spending Log</h1>
        <p>Tracking Spending · 4 rounds · 35 items</p>
      </div>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat jar"><div class="k">Savings jar</div><div class="v" id="jar">$0</div></div>
      <div class="stat streak" id="streakBox"><div class="k">Streak</div><div class="v" id="streak">0</div></div>
      <div class="stat"><div class="k">Correct</div><div class="v" id="score">0/0</div></div>
    </div>
  </header>

  <div class="grid">
    <main class="panel" id="stage"></main>
    <aside class="receipt" aria-label="Receipt of your answers">
      <h3>RECEIPT</h3>
      <div class="meta" id="rmeta">SPENDING LOG · NOT STARTED</div>
      <div class="dash"></div>
      <div class="tape" id="tape"><div class="empty">Every answer prints here.</div></div>
      <div class="dash"></div>
      <div class="tot"><span>SAVED</span><span id="rtotal">$0</span></div>
      <div class="tot" style="font-size:13px;font-weight:400"><span>LEAKED</span><span id="rleak">$0</span></div>
      <div class="dash"></div>
      <div style="font-size:11px;color:var(--muted)">BADGES</div>
      <div class="badges" id="badges"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// Set to true on the GitHub Pages copy so the certificate can be printed.
const ALLOW_PRINT = true;

const STATEMENT = [
  ["Mon","Kwik-E-Mart","Snacks",12.50],["Mon","Bus Ticket","Transport",5.20],
  ["Tue","Spotify Sub","Subscriptions",11.99],["Wed","Maccas","Food & Drink",18.00],
  ["Thu","Video Game Purchase","Entertainment",89.00],["Fri","Cinema Tickets","Entertainment",35.00],
  ["Sat","New Shoes","Clothing",120.00],["Sun","Coffee","Food & Drink",6.50]
];

const ROUNDS = [
  { id: "nw", name: "Need or want?", short: "Need/Want", blurb: "Could you survive without it?", type: "nw",
    items: [
      ["🏠","Rent for a flat",null,"Need","Somewhere to live is essential."],
      ["🛒","Weekly groceries",null,"Need","Food from the supermarket keeps you alive. That makes it a need."],
      ["💡","Electricity bill",null,"Need","Power for lights, cooking and heating is essential."],
      ["🚌","Bus ticket to school",null,"Need","Getting to school or work is a need."],
      ["📺","Netflix subscription",null,"Want","Nice to have, but you can survive without it."],
      ["👟","New sneakers when your old pair is fine",null,"Want","Shoes are a need. A second pair when yours still work is a want."],
      ["🎤","Concert tickets",null,"Want","Fun, but optional. Discretionary spending."],
      ["📚","School textbooks",null,"Need","You need these to do your schoolwork."],
      ["🍟","Maccas after school",null,"Want","Food is a need, but takeaway when you could eat at home is the want version."],
      ["🎮","In-game skin",null,"Want","Purely optional. A classic small purchase that leaks money."]
    ]},
  { id: "fv", name: "Fixed or variable?", short: "Fixed/Variable", blurb: "Is it the same amount every time?", type: "fv",
    items: [
      ["📱","Phone plan","$35/month","Fixed","A set plan charges the same each month."],
      ["🎵","Spotify subscription","$11.99/month","Fixed","Same price every month, even though it's a want."],
      ["🏋️","Gym membership","$15/week","Fixed","Charged the same whether you go or not."],
      ["🏠","Rent","$450/week","Fixed","Stays the same each period regardless of usage."],
      ["🚗","Car insurance","$90/month","Fixed","A set premium paid on a schedule."],
      ["🛵","Food delivery",null,"Variable","Depends on how often you order and what you get."],
      ["⛽","Petrol",null,"Variable","Changes with how far you drive and the price per litre."],
      ["💡","Electricity bill",null,"Variable","It's a need, but the amount changes with how much power you use."],
      ["🎬","Cinema tickets",null,"Variable","Could be $0 or $50. It's your choice each week."],
      ["🛒","Groceries",null,"Variable","The total moves week to week depending on what you buy."]
    ]},
  { id: "tm", name: "Name the term", short: "Terms", blurb: "Match the description to the key word.", type: "mcq",
    items: [
      ["Money flowing out of your account when you pay for something.", ["Expenditure","Income","Categorisation","Savings"], 0, "Expenditure is the act of spending money; an outflow of funds."],
      ["Optional spending on luxuries or non-essential items.", ["Fixed","Mandatory","Discretionary","Variable"], 2, "Discretionary spending is the 'wants' side of a budget."],
      ["A cost that changes in amount from month to month.", ["Fixed","Variable","Latent","Mandatory"], 1, "Variable costs move with your usage and choices."],
      ["A cost that stays the same amount each period.", ["Discretionary","Variable","Fixed","Impulse"], 2, "Fixed costs are predictable and recurring."],
      ["Grouping expenses so you can see your spending patterns.", ["Expenditure","Categorisation","Budgeting","Saving"], 1, "Categorisation means labelling each expense, like Need, Want, Fixed or Variable."],
      ["A free trial that quietly turned into a $14.99 monthly charge you forgot about.", ["Impulse buy","Variable cost","Latent expense","Mandatory cost"], 2, "Latent expenses happen automatically, so you forget they exist."]
    ]},
  { id: "jd", name: "Jordan's statement", short: "Jordan", blurb: "Use the bank statement to answer.", type: "mcq", statement: true,
    items: [
      ["Which expense is discretionary but also fixed?", ["Bus Ticket","Spotify Sub","Maccas","New Shoes"], 1, "Spotify is a want, but it costs $11.99 every month."],
      ["What was Jordan's single biggest purchase?", ["Video Game Purchase","Cinema Tickets","New Shoes","Maccas"], 2, "New Shoes at $120.00."],
      ["How much did Jordan spend on entertainment?", ["$35.00","$89.00","$124.00","$155.00"], 2, "Video game $89.00 + cinema $35.00 = $124.00."],
      ["What was Jordan's total spending for the week?", ["$283.19","$298.19","$302.69","$291.69"], 1, "12.50 + 5.20 + 11.99 + 18.00 + 89.00 + 35.00 + 120.00 + 6.50 = $298.19."],
      ["Only one line is clearly a need. How much did Jordan spend on needs?", ["$5.20","$11.99","$17.70","$23.20"], 0, "Only the bus ticket ($5.20) is a need."],
      ["Wants were $292.99 out of $298.19. Roughly what percentage went on wants?", ["About 50%","About 75%","About 88%","About 98%"], 3, "292.99 ÷ 298.19 × 100 ≈ 98%."],
      ["Spotify costs $11.99 a month. How much would Jordan save in a year by cancelling it?", ["$119.90","$131.89","$143.88","$71.94"], 2, "$11.99 × 12 months = $143.88."],
      ["What is Jordan's biggest spending weakness?", ["Essential transport costs","Subscription services","Impulse buys and entertainment","Groceries"], 2, "Entertainment, shoes and snacks make up most of the week."],
      { order: true, q: "Tap the items in order from FIXED (1) to MOST VARIABLE (4).",
        items: ["Weekly Bus Ticket","Spotify Subscription","Friday Night Takeaway","Weekly Grocery Budget"],
        answer: ["Spotify Subscription","Weekly Bus Ticket","Weekly Grocery Budget","Friday Night Takeaway"],
        alt: ["Weekly Bus Ticket","Spotify Subscription","Weekly Grocery Budget","Friday Night Takeaway"],
        why: "Spotify and the bus ticket barely change. The grocery budget moves a little. Friday takeaway could be $0 or $60." }
    ]}
];
const TOTAL = ROUNDS.reduce((n, r) => n + r.items.length, 0);

const BADGES = [
  ["first", "First entry"], ["streak5", "Hot streak (5)"], ["streak10", "On fire (10)"],
  ["clean", "Leak plugger"], ["sleuth", "Statement sleuth"], ["boss", "Budget boss"]
];

let S;
function fresh() {
  return { name: "", r: 0, i: 0, jar: 0, leak: 0, streak: 0, best: 0, correct: 0, answered: 0,
           roundMiss: 0, badges: {}, mistakes: [], tape: [], locked: false, order: [] };
}
S = fresh();

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => "$" + n.toLocaleString("en-AU");

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

function renderStats() {
  $("jar").textContent = money(S.jar);
  $("streak").textContent = S.streak + (S.streak >= 3 ? " ×2" : "");
  $("streakBox").classList.toggle("hot", S.streak >= 3);
  $("score").textContent = S.correct + "/" + S.answered;
  $("rtotal").textContent = money(S.jar);
  $("rleak").textContent = money(S.leak);
  const tape = $("tape");
  if (!S.tape.length) tape.innerHTML = '<div class="empty">Every answer prints here.</div>';
  else {
    tape.innerHTML = S.tape.map((l) => `<div class="ln ${l.ok ? "ok" : "no"}"><span>${l.ok ? "✓" : "✗"}</span><span>${esc(l.label)}</span><span>${l.ok ? "+" : "-"}$${l.amt}</span></div>`).join("");
    tape.scrollTop = tape.scrollHeight;
  }
  $("badges").innerHTML = BADGES.map(([k, n]) => `<span class="badge ${S.badges[k] ? "got" : ""}">${S.badges[k] ? "★ " : ""}${n}</span>`).join("");
  $("rmeta").textContent = S.name ? "SPENDING LOG · " + S.name.toUpperCase() : "SPENDING LOG · NOT STARTED";
}

function award(k) {
  if (S.badges[k]) return;
  S.badges[k] = true;
  toast("Badge unlocked: " + BADGES.find((b) => b[0] === k)[1]);
}

function roundChips() {
  return `<div class="rounds">${ROUNDS.map((r, k) => `<span class="rchip ${k === S.r ? "on" : k < S.r ? "done" : ""}">${k + 1}. ${r.short}</span>`).join("")}</div>`;
}
function progress() {
  const done = ROUNDS.slice(0, S.r).reduce((n, r) => n + r.items.length, 0) + S.i;
  return `<div class="progress" aria-hidden="true"><span style="width:${(done / TOTAL) * 100}%"></span></div>`;
}
function statementHTML() {
  const tot = STATEMENT.reduce((n, r) => n + r[3], 0);
  return `<div class="statement"><table><thead><tr><th>Day</th><th>Transaction</th><th>Category</th><th class="amt">Amount</th></tr></thead><tbody>${
    STATEMENT.map((r) => `<tr><td><b>${r[0]}</b></td><td>${esc(r[1])}</td><td class="cat">${esc(r[2])}</td><td class="amt">-$${r[3].toFixed(2)}</td></tr>`).join("")
  }</tbody><tfoot><tr><td colspan="3">Week total</td><td class="amt">-$${tot.toFixed(2)}</td></tr></tfoot></table></div>`;
}

// ---------- screens ----------
function startScreen() {
  $("stage").innerHTML = `
    <div class="eyebrow">Tracking spending</div>
    <h2 class="prompt">Where does your money go?</h2>
    <p class="sub">Sort spending, name the terms, then audit Jordan's bank statement. Every right answer puts money in your savings jar. Every wrong one is a leak.</p>
    <div class="hero-row">
      <div class="rlist">${ROUNDS.map((r, k) => `<div class="rcard"><span class="n">${k + 1}</span><div><b>${r.name}</b><small>${r.items.length} items · ${r.blurb}</small></div></div>`).join("")}</div>
      <div>
        <ul class="how">
          <li><b>+$10</b><span>for each correct answer</span></li>
          <li><b>×2</b><span>once you hit a streak of 3 in a row</span></li>
          <li><b>-$5</b><span>leaks out for each wrong answer</span></li>
          <li><b>★</b><span>badges for streaks, clean rounds and acing Jordan</span></li>
        </ul>
        <label class="name" for="nameIn">Your name (for the certificate)</label>
        <input type="text" id="nameIn" maxlength="40" autocomplete="off" placeholder="First name and surname">
        <div class="row-end"><button class="btn go" id="startBtn">Start the log</button></div>
      </div>
    </div>`;
  $("startBtn").onclick = () => {
    S.name = $("nameIn").value.trim() || "Student";
    renderStats(); question();
  };
  $("nameIn").addEventListener("keydown", (e) => { if (e.key === "Enter") $("startBtn").click(); });
}

function question() {
  S.locked = false; S.order = [];
  const R = ROUNDS[S.r], it = R.items[S.i];
  let html = roundChips() + progress() + `<div class="eyebrow">Round ${S.r + 1} · ${R.name} · ${S.i + 1} of ${R.items.length}</div>`;
  if (R.statement) html += statementHTML();
  if (R.type === "nw" || R.type === "fv") {
    const [ic, name, price] = it;
    const [a, b] = R.type === "nw" ? ["Need", "Want"] : ["Fixed", "Variable"];
    html += `<h2 class="prompt">${R.type === "nw" ? "Need or want?" : "Fixed or variable?"}</h2><p class="sub">${R.blurb}</p>
      <div class="item-card"><div class="item-icon" aria-hidden="true">${ic}</div><div><div class="tag">${R.type === "nw" ? "PURCHASE" : "EXPENSE"}</div><div class="name">${esc(name)}</div></div>${price ? `<div class="price">${esc(price)}</div>` : ""}</div>
      <div class="choices two">
        <button class="choice big need" data-v="${a}">${a}<span class="key" style="margin-left:8px">1</span></button>
        <button class="choice big want" data-v="${b}">${b}<span class="key" style="margin-left:8px">2</span></button>
      </div>`;
  } else if (it.order) {
    html += `<h2 class="prompt">Sort Jordan's spending</h2><p class="sub">${esc(it.q)}</p>
      <div class="scale"><span class="f">1 = Fixed</span><span class="v">4 = Most variable</span></div>
      <div class="order-list">${it.items.map((t, k) => `<button class="order-item" data-k="${k}"><span class="slot"></span><span>${esc(t)}</span></button>`).join("")}</div>
      <div class="row-end"><button class="btn alt" id="resetOrd">Reset</button><button class="btn go" id="checkOrd" disabled>Check order</button></div>`;
  } else {
    const [q, opts] = it;
    html += `<h2 class="prompt">${esc(q)}</h2><p class="sub">Pick one. Keys 1 to 4 work too.</p>
      <div class="choices four">${opts.map((o, k) => `<button class="choice" data-k="${k}"><span class="key">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  html += `<div id="fb"></div>`;
  $("stage").innerHTML = html;

  if (it.order) {
    document.querySelectorAll(".order-item").forEach((b) => b.onclick = () => {
      if (S.locked) return;
      const k = +b.dataset.k;
      const at = S.order.indexOf(k);
      if (at >= 0) S.order.splice(at, 1); else S.order.push(k);
      document.querySelectorAll(".order-item").forEach((x) => {
        const p = S.order.indexOf(+x.dataset.k);
        x.classList.toggle("set", p >= 0);
        x.querySelector(".slot").textContent = p >= 0 ? p + 1 : "";
      });
      $("checkOrd").disabled = S.order.length !== it.items.length;
    });
    $("resetOrd").onclick = () => { if (!S.locked) question(); };
    $("checkOrd").onclick = () => {
      const got = S.order.map((k) => it.items[k]);
      const ok = got.join("|") === it.answer.join("|") || got.join("|") === it.alt.join("|");
      S.locked = true;
      document.querySelectorAll(".order-item").forEach((x) => x.disabled = true);
      $("checkOrd").disabled = true; $("resetOrd").disabled = true;
      resolve(ok, "Fixed to variable order", it.answer.map((t, n) => `${n + 1}. ${t}`).join("  "), it.why, it.q);
    };
  } else {
    document.querySelectorAll(".choice").forEach((b) => b.onclick = () => pick(b));
  }
}

function pick(btn) {
  if (S.locked) return;
  S.locked = true;
  const R = ROUNDS[S.r], it = R.items[S.i];
  const btns = [...document.querySelectorAll(".choice")];
  btns.forEach((b) => b.disabled = true);
  let ok, right, label, why, q;
  if (R.type === "nw" || R.type === "fv") {
    right = it[3]; ok = btn.dataset.v === right; label = it[1]; why = it[4]; q = it[1];
    btns.forEach((b) => { if (b.dataset.v === right) b.classList.add("correct"); else if (b === btn) b.classList.add("wrong"); else b.classList.add("dim"); });
  } else {
    const k = +btn.dataset.k; ok = k === it[2]; right = it[1][it[2]]; why = it[3]; q = it[0];
    label = right;
    btns.forEach((b, n) => { if (n === it[2]) b.classList.add("correct"); else if (b === btn) b.classList.add("wrong"); else b.classList.add("dim"); });
  }
  resolve(ok, label, right, why, q);
}

function resolve(ok, label, right, why, q) {
  S.answered++;
  let amt;
  if (ok) {
    S.correct++; S.streak++; S.best = Math.max(S.best, S.streak);
    amt = S.streak >= 3 ? 20 : 10; S.jar += amt;
    award("first");
    if (S.streak >= 5) award("streak5");
    if (S.streak >= 10) award("streak10");
  } else {
    if (S.streak >= 3) toast("Streak broken at " + S.streak);
    S.streak = 0; S.roundMiss++;
    amt = Math.min(5, S.jar); S.jar -= amt; S.leak += 5;
    amt = 5;
    S.mistakes.push({ round: ROUNDS[S.r].name, q, right, why });
  }
  S.tape.push({ ok, label, amt });
  renderStats();
  $("jar").classList.remove("pop"); void $("jar").offsetWidth; $("jar").classList.add("pop");

  const last = S.i === ROUNDS[S.r].items.length - 1;
  const lastRound = S.r === ROUNDS.length - 1;
  $("fb").innerHTML = `<div class="feedback ${ok ? "good" : "bad"}">
      <strong>${ok ? (amt === 20 ? "Correct! +$20 streak bonus" : "Correct! +$10") : "Not quite. The answer is " + esc(right) + "."}</strong>
      <span>${esc(why)}</span></div>
    <div class="row-end"><button class="btn" id="nextBtn">${last ? (lastRound ? "See my results" : "Finish round") : "Next"}</button></div>`;
  $("nextBtn").focus();
  $("nextBtn").onclick = next;
}

function next() {
  const R = ROUNDS[S.r];
  if (S.i < R.items.length - 1) { S.i++; question(); return; }
  // end of round
  if (S.roundMiss === 0) award("clean");
  if (R.id === "jd" && S.roundMiss === 0) award("sleuth");
  roundEnd();
}

function roundEnd() {
  const R = ROUNDS[S.r];
  const n = R.items.length, got = n - S.roundMiss;
  const lastRound = S.r === ROUNDS.length - 1;
  if (lastRound) { finish(); return; }
  $("stage").innerHTML = roundChips() + progress() + `
    <div class="eyebrow">Round ${S.r + 1} complete</div>
    <h2 class="prompt">${R.name}: ${got} out of ${n}</h2>
    <p class="sub">${S.roundMiss === 0 ? "No leaks this round. Leak plugger badge earned." : S.roundMiss + " leak" + (S.roundMiss > 1 ? "s" : "") + " this round. Check the explanations in your results at the end."}</p>
    <div class="rcard"><span class="n">${S.r + 2}</span><div><b>Up next: ${ROUNDS[S.r + 1].name}</b><small>${ROUNDS[S.r + 1].items.length} items · ${ROUNDS[S.r + 1].blurb}</small></div></div>
    <div class="row-end"><button class="btn go" id="goBtn">Start round ${S.r + 2}</button></div>`;
  $("goBtn").focus();
  $("goBtn").onclick = () => { S.r++; S.i = 0; S.roundMiss = 0; question(); };
}

function finish() {
  const pct = Math.round((S.correct / TOTAL) * 100);
  if (pct >= 90) award("boss");
  renderStats();
  const level = pct >= 90 ? "Budget Boss" : pct >= 75 ? "Smart Spender" : pct >= 50 ? "Money Tracker" : "Getting Started";
  const d = new Date().toLocaleDateString("en-AU", { day: "numeric", month: "long", year: "numeric" });
  $("stage").innerHTML = `
    <div class="cert" id="cert">
      <div class="eyebrow">Certificate of completion</div>
      <h2>The Spending Log</h2>
      <div>This certifies that</div>
      <div class="who">${esc(S.name)}</div>
      <div>tracked every dollar and earned the title <b>${level}</b></div>
      <div class="nums">
        <div><b>${S.correct}/${TOTAL}</b>correct</div>
        <div><b>${pct}%</b>score</div>
        <div><b>${money(S.jar)}</b>saved</div>
        <div><b>${S.best}</b>best streak</div>
      </div>
      <div style="margin-top:12px;font-size:14px;color:var(--muted)">${Object.keys(S.badges).length} of ${BADGES.length} badges · ${d}</div>
    </div>
    <h3 style="margin-bottom:10px">Mistake review</h3>
    <div class="review">${S.mistakes.length ? S.mistakes.map((m) => `<div class="mi"><small>${esc(m.round)}</small><b>${esc(m.q)}</b><br>Answer: ${esc(m.right)}. ${esc(m.why)}</div>`).join("") : '<div class="allgood">No mistakes at all. Every dollar accounted for.</div>'}</div>
    <div class="row-end">
      ${ALLOW_PRINT ? '<button class="btn alt" id="printBtn">Print certificate</button>' : ""}
      <button class="btn go" id="againBtn">Play again</button>
    </div>
    <p class="sub" style="margin-top:12px">Show your teacher this screen, or take a screenshot of your certificate.</p>`;
  if (ALLOW_PRINT) $("printBtn").onclick = () => window.print();
  $("againBtn").onclick = () => { const n = S.name; S = fresh(); S.name = n; renderStats(); question(); };
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4 && !S.locked) {
    const b = document.querySelectorAll(".choice")[n - 1];
    if (b && !b.disabled) b.click();
  }
});

renderStats();
startScreen();
</script>

</body>
</html>
