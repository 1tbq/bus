<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Edge — Cost Leadership or Differentiation?</title>
<style>
  :root{
    --navy:#13293D; --teal:#3A6B67; --gold:#C99A2E;
    --gold-light:#FBF2DD; --teal-light:#E4EDEC; --card:#F2F3F4;
    --white:#FFFFFF; --red:#8C1D18; --text:#13293D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', 'Trebuchet MS', Arial, sans-serif;
    background: linear-gradient(160deg, var(--navy) 0%, #1E3A52 55%, var(--navy) 100%);
    min-height:100vh;
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .app{
    width:100%; max-width:760px;
    background:var(--white);
    border-radius:18px;
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  header{
    background:var(--navy);
    color:var(--white);
    padding:22px 28px 18px;
    position:relative;
  }
  header .eyebrow{
    color:var(--gold); font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
  }
  header h1{
    margin:6px 0 4px; font-size:26px; letter-spacing:0.2px;
  }
  header p{ margin:0; color:#CBD8DE; font-size:14px; }

  .statbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 28px; background:var(--gold-light); border-bottom:1px solid #ECDFB8;
    font-size:14px;
  }
  .statbar .stat{ text-align:center; }
  .statbar .stat .n{ font-size:20px; font-weight:800; color:var(--navy); display:block; }
  .statbar .stat .l{ font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--teal); }

  .progress-track{ height:6px; background:var(--card); }
  .progress-fill{ height:100%; background:var(--gold); width:0%; transition:width .35s ease; }

  main{ padding:30px 28px 26px; min-height:340px; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  .card{
    width:100%; max-width:440px;
    background:var(--card);
    border-radius:14px;
    padding:34px 26px;
    text-align:center;
    border:2px solid transparent;
    transition:transform .25s ease;
  }
  .card .biz-icon{ font-size:40px; margin-bottom:10px; }
  .card h2{ margin:0 0 6px; font-size:28px; color:var(--navy); }
  .card .hint{ font-size:13px; color:var(--teal); font-style:italic; }

  .choices{ display:flex; gap:16px; margin-top:26px; width:100%; max-width:440px; }
  .choice-btn{
    flex:1; padding:16px 10px; border-radius:12px; border:none; cursor:pointer;
    font-size:15px; font-weight:700; letter-spacing:0.3px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .choice-btn:hover{ transform:translateY(-2px); }
  .choice-btn:active{ transform:translateY(0); }
  .choice-btn.cost{ background:var(--navy); color:var(--white); }
  .choice-btn.diff{ background:var(--teal); color:var(--white); }
  .choice-btn small{ display:block; font-weight:400; font-size:11px; opacity:0.85; margin-top:3px; }

  .feedback{
    width:100%; max-width:440px; margin-top:18px; padding:16px 18px; border-radius:12px;
    font-size:14px; line-height:1.5; display:none;
  }
  .feedback.correct{ background:var(--teal-light); border:1px solid var(--teal); display:block; }
  .feedback.wrong{ background:#FBE7E5; border:1px solid var(--red); display:block; }
  .feedback strong{ display:block; margin-bottom:4px; font-size:13px; text-transform:uppercase; letter-spacing:0.5px; }
  .feedback.correct strong{ color:var(--teal); }
  .feedback.wrong strong{ color:var(--red); }

  .next-btn{
    margin-top:16px; background:var(--gold); color:var(--navy); border:none;
    padding:12px 28px; border-radius:30px; font-weight:800; font-size:14px; cursor:pointer;
    letter-spacing:0.3px;
  }
  .next-btn:hover{ filter:brightness(1.05); }

  .streak-pill{
    position:absolute; top:22px; right:28px; background:var(--gold); color:var(--navy);
    padding:6px 14px; border-radius:20px; font-size:12px; font-weight:800; letter-spacing:0.5px;
    opacity:0; transform:scale(0.8); transition:all .25s ease;
  }
  .streak-pill.show{ opacity:1; transform:scale(1); }

  .end-screen{ text-align:center; padding:10px 8px; }
  .end-screen .trophy{ font-size:54px; margin-bottom:6px; }
  .end-screen h2{ color:var(--navy); margin:4px 0 2px; font-size:24px; }
  .end-screen .score-big{ font-size:44px; font-weight:900; color:var(--gold); margin:8px 0 2px; }
  .end-screen .score-sub{ color:var(--teal); font-size:13px; margin-bottom:18px; }

  .badges{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:18px 0 22px; }
  .badge{
    background:var(--card); border-radius:12px; padding:12px 14px; width:120px;
    opacity:0.35; filter:grayscale(1);
  }
  .badge.earned{ opacity:1; filter:none; background:var(--gold-light); border:1px solid var(--gold); }
  .badge .icon{ font-size:26px; }
  .badge .name{ font-size:11px; font-weight:700; color:var(--navy); margin-top:4px; }

  .restart-btn{
    background:var(--navy); color:var(--white); border:none; padding:13px 30px;
    border-radius:30px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .restart-btn:hover{ background:#1E3A52; }

  footer{
    text-align:center; padding:12px; font-size:11px; color:#9AA7AF; background:var(--card);
  }

  @media (max-width:480px){
    .choices{ flex-direction:column; }
    header h1{ font-size:22px; }
    .statbar{ padding:12px 16px; }
    main{ padding:24px 18px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="streak-pill" id="streakPill">🔥 0 streak</div>
    <div class="eyebrow">Year 10 Business · Competitive Advantage -- Prepared By: Tariq Bashir </div>
    <h1>Market Edge</h1>
    <p>Sort each Australian business by how it really wins its market.</p>
  </header>

  <div class="statbar" id="statbar">
    <div class="stat"><span class="n" id="scoreStat">0</span><span class="l">Score</span></div>
    <div class="stat"><span class="n" id="roundStat">1 / 12</span><span class="l">Business</span></div>
    <div class="stat"><span class="n" id="bestStreakStat">0</span><span class="l">Best Streak</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <main id="main"></main>

  <footer>Manor Lakes College &middot; Year 10 Economics &amp; Business &middot; Lesson 10, Week 2</footer>
</div>

<script>
const DATA = [
  { name:"Kmart", icon:"🏬", answer:"cost", evidence:"Lean warehouse-style stores and its Anko private label keep prices low, not the range or the fit-out." },
  { name:"Bunnings", icon:"🔨", answer:"cost", evidence:"A Price Match Guarantee and huge buying power let it out-price independent hardware stores." },
  { name:"ALDI", icon:"🛒", answer:"cost", evidence:"Stocking far fewer product lines than a full supermarket keeps operating costs down." },
  { name:"Jetstar", icon:"✈️", answer:"cost", evidence:"A no-frills base fare, with everything else (bags, seats, meals) sold as an extra." },
  { name:"Chemist Warehouse", icon:"💊", answer:"cost", evidence:"Built its whole brand identity around \"everyday low prices\" at high volume." },
  { name:"The Reject Shop", icon:"🏷️", answer:"cost", evidence:"A variety-discount format designed purely around low shelf prices." },
  { name:"Aesop", icon:"💎", answer:"diff", evidence:"Distinctive packaging and a carefully designed in-store experience, at a premium price." },
  { name:"Qantas", icon:"🦘", answer:"diff", evidence:"Lounges, loyalty points and a safety reputation, a full-service experience beyond just a seat." },
  { name:"Apple", icon:"📱", answer:"diff", evidence:"Design and an ecosystem across devices build loyalty that price alone can't buy." },
  { name:"Canva", icon:"🎨", answer:"diff", evidence:"Wins globally through radical ease of use for people who aren't trained designers." },
  { name:"Adairs", icon:"🛋️", answer:"diff", evidence:"Curated, styled homewares ranges rather than the cheapest sheets on the shelf." },
  { name:"Koala", icon:"🐨", answer:"diff", evidence:"A direct-to-consumer convenience and sustainability story sets it apart from other mattress sellers." }
];

const BADGES = [
  { id:"sharp", threshold:3, icon:"👁️", name:"Sharp Eye", desc:"3-streak" },
  { id:"pro", threshold:6, icon:"📈", name:"Strategy Pro", desc:"6-streak" },
  { id:"master", threshold:12, icon:"🏆", name:"Market Master", desc:"12 in a row, first try" }
];

let order = [];
let idx = 0;
let score = 0;
let streak = 0;
let bestStreak = 0;
let mistakesMade = false;
let earnedBadges = new Set();

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startGame(){
  order = shuffle(DATA);
  idx = 0; score = 0; streak = 0; bestStreak = 0; mistakesMade = false; earnedBadges = new Set();
  document.getElementById("statbar").style.display = "flex";
  document.querySelector(".progress-track").style.display = "block";
  updateStats();
  renderCard();
}

function updateStats(){
  document.getElementById("scoreStat").textContent = score;
  document.getElementById("roundStat").textContent = Math.min(idx+1, DATA.length) + " / " + DATA.length;
  document.getElementById("bestStreakStat").textContent = bestStreak;
  document.getElementById("progressFill").style.width = ((idx)/DATA.length*100) + "%";
}

function showStreakPill(){
  const pill = document.getElementById("streakPill");
  if(streak >= 2){
    pill.textContent = "🔥 " + streak + " streak";
    pill.classList.add("show");
  } else {
    pill.classList.remove("show");
  }
}

function renderCard(){
  const main = document.getElementById("main");
  if(idx >= order.length){
    renderEnd();
    return;
  }
  const item = order[idx];
  main.innerHTML = `
    <div class="card" id="cardEl">
      <div class="biz-icon">${item.icon}</div>
      <h2>${item.name}</h2>
      <div class="hint">How does this business mainly win its market?</div>
    </div>
    <div class="choices">
      <button class="choice-btn cost" id="btnCost">Cost Leadership<small>Compete on price</small></button>
      <button class="choice-btn diff" id="btnDiff">Differentiation<small>Compete on being different</small></button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" style="display:none;">Next business →</button>
  `;
  document.getElementById("btnCost").onclick = () => handleAnswer("cost");
  document.getElementById("btnDiff").onclick = () => handleAnswer("diff");
  updateStats();
  showStreakPill();
}

function handleAnswer(choice){
  const item = order[idx];
  const correct = choice === item.answer;
  document.getElementById("btnCost").disabled = true;
  document.getElementById("btnDiff").disabled = true;

  const fb = document.getElementById("feedback");
  const correctLabel = item.answer === "cost" ? "Cost Leadership" : "Differentiation";

  if(correct){
    streak += 1;
    bestStreak = Math.max(bestStreak, streak);
    const bonus = Math.min(streak, 5) * 2;
    score += 10 + bonus;
    fb.className = "feedback correct";
    fb.innerHTML = `<strong>Correct ${correctLabel}</strong>${item.evidence}`;
  } else {
    streak = 0;
    mistakesMade = true;
    fb.className = "feedback wrong";
    fb.innerHTML = `<strong>Not quite it's ${correctLabel}</strong>${item.evidence}`;
  }

  checkBadges();
  updateStats();
  showStreakPill();
  document.getElementById("nextBtn").style.display = "inline-block";
  document.getElementById("nextBtn").onclick = () => { idx += 1; renderCard(); };
}

function checkBadges(){
  BADGES.forEach(b => {
    if(b.id === "master") return; // evaluated at the end
    if(streak >= b.threshold && !earnedBadges.has(b.id)){
      earnedBadges.add(b.id);
    }
  });
}

function renderEnd(){
  if(!mistakesMade){ earnedBadges.add("master"); }
  updateStats();
  document.getElementById("statbar").style.display = "none";
  document.querySelector(".progress-track").style.display = "none";
  document.getElementById("streakPill").classList.remove("show");

  const pct = Math.round((score / (DATA.length * 20)) * 100);
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="end-screen">
      <div class="trophy">${earnedBadges.size >= 2 ? "🏆" : "📊"}</div>
      <h2>Round complete</h2>
      <div class="score-big">${score}</div>
      <div class="score-sub">points earned · best streak ${bestStreak}</div>
      <div class="badges">
        ${BADGES.map(b => `
          <div class="badge ${earnedBadges.has(b.id) ? "earned" : ""}">
            <div class="icon">${b.icon}</div>
            <div class="name">${b.name}</div>
          </div>
        `).join("")}
      </div>
      <button class="restart-btn" id="restartBtn">Play again</button>
    </div>
  `;
  document.getElementById("restartBtn").onclick = startGame;
}

startGame();
</script>
</body>
</html>
