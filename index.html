<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Business Autopsy</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe6; --card:#fffdf8; --ink:#1d1d1f; --muted:#5b6770;
  --manila:#ead9a8; --manila-dark:#c9b277; --red:#b3261e; --green:#2f6b3a;
  --steel:#2f3a42; --yellow:#fff3a8; --line:#d8cfbf;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
header{background:var(--steel);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
.hud{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font-family:"Special Elite",monospace;font-size:1.25rem;letter-spacing:.5px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600}
.progress{max-width:900px;margin:8px auto 0;height:6px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--manila);transition:width .4s}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 0 var(--line);margin-bottom:18px}
h1,h2,h3{font-family:"Special Elite",monospace;font-weight:400;margin:0 0 10px}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
.folder{background:var(--manila);border:2px solid var(--manila-dark);border-radius:4px 14px 14px 14px;padding:22px;position:relative;margin-top:22px}
.folder:before{content:attr(data-tab);position:absolute;top:-26px;left:-2px;background:var(--manila);border:2px solid var(--manila-dark);border-bottom:none;border-radius:8px 8px 0 0;padding:2px 14px;font-family:"Special Elite",monospace;font-size:.9rem}
.folder ul{margin:8px 0 0;padding-left:20px}
.folder li{margin-bottom:6px}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:"Special Elite",monospace;padding:4px 12px;transform:rotate(-4deg);font-size:1.05rem;letter-spacing:1px;background:rgba(255,255,255,.4)}
.stamp.green{border-color:var(--green);color:var(--green)}
.copy{background:var(--yellow);border-left:6px solid #e0c200;padding:14px 16px;border-radius:8px;margin:14px 0}
.copy strong{display:block;font-size:.8rem;letter-spacing:1px;margin-bottom:4px}
.book{background:var(--steel);color:#fff;border-radius:10px;padding:16px;margin:16px 0}
.book b{color:var(--manila)}
.book ol{margin:8px 0 0;padding-left:20px}
.btn{display:inline-block;border:none;background:var(--steel);color:#fff;font:600 1rem Inter,sans-serif;padding:12px 20px;border-radius:10px;cursor:pointer;margin-top:10px}
.btn:hover{filter:brightness(1.15)}
.btn.alt{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem Inter,sans-serif;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--steel)}
.opt.sel{border-color:var(--steel);background:#eef1f3}
.opt.right{border-color:var(--green);background:#e5f1e7}
.opt.wrong{border-color:var(--red);background:#f8e4e2}
.opt.missed{border-style:dashed;border-color:var(--green)}
.feedback{margin-top:12px;padding:12px 14px;border-radius:10px;display:none}
.feedback.show{display:block}
.feedback.good{background:#e5f1e7;border-left:5px solid var(--green)}
.feedback.bad{background:#f8e4e2;border-left:5px solid var(--red)}
.toetag{display:flex;gap:0;align-items:stretch;margin:16px 0;max-width:620px}
.toetag .hole{width:46px;background:var(--manila);border-radius:24px 0 0 24px;border:2px solid var(--manila-dark);border-right:none;display:flex;align-items:center;justify-content:center}
.toetag .hole span{width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--manila-dark)}
.toetag .body{flex:1;background:var(--manila);border:2px solid var(--manila-dark);border-left:2px dashed var(--manila-dark);border-radius:0 10px 10px 0;padding:14px 18px;font-family:"Special Elite",monospace}
.guru{font-style:italic;border-left:4px solid var(--steel);padding:6px 12px;margin-top:12px;color:var(--steel)}
.small{font-size:.9rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.biz{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font:600 1rem Inter,sans-serif;color:var(--ink)}
.biz.sel{border-color:var(--red);background:#f8e4e2}
textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:10px;padding:12px;font:1rem Inter,sans-serif;background:#fff}
textarea{min-height:110px}
label.tick{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.badge{background:var(--steel);color:#fff;border-radius:10px;padding:8px 12px;font-size:.9rem}
.badge.off{background:#d9d4ca;color:#7b7468}
.cert{border:6px double var(--steel);background:#fffdf8;padding:30px 20px;text-align:center;border-radius:6px}
.cert h1{font-size:1.9rem}
.review li{margin-bottom:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--steel);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;transition:transform .3s;z-index:10}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (max-width:560px){h1{font-size:1.6rem}.card{padding:16px}.folder{padding:16px}}
</style>
</head>
<body>
<header>
  <div class="hud">
    <div class="brand">THE BUSINESS AUTOPSY</div>
    <div class="stats">
      <span class="chip" id="hudCase">Briefing</span>
      <span class="chip">Score: <span id="hudScore">0</span></span>
      <span class="chip">Streak: <span id="hudStreak">0</span></span>
    </div>
  </div>
  <div class="progress"><div id="bar"></div></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const CASES = [
  {
    name:"Kodak", years:"1888 to 2012", tag:"CASE FILE 01",
    file:[
      "Founded in 1888. For decades Kodak was the name in photography, selling film, cameras and printing.",
      "In the 1970s it reportedly sold around 90% of the photographic film bought in the United States.",
      "In 1975 a Kodak engineer, Steve Sasson, built the first digital camera.",
      "Managers were reportedly worried that digital cameras would hurt film sales, which made big profits on every roll.",
      "Other companies like Canon, Sony and later smartphone makers took over digital photography.",
      "In 2012 Kodak filed for bankruptcy."
    ],
    q1:{prompt:"What was the main cause of death?",
      options:["Ignored changes in technology","Unethical behaviour","Got the price wrong","Expanded into too many unrelated businesses"],
      answer:0,
      explain:"Kodak invented the future and then hid it to protect its old product. When customers switched to digital, Kodak was left selling something nobody needed."},
    q2:{prompt:"Which clues from the file are EVIDENCE for that cause? Tick all that apply.",
      options:["Kodak built the first digital camera in 1975","Managers worried digital would hurt film sales","Kodak was founded in 1888","Other companies took over digital photography"],
      answers:[0,1,3]},
    q3:{prompt:"Could Kodak have been saved?",
      options:["Yes, by going all in on digital early, even if it hurt film sales","Yes, by raising the price of film","No, nobody could have predicted digital cameras","Yes, by opening more film shops"],
      answer:0,
      explain:"Kodak had the technology first. Its competitive advantage was sitting in its own lab."},
    report:"Ignored changes in technology. Protected an old, profitable product instead of backing the new one it had invented.",
    guru:"If you won't disrupt yourself, someone else will."
  },
  {
    name:"Dick Smith", years:"1968 to 2016", tag:"CASE FILE 02",
    file:[
      "Started in Sydney in 1968 as an electronics store and grew into a household name across Australia.",
      "In 2012 Woolworths sold the business cheaply to a private equity firm.",
      "About a year later it was listed on the ASX, valued at over $500 million.",
      "It bought huge amounts of stock to earn rebates (payments back) from suppliers, which made profits look bigger.",
      "Much of that stock was products customers didn't want, and it piled up in warehouses.",
      "In January 2016 it collapsed, with around 3,000 jobs lost. Customers holding gift cards were initially told they couldn't use them."
    ],
    q1:{prompt:"What was the main cause of death?",
      options:["Ignored changes in technology","Poor financial decisions","Got the place wrong","Grew too slowly"],
      answer:1,
      explain:"Dick Smith bought stock to make the numbers look good, not because customers wanted it. The profit was on paper, not in the bank."},
    q2:{prompt:"Which clues from the file are EVIDENCE for that cause? Tick all that apply.",
      options:["It started in Sydney in 1968","It bought huge amounts of stock to earn supplier rebates","Unwanted stock piled up in warehouses","It sold electronics"],
      answers:[1,2]},
    q3:{prompt:"Could Dick Smith have been saved?",
      options:["Yes, by buying stock customers actually wanted and being honest about profit","Yes, by opening more stores","No, electronics stores were always going to fail","Yes, by selling more gift cards"],
      answer:0,
      explain:"JB Hi-Fi sold similar products in the same years and survived. The difference was decisions, not the industry."},
    report:"Poor financial decisions. Bought stock to boost rebates and reported profit, then ran out of cash. There is an ethical question too: who was left holding the gift cards?",
    guru:"Profit on paper isn't cash in the bank."
  },
  {
    name:"Blockbuster", years:"1985 to 2010", tag:"CASE FILE 03",
    file:[
      "At its peak Blockbuster had around 9,000 video rental stores around the world.",
      "A big part of its revenue came from late fees, which customers hated.",
      "In 2000 Netflix's founders offered to sell their company to Blockbuster for about US$50 million. Blockbuster said no.",
      "Netflix posted DVDs with no late fees, then moved to streaming.",
      "The stores sold popcorn and lollies at the counter.",
      "Blockbuster filed for bankruptcy in 2010."
    ],
    q1:{prompt:"What was the main cause of death?",
      options:["Unethical behaviour","Too few stores","Ignored changes in technology and the market","Poor promotion"],
      answer:2,
      explain:"Customers moved online and away from late fees. Blockbuster stayed in its stores and passed on buying the company that replaced it."},
    q2:{prompt:"Which clues from the file are EVIDENCE for that cause? Tick all that apply.",
      options:["Blockbuster turned down buying Netflix","It relied on late fees customers hated","Stores sold popcorn and lollies","Netflix moved to no late fees and streaming"],
      answers:[0,1,3]},
    q3:{prompt:"Could Blockbuster have been saved?",
      options:["No, streaming was impossible to compete with","Yes, by buying Netflix or building its own streaming service early","Yes, by raising late fees","Yes, by opening more stores"],
      answer:1,
      explain:"It had the money, the brand and the customers. It just didn't move."},
    report:"Ignored changes in technology and the market. Clung to physical stores and late fees while customers moved online.",
    guru:"Your customers' biggest annoyance is your competitor's biggest opportunity."
  },
  {
    name:"Quibi", years:"April 2020 to December 2020", tag:"CASE FILE 04",
    file:[
      "Quibi was a streaming app for short shows, around 10 minutes each, made only for watching on a phone.",
      "Before launch it raised about US$1.75 billion from investors and paid big Hollywood stars to make shows.",
      "It charged about US$5 a month with ads, or about US$8 a month without ads.",
      "At first you couldn't watch on a TV, and you couldn't easily screenshot or share clips with friends.",
      "It launched in April 2020, right when COVID lockdowns had most people stuck at home with their TVs.",
      "Meanwhile TikTok and YouTube offered short videos for free, and people shared them everywhere.",
      "Quibi announced it was shutting down about six months after it launched."
    ],
    q1:{prompt:"What was the main cause of death?",
      options:["Poor financial decisions","Got the 4 Ps wrong","Unethical behaviour","Expanded too far from its strengths"],
      answer:1,
      explain:"Quibi had plenty of money. The problem was the marketing mix: the wrong product for the moment, a price when rivals were free, the wrong place (phone only) and promotion that people couldn't share."},
    q2:{prompt:"Which clues from the file are EVIDENCE for that cause? Tick all that apply.",
      options:["It charged a monthly fee while TikTok and YouTube were free","You couldn't watch on a TV or easily share clips","It raised about US$1.75 billion","It launched when people were at home with their TVs"],
      answers:[0,1,3]},
    q3:{prompt:"Could Quibi have been saved?",
      options:["Yes, by spending even more on celebrities","Yes, by letting people watch on any screen, share clips and try it free first","No, nobody watches short videos","Yes, by raising the price to look more premium"],
      answer:1,
      explain:"Short video is hugely popular. Quibi's idea wasn't the problem. Its 4 Ps fought against how people actually watch and share."},
    report:"Got the 4 Ps wrong. Charged for something rivals gave away free, limited where people could watch, and made sharing hard, which killed word of mouth.",
    guru:"Money can't buy you customers if the product doesn't fit how they live."
  },
  {
    name:"Theranos", years:"2003 to 2018", tag:"CASE FILE 05",
    file:[
      "Theranos was started in the United States in 2003 by Elizabeth Holmes, who was 19 at the time.",
      "It claimed its machine could run hundreds of medical tests from just a few drops of blood from a finger prick.",
      "Investors poured in money and at one point the company was valued at about US$9 billion.",
      "Behind the scenes, the machines didn't work properly. Many tests were secretly run on normal machines from other companies.",
      "In 2015 a newspaper investigation revealed the problems after workers spoke up.",
      "Theranos shut down in 2018. In 2022 Holmes was found guilty of fraud and later went to prison."
    ],
    q1:{prompt:"What was the main cause of death?",
      options:["Ignored changes in technology","Got the price wrong","Unethical behaviour","Grew too slowly"],
      answer:2,
      explain:"Theranos lied to investors, doctors and patients about what its product could do. Once the truth came out, trust disappeared, and so did the business."},
    q2:{prompt:"Which clues from the file are EVIDENCE for that cause? Tick all that apply.",
      options:["The machines didn't work properly","Tests were secretly run on other companies' machines","Holmes was 19 when she started it","Holmes was found guilty of fraud"],
      answers:[0,1,3]},
    q3:{prompt:"Could Theranos have been saved?",
      options:["Yes, by hiding the problems better","Yes, by being honest about what the technology could and couldn't do, and keeping it in testing until it worked","No, blood testing is impossible to improve","Yes, by raising more money"],
      answer:1,
      explain:"Plenty of businesses take years to get new technology right. Theranos chose to lie instead of wait, and in health that puts real people at risk."},
    report:"Unethical behaviour. Lied about a product that didn't work, putting patients at risk. When the truth came out, trust and the business both collapsed.",
    guru:"Trust takes years to build and one headline to lose."
  },
  {
    name:"Borders and Angus & Robertson (REDgroup)", years:"collapsed 2011", tag:"CASE FILE 06",
    file:[
      "REDgroup Retail owned Borders and Angus & Robertson bookstores across Australia.",
      "Angus & Robertson had been selling books in Sydney since the 1880s.",
      "Books in Australian shops were often much more expensive than the same books on overseas websites.",
      "Shoppers started buying online from overseas sites like Book Depository and Amazon, often with free shipping.",
      "REDgroup was slow to build a strong online store of its own.",
      "In February 2011 REDgroup went into administration and stores across Australia closed."
    ],
    q1:{prompt:"What was the main cause of death?",
      options:["Lost its competitive advantage to global online competitors","Unethical behaviour","Expanded into theme parks","Too many staff"],
      answer:0,
      explain:"Globalisation put an overseas website in every Australian's pocket. On price, the shops couldn't compete, and they had no strong online option."},
    q2:{prompt:"Which clues from the file are EVIDENCE for that cause? Tick all that apply.",
      options:["Books were cheaper on overseas websites","Angus & Robertson dated back to the 1880s","Shoppers bought online from overseas","REDgroup was slow to build its own online store"],
      answers:[0,2,3]},
    q3:{prompt:"Could REDgroup have been saved?",
      options:["No, bookshops are dead","Yes, by building a strong online store early and competing on service and experience, not just price","Yes, by raising prices","Yes, by banning overseas websites"],
      answer:1,
      explain:"Plenty of independent bookshops survived by being a place people want to visit. Price wasn't the only way to win."},
    report:"Lost its competitive advantage. Global online competitors were cheaper and more convenient, and it was slow to go online.",
    guru:"Globalisation means your biggest competitor might be a website on the other side of the world."
  },
  {
    name:"LEGO", years:"STILL ALIVE", tag:"CASE FILE 07: THE TWIST", survivor:true,
    file:[
      "LEGO started making plastic bricks in Denmark in 1949.",
      "In the late 1990s and early 2000s it expanded into theme parks, clothing, video games and TV shows.",
      "Sets used thousands of different unique pieces, which pushed costs up.",
      "By 2003 to 2004 it was losing a lot of money and was reportedly close to running out of cash.",
      "In 2004 a new CEO, Jørgen Vig Knudstorp, took over.",
      "Today LEGO is one of the most profitable toy companies in the world."
    ],
    q1:{prompt:"This patient survived. What nearly killed it?",
      options:["Ignored changes in technology","Expanded too far from its strengths","Unethical behaviour","Prices too low"],
      answer:1,
      explain:"Theme parks, clothes and video games pulled LEGO away from what made it special: the brick."},
    q2:{prompt:"Which clues from the file are EVIDENCE for that cause? Tick all that apply.",
      options:["Expanded into theme parks, clothing, video games and TV","Thousands of unique pieces pushed costs up","LEGO is based in Denmark","It started making bricks in 1949"],
      answers:[0,1]},
    q3:{prompt:"What did the new CEO most likely do to save it?",
      options:["Opened even more theme parks","Cut back to the core brick, cut costs and listened to fans","Lowered quality to save money","Stopped making toys"],
      answer:1,
      explain:"LEGO sold off most of its theme park business, cut the number of unique pieces and went back to the brick, working closely with its most loyal fans."},
    report:"Near death from expanding too far from its strengths. Saved by going back to its competitive advantage: the brick.",
    guru:"Know what you're great at, then do more of it."
  }
];

const BIZ = ["Kmart","Bunnings","Uber Eats","Myer","Netflix","JB Hi-Fi","Westfield shopping centres","Woolworths","Your choice"];
const CAUSES = ["Ignored changes in technology or the market","Lost its competitive advantage","Poor financial decisions","Unethical behaviour","Got the 4 Ps wrong","Expanded too fast or away from its strengths"];

let S = {screen:"intro", c:0, step:"file", score:0, streak:0, best:0, mistakes:[], causeRight:0, evidencePerfect:0, savedRight:0, pm:{biz:null,causes:[],text:""}, name:""};
const app = document.getElementById("app");

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1600);}
function hud(){
  document.getElementById("hudScore").textContent=S.score;
  document.getElementById("hudStreak").textContent=S.streak;
  let label="Briefing", pct=0;
  if(S.screen==="case"){label="Case "+(S.c+1)+" of "+CASES.length; pct=(S.c/(CASES.length+1))*100;}
  if(S.screen==="premortem"){label="Pre-mortem"; pct=(CASES.length/(CASES.length+1))*100;}
  if(S.screen==="end"){label="Case closed"; pct=100;}
  document.getElementById("hudCase").textContent=label;
  document.getElementById("bar").style.width=pct+"%";
}
function award(pts,correct){
  if(correct){S.streak++; S.best=Math.max(S.best,S.streak); let bonus=S.streak>=3?5:0; S.score+=pts+bonus; if(bonus) toast("Streak bonus +5");}
  else{S.streak=0;}
  hud();
}
function go(fn){fn(); window.scrollTo({top:0,behavior:"smooth"});}

function intro(){
  S.screen="intro"; hud();
  app.innerHTML=`
  <div class="card">
    <span class="stamp">CONFIDENTIAL</span>
    <h1 style="margin-top:14px">The Business Autopsy</h1>
    <p>You are a business coroner. Your job is to examine businesses that died (and one that nearly did) and work out the cause of death using everything you've learnt in Business this year.</p>
  </div>
  <div class="copy"><strong>COPY THIS INTO YOUR BOOK</strong>
    <b>Possible causes of death</b>
    <ol>${CAUSES.map(c=>`<li>${c}</li>`).join("")}</ol>
    <b>Every autopsy has three lines:</b><br>
    Cause of death: ...<br>Evidence: ...<br>Could it have been saved? ...
  </div>
  <div class="card">
    <h3>How this works</h3>
    <p>For each case file you will:</p>
    <ol>
      <li>Read the file.</li>
      <li><b>Write your three lines in your book first.</b> Be ready to read them out.</li>
      <li>Then answer the coroner's questions here to check your thinking.</li>
    </ol>
    <p class="small">Points: 10 for the right cause, 5 for each correct piece of evidence, 10 for the best rescue plan. Three right in a row earns a streak bonus.</p>
    <button class="btn alt" onclick="go(()=>{S.screen='case';S.c=0;S.step='file';render()})">Open the first case file</button>
  </div>`;
}

function caseFile(){
  const K=CASES[S.c];
  app.innerHTML=`
  <div class="folder" data-tab="${K.tag}">
    <h2>${K.name}</h2>
    <p class="small" style="margin:0">${K.years}</p>
    <ul>${K.file.map(f=>`<li>${f}</li>`).join("")}</ul>
  </div>
  <div class="book">
    <b>IN YOUR BOOK FIRST</b> (about 4 minutes)
    <ol>
      <li>${K.survivor?"What nearly killed it":"Cause of death"}: ...</li>
      <li>Evidence: two clues from the file</li>
      <li>${K.survivor?"How was it saved":"Could it have been saved"}? ...</li>
    </ol>
  </div>
  <button class="btn" onclick="go(()=>{S.step='q1';render()})">I've written mine. Start the examination</button>`;
}

function q1(){
  const K=CASES[S.c], Q=K.q1;
  app.innerHTML=`
  <div class="card"><h3>${K.name}: Question 1</h3><p><b>${Q.prompt}</b></p>
    <div class="opts">${Q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <div id="next"></div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=i===Q.answer;
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(+x.dataset.i===Q.answer)x.classList.add("right");});
    if(!ok){b.classList.add("wrong"); S.mistakes.push({c:K.name,q:Q.prompt,a:Q.options[Q.answer],why:Q.explain});}
    else S.causeRight++;
    award(10,ok);
    const fb=document.getElementById("fb"); fb.className="feedback show "+(ok?"good":"bad");
    fb.innerHTML=(ok?"<b>Correct diagnosis.</b> ":"<b>Not quite.</b> ")+Q.explain;
    document.getElementById("next").innerHTML=`<button class="btn" onclick="go(()=>{S.step='q2';render()})">Next: gather the evidence</button>`;
  });
}

function q2(){
  const K=CASES[S.c], Q=K.q2;
  app.innerHTML=`
  <div class="card"><h3>${K.name}: Question 2</h3><p><b>${Q.prompt}</b></p>
    <p class="small">Careful: a fact can be true without being evidence for the cause.</p>
    <div class="opts">${Q.options.map((o,i)=>`<label class="tick"><input type="checkbox" value="${i}"> <span>${o}</span></label>`).join("")}</div>
    <button class="btn" id="chk">Check evidence</button>
    <div class="feedback" id="fb"></div>
    <div id="next"></div>
  </div>`;
  document.getElementById("chk").onclick=()=>{
    const boxes=[...app.querySelectorAll("input[type=checkbox]")];
    const picked=boxes.filter(b=>b.checked).map(b=>+b.value);
    if(!picked.length){toast("Tick at least one clue");return;}
    let hits=0, wrong=0;
    boxes.forEach(b=>{
      const i=+b.value, should=Q.answers.includes(i), lab=b.parentElement; b.disabled=true;
      if(b.checked&&should){hits++;lab.classList.add("opt","right");}
      else if(b.checked&&!should){wrong++;lab.classList.add("opt","wrong");}
      else if(!b.checked&&should){lab.classList.add("opt","missed");}
    });
    const perfect=hits===Q.answers.length&&wrong===0;
    S.score+=hits*5; if(perfect){S.evidencePerfect++;}
    award(0,perfect);
    if(!perfect) S.mistakes.push({c:K.name,q:"Evidence",a:Q.answers.map(i=>Q.options[i]).join("; "),why:"Evidence must explain WHY the business died, not just describe it."});
    document.getElementById("chk").disabled=true;
    const fb=document.getElementById("fb"); fb.className="feedback show "+(perfect?"good":"bad");
    fb.innerHTML=perfect?`<b>Sharp eye.</b> All the evidence, nothing extra. +${hits*5}`:`<b>${hits} of ${Q.answers.length} found${wrong?", plus "+wrong+" that isn't evidence":""}.</b> Dashed green boxes are clues you missed. +${hits*5}`;
    document.getElementById("next").innerHTML=`<button class="btn" onclick="go(()=>{S.step='q3';render()})">Next: the rescue question</button>`;
  };
}

function q3(){
  const K=CASES[S.c], Q=K.q3;
  app.innerHTML=`
  <div class="card"><h3>${K.name}: Question 3</h3><p><b>${Q.prompt}</b></p>
    <div class="opts">${Q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <div id="next"></div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=i===Q.answer;
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(+x.dataset.i===Q.answer)x.classList.add("right");});
    if(!ok){b.classList.add("wrong"); S.mistakes.push({c:K.name,q:Q.prompt,a:Q.options[Q.answer],why:Q.explain});}
    else S.savedRight++;
    award(10,ok);
    const fb=document.getElementById("fb"); fb.className="feedback show "+(ok?"good":"bad");
    fb.innerHTML=(ok?"<b>Good call.</b> ":"<b>Not quite.</b> ")+Q.explain;
    document.getElementById("next").innerHTML=`<button class="btn alt" onclick="go(()=>{S.step='report';render()})">Read the coroner's report</button>`;
  });
}

function report(){
  const K=CASES[S.c], last=S.c===CASES.length-1;
  app.innerHTML=`
  <div class="card">
    <span class="stamp ${K.survivor?"green":""}">${K.survivor?"PATIENT SURVIVED":"CASE CLOSED"}</span>
    <h2 style="margin-top:14px">Coroner's report: ${K.name}</h2>
    <div class="toetag"><div class="hole"><span></span></div>
      <div class="body"><b>${K.survivor?"NEAR-DEATH CAUSE":"CAUSE OF DEATH"}:</b><br>${K.report}</div></div>
    <div class="guru">${K.guru}</div>
    <div class="book" style="margin-top:16px"><b>CHECK YOUR BOOK</b><br>Compare your three lines with the report. Add anything you missed in a different colour.</div>
    <button class="btn" onclick="go(()=>{${last?"S.screen='premortem'":"S.c++;S.step='file'"};render()})">${last?"Final task: the pre-mortem":"Open the next case file"}</button>
  </div>`;
}

function premortem(){
  S.screen="premortem"; hud();
  app.innerHTML=`
  <div class="card">
    <span class="stamp">FUTURE CASE</span>
    <h2 style="margin-top:14px">The Pre-mortem</h2>
    <p>Pick a business that exists today. Imagine it is 2036 and the business has died. Your job is to write the autopsy before it happens, then explain what it should do NOW to survive.</p>
    <h3>1. Choose your patient</h3>
    <div class="grid2">${BIZ.map((b,i)=>`<button class="biz" data-i="${i}">${b}</button>`).join("")}</div>
    <div id="own" style="display:none;margin-top:10px"><input type="text" id="ownName" placeholder="Type the business name"></div>
    <h3 style="margin-top:20px">2. What could kill it? Tick one or two</h3>
    <div class="opts">${CAUSES.map((c,i)=>`<label class="tick"><input type="checkbox" class="pc" value="${i}"> <span>${c}</span></label>`).join("")}</div>
    <h3 style="margin-top:20px">3. Write the autopsy (also in your book)</h3>
    <p class="small">Sentence starters: "In 2036, ___ died because..." "The early warning signs were..." "To survive, ___ should start..."</p>
    <textarea id="pmText" placeholder="In 2036, ..."></textarea>
    <button class="btn alt" id="pmGo">Seal the future case file</button>
    <div id="pmOut"></div>
  </div>`;
  app.querySelectorAll(".biz").forEach(b=>b.onclick=()=>{
    app.querySelectorAll(".biz").forEach(x=>x.classList.remove("sel")); b.classList.add("sel");
    S.pm.biz=BIZ[+b.dataset.i]; document.getElementById("own").style.display=S.pm.biz==="Your choice"?"block":"none";
  });
  document.getElementById("pmGo").onclick=()=>{
    let biz=S.pm.biz; if(biz==="Your choice") biz=document.getElementById("ownName").value.trim();
    const causes=[...app.querySelectorAll(".pc:checked")].map(x=>CAUSES[+x.value]);
    const txt=document.getElementById("pmText").value.trim();
    if(!biz){toast("Choose a business first");return;}
    if(!causes.length){toast("Tick at least one cause");return;}
    if(txt.length<40){toast("Write a bit more first");return;}
    S.pm={biz,causes,text:txt};
    document.getElementById("pmOut").innerHTML=`
      <div class="toetag" style="margin-top:20px"><div class="hole"><span></span></div>
      <div class="body"><b>${biz.toUpperCase()}</b> (predicted 2036)<br><b>Cause:</b> ${causes.join("; ")}<br><br>${txt.replace(/</g,"&lt;")}</div></div>
      <p class="small">Be ready to read this out.</p>
      <button class="btn" onclick="go(()=>{S.screen='end';render()})">Exit ticket and results</button>`;
  };
}

function end(){
  hud();
  const max=CASES.length*10*2+CASES.reduce((a,k)=>a+k.q2.answers.length*5,0);
  const B=[
    ["First Incision","Finished your first case",true],
    ["Chief Coroner","Correct cause for every case",S.causeRight===CASES.length],
    ["Sharp Eye","Perfect evidence on 5 or more cases",S.evidencePerfect>=5],
    ["Rescue Specialist","Best rescue plan on 6 or more cases",S.savedRight>=6],
    ["Hot Streak","5 correct in a row",S.best>=5],
    ["Untouchable","10 correct in a row",S.best>=10],
    ["Future Seer","Sealed a pre-mortem",!!S.pm.text]
  ];
  app.innerHTML=`
  <div class="card">
    <h2>Exit ticket</h2>
    <div class="book"><b>IN YOUR BOOK</b><br>Which cause of death on our checklist do you think is the most common? Explain using one case from today.</div>
  </div>
  <div class="card">
    <h2>Your results</h2>
    <p style="font-size:1.3rem"><b>${S.score}</b> points <span class="small">(base maximum ${max}, plus streak bonuses)</span></p>
    <p>Best streak: <b>${S.best}</b></p>
    <div class="badges">${B.map(b=>`<div class="badge ${b[2]?"":"off"}" title="${b[1]}">${b[2]?"&#9733; ":""}${b[0]}<br><span style="font-size:.75rem;opacity:.85">${b[1]}</span></div>`).join("")}</div>
  </div>
  <div class="card">
    <h2>Mistake review</h2>
    ${S.mistakes.length?`<ul class="review">${S.mistakes.map(m=>`<li><b>${m.c}: ${m.q}</b><br>Best answer: ${m.a}<br><span class="small">${m.why}</span></li>`).join("")}</ul>`:"<p>No mistakes. Clean examination.</p>"}
  </div>
  <div class="card">
    <h3>Your certificate</h3>
    <input type="text" id="nm" placeholder="Type your name" value="${S.name}">
    <div class="cert" style="margin-top:14px">
      <span class="stamp">OFFICIAL</span>
      <h1 style="margin-top:14px">Certified Business Coroner</h1>
      <p>This certifies that</p>
      <h2 id="certName">${S.name||"Your name"}</h2>
      <p>examined ${CASES.length} business case files and scored <b>${S.score}</b> points.</p>
      <p class="small">Year 10 Business · The Business Autopsy</p>
    </div>
    <button class="btn" onclick="if(confirm('Start again from the beginning?')){location.reload()}">Start again</button>
  </div>`;
  document.getElementById("nm").oninput=e=>{S.name=e.target.value;document.getElementById("certName").textContent=S.name||"Your name";};
}

function render(){
  hud();
  if(S.screen==="intro") return intro();
  if(S.screen==="premortem") return premortem();
  if(S.screen==="end") return end();
  ({file:caseFile,q1,q2,q3,report})[S.step]();
}
render();
</script>
</body>
</html>
