<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year 10 Business Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Martian+Mono:wdth,wght@75..112.5,400..700&display=swap">
<style>
/* Layout: a classroom game hub. Sticky scoreboard band, a hero that looks like a marked-up bank statement,
   round cards with chunky arcade-button shadows, and paper documents (receipts, pay slips, statements) as the play surface. */
:root{
  --paper:#F2F4F8; --card:#FFFFFF; --sunk:#E7EBF3; --ink:#121C45; --muted:#56607F; --line:#D2D8E6;
  --biro:#2A4FD0; --flag:#C42F1C; --ok:#127A4B; --amber:#9A5800;
  --hi:#FFE14D; --on-hi:#121C45;
  --thermal:#FFFFFF; --thermal-ink:#24262C; --bubble:#E4E9F2;
  --shadow:0 1px 0 rgba(18,28,69,.06),0 10px 26px -14px rgba(18,28,69,.35);
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Martian Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1330; --card:#171E44; --sunk:#10163A; --ink:#E9EDFA; --muted:#A3ACCB; --line:#2C3566;
    --biro:#86A2FF; --flag:#FF7A66; --ok:#4AD39A; --amber:#FFB54A;
    --hi:#F7D544; --on-hi:#121C45;
    --thermal:#ECEEF3; --thermal-ink:#24262C; --bubble:#232B5A;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1330; --card:#171E44; --sunk:#10163A; --ink:#E9EDFA; --muted:#A3ACCB; --line:#2C3566;
  --biro:#86A2FF; --flag:#FF7A66; --ok:#4AD39A; --amber:#FFB54A;
  --hi:#F7D544; --on-hi:#121C45;
  --thermal:#ECEEF3; --thermal-ink:#24262C; --bubble:#232B5A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto}
a{color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
p{margin:0}
.eyebrow{font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--biro);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}

/* Header band */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1.5px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.15rem;white-space:nowrap}
.brand-mark{background:var(--hi);color:var(--on-hi);padding:.05em .35em;border-radius:.2em .45em .25em .5em;transform:rotate(-2deg);display:inline-block}
.board{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;padding:3px 2px}
.team{display:inline-flex;align-items:baseline;gap:8px;padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap}
.team .tname{font-weight:700;font-size:.9rem}
.team .tscore{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.team.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}
.team.bump{animation:bump .6s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1)}}
.actions{display:flex;gap:8px}
.small-btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.small-btn:hover{border-color:var(--ink)}
@media (max-width:700px){
  .board{order:3;flex-basis:100%}
  .actions{margin-left:auto}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;text-decoration:none;cursor:pointer;
  border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 18px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent;text-decoration:underline;text-underline-offset:4px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

main{padding-block:28px 56px}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:center;padding-block:18px 36px}
.hero h1{font-size:clamp(2.7rem,7vw,5.4rem);font-weight:800;letter-spacing:-.02em;line-height:.95;margin-block:12px 18px;font-variation-settings:"opsz" 96}
.hl{background:linear-gradient(transparent 10%,var(--hi) 10%,var(--hi) 90%,transparent 90%);color:var(--on-hi);padding:0 .12em;border-radius:.15em .5em .2em .45em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lead{font-size:1.15rem;color:var(--muted);max-width:34em}
.hero .cta{margin-top:24px}
.hero-art{display:grid;gap:18px;justify-items:start}
.art-sms{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);max-width:340px;transform:rotate(-1.5deg)}
.art-sms .art-from{font-weight:700;font-size:.85rem;color:var(--muted)}
.art-sms p{background:var(--bubble);border-radius:16px 16px 16px 4px;padding:10px 12px;margin-top:8px}
.art-sms mark{background:linear-gradient(transparent 8%,var(--hi) 8%,var(--hi) 92%,transparent 92%);color:var(--on-hi);text-decoration:underline wavy var(--flag) 1.5px;text-underline-offset:4px}
.art-stmt{background:var(--thermal);color:var(--thermal-ink);font-family:var(--mono);font-stretch:87.5%;font-size:.74rem;border-radius:6px;padding:14px 16px;box-shadow:var(--shadow);width:100%;max-width:440px;justify-self:end;transform:rotate(1deg)}
.art-stmt .art-h{font-weight:700;letter-spacing:.06em;border-bottom:1.5px dashed #9096a3;padding-bottom:6px;margin-bottom:4px}
.art-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #dde0e6}
.art-row:last-child{border-bottom:0}
.stamp{font-family:var(--display);font-style:normal;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;border:2.5px solid currentColor;border-radius:4px;padding:.1em .45em;transform:rotate(-5deg);white-space:nowrap;display:inline-block}
.s-match{color:#127A4B}.s-wrong{color:#9A5800}.s-dupe{color:#2A4FD0}.s-chase{color:#C42F1C}
.coverage{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-block:14px;border-block:1.5px solid var(--line);margin-bottom:28px;color:var(--muted)}
.coverage b{color:var(--ink)}
.rounds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:980px){.rounds{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr;gap:28px}.art-stmt{justify-self:start}}
@media (max-width:620px){.rounds{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:20px;box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.card:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.card h2{font-size:1.65rem;font-weight:800}
.card p{color:var(--muted)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-foot{margin-top:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:8px;font-size:.88rem}
.card-foot .meta{font-family:var(--mono);font-stretch:87.5%;font-size:.75rem;color:var(--muted)}
.card-foot .best{font-family:var(--mono);font-size:.75rem;background:var(--sunk);padding:2px 8px;border-radius:99px}
.card-foot .go{margin-left:auto;font-weight:700}
.card.boss{grid-column:1/-1;background:var(--ink);color:var(--paper);box-shadow:0 5px 0 var(--hi);border-color:var(--ink)}
.card.boss:hover{box-shadow:0 7px 0 var(--hi)}
.card.boss h2{font-size:clamp(1.8rem,4vw,2.6rem)}
.card.boss p,.card.boss .eyebrow,.card.boss .meta{color:var(--paper);opacity:.85}
.card.boss .best{background:transparent;border:1px solid var(--paper)}
.chip{display:inline-flex;align-items:center;font-family:var(--display);font-weight:700;font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;padding:.2em .6em;border-radius:6px;border:1.5px solid var(--u);color:var(--u);white-space:nowrap}
.u-scams{--u:var(--flag)} .u-money{--u:var(--biro)} .u-enterprise{--u:var(--ok)} .u-all{--u:var(--hi)}
.chip.u-all{background:var(--hi);color:var(--on-hi)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:40px;padding-top:24px;border-top:1.5px solid var(--line)}
.howto h3{font-size:1.1rem;margin-bottom:6px}
.howto p{color:var(--muted);font-size:.95rem}
@media (max-width:760px){.howto{grid-template-columns:1fr}}
.foot{margin-top:32px;color:var(--muted);font-size:.85rem}

/* Round view */
.round-head{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.back{font-weight:700;text-decoration:none;color:var(--muted);width:max-content}
.back:hover{color:var(--ink)}
.round-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.round-title h1{font-size:clamp(1.9rem,4.5vw,3rem);font-weight:800;letter-spacing:-.01em}
.round-meta{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;font-size:.92rem;color:var(--muted);min-height:30px}
.round-meta .roundpts{font-family:var(--mono);font-size:.8rem;margin-left:auto}
.turn{display:inline-flex;gap:6px;align-items:center;background:var(--hi);color:var(--on-hi);font-weight:700;padding:3px 12px;border-radius:99px}
.turn .dot{width:8px;height:8px;border-radius:50%;background:var(--on-hi);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:10px 0 26px}
.progress span{display:block;height:100%;width:0;background:var(--ink);transition:width .4s ease}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:880px){.split{grid-template-columns:1fr;gap:22px}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.prompt{font-family:var(--display);font-size:1.45rem;font-weight:700;line-height:1.2;text-wrap:balance}
.hint{color:var(--muted);font-size:.92rem}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choices.grid{grid-template-columns:1fr 1fr}
@media (max-width:520px){.choices.grid{grid-template-columns:1fr}}
.choice{display:flex;gap:12px;align-items:center;text-align:left;font-weight:700;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,opacity .2s}
.choice:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.choice:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice:disabled{cursor:default}
.choice .key{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--sunk);font-family:var(--mono);font-size:.78rem}
.choice .ctext{min-width:0}
.choice small{display:block;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:2px}
.choice.big{font-family:var(--display);font-size:1.7rem;font-weight:800;justify-content:center;padding:20px 14px}
.choice.correct{background:color-mix(in srgb,var(--ok) 16%,var(--card));border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.choice.wrong{background:color-mix(in srgb,var(--flag) 14%,var(--card));border-color:var(--flag);box-shadow:0 4px 0 var(--flag)}
.choice.meh{background:color-mix(in srgb,var(--amber) 14%,var(--card));border-color:var(--amber);box-shadow:0 4px 0 var(--amber)}
.choice.dim{opacity:.45}
.feedback{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;animation:rise .25s ease}
.feedback.good{border-color:var(--ok)}
.feedback.bad{border-color:var(--flag)}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.fb-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fb-head strong{font-family:var(--display);font-size:1.3rem;font-weight:800}
.good .fb-head strong{color:var(--ok)} .bad .fb-head strong{color:var(--flag)}
.pts{font-family:var(--mono);font-size:.8rem;font-weight:700;background:var(--hi);color:var(--on-hi);padding:3px 10px;border-radius:99px}
.fb-line{font-weight:700}
.tip{background:var(--sunk);padding:10px 12px;border-radius:10px;font-size:.95rem}
.working{font-family:var(--mono);font-stretch:87.5%;font-size:.88rem;background:var(--sunk);padding:8px 12px;border-radius:8px}
.reasons ol{margin:6px 0 0;padding-left:1.6em;display:grid;gap:6px}
.reasons li::marker{font-family:var(--mono);font-weight:700;color:var(--flag)}
.reasons li.o::marker{color:var(--ok)}
.nextrow{display:flex;justify-content:flex-end}
.mini{font-size:.9rem;font-weight:700;margin-top:6px}
.mini.good{color:var(--ok)} .mini.bad{color:var(--flag)}

/* Message mock-ups */
.mock{background:var(--card);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;font-size:1.06rem;min-width:0}
.ph-top{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1.5px solid var(--line)}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:700}
.ph-name{font-weight:700;overflow-wrap:anywhere}
.ph-meta{font-size:.82rem;color:var(--muted)}
.bubble{margin:18px 16px 22px;padding:12px 15px;background:var(--bubble);border-radius:18px 18px 18px 4px;max-width:94%;white-space:pre-line;overflow-wrap:anywhere}
.email-row{display:flex;gap:12px;padding:10px 16px;border-bottom:1.5px solid var(--line);align-items:baseline;overflow-wrap:anywhere}
.email-row .lbl{flex:none;width:62px;font-family:var(--mono);font-stretch:87.5%;font-size:.72rem;text-transform:uppercase;color:var(--muted)}
.email-row .subj{font-weight:700}
.email-body{padding:16px;white-space:pre-line;overflow-wrap:anywhere}
.call-top{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--paper);padding:12px 16px;font-weight:700}
.call-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:pulse 1s infinite}
.call-label{padding:14px 16px 0;font-size:.82rem;color:var(--muted)}
.call-body{margin:8px 16px 20px;padding-left:14px;border-left:3px solid var(--line);font-style:italic}
.ad-creative{background:var(--biro);color:var(--paper);font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,5vw,2.6rem);padding:28px 16px;text-align:center}
.ad-body{padding:14px 16px}
.ad-cta{margin:0 16px 16px;padding:8px;text-align:center;border-radius:8px;background:var(--sunk);font-weight:700;font-size:.9rem}
.shop-top{background:var(--sunk);padding:8px 14px;font-family:var(--mono);font-stretch:87.5%;font-size:.78rem;overflow-wrap:anywhere}
.shop-name{font-size:1.5rem;font-weight:800;padding:14px 16px 4px}
.shop-lines{list-style:none;margin:0;padding:4px 16px 14px}
.shop-lines li{padding:9px 0;border-bottom:1px dashed var(--line)}
.shop-lines li:last-child{border-bottom:0}
.seg{border-radius:.2em;transition:background .2s}
.revealed .seg.flag,.hunt .seg.found{background:linear-gradient(transparent 6%,var(--hi) 6%,var(--hi) 94%,transparent 94%);color:var(--on-hi);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .1em}
.revealed .seg.flag{text-decoration:underline wavy var(--flag) 1.5px;text-underline-offset:4px}
.revealed .seg.okseg{background:color-mix(in srgb,var(--ok) 20%,transparent);text-decoration:underline var(--ok) 2px;text-underline-offset:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hunt .seg.tap{cursor:pointer}
.hunt:not(.over) .seg.tap:not(.found):not(.nope):hover{background:var(--sunk);outline:1.5px dashed var(--muted)}
.hunt .seg.nope{text-decoration:line-through var(--flag) 2px;opacity:.6}
.hunt .seg.missed{outline:2px dashed var(--flag);outline-offset:1px}
.seg .num{font-family:var(--mono);font-style:normal;font-size:.6em;font-weight:700;background:var(--flag);color:var(--paper);border-radius:99px;padding:.1em .45em;margin-left:.25em;vertical-align:super;text-decoration:none;display:inline-block;line-height:1.3}
.seg.okseg .num{background:var(--ok)}
.counter{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.counter .big{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1}
.counter .miss{color:var(--muted)}

/* Paper documents */
.stage{display:flex;justify-content:center;min-width:0}
.receipt{position:relative;width:min(100%,320px);background:var(--thermal);color:var(--thermal-ink);font-family:var(--mono);font-stretch:87.5%;font-size:.8rem;line-height:1.6;padding:20px 20px 24px;margin-bottom:14px;box-shadow:var(--shadow)}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(45deg,transparent 33.33%,var(--thermal) 33.33%,var(--thermal) 66.66%,transparent 66.66%),linear-gradient(-45deg,transparent 33.33%,var(--thermal) 33.33%,var(--thermal) 66.66%,transparent 66.66%);background-size:20px 40px;background-position:0 -20px}
.r-title{text-align:center;font-weight:700;font-size:1.05em;letter-spacing:.04em}
.r-line{text-align:center}
.r-row{display:flex;justify-content:space-between;gap:14px}
.r-row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.r-div{border-top:1.5px dashed #9096a3;margin:8px 0}
.payslip{width:min(100%,460px);background:var(--thermal);color:var(--thermal-ink);font-family:var(--mono);font-stretch:87.5%;font-size:.82rem;padding:22px;border-radius:6px;box-shadow:var(--shadow);display:grid;gap:6px}
.ps-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:2px solid var(--thermal-ink);padding-bottom:8px}
.ps-head strong{font-size:1.2em;letter-spacing:.08em}
.ps-row{display:flex;justify-content:space-between;gap:14px;align-items:center}
.ps-row.strong{font-weight:700;font-size:1.05em}
.ps-row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.ps-hr{border-top:1.5px dashed #9096a3;margin:4px 0}
.blank{display:inline-block;min-width:5.5em;text-align:center;border:1.5px dashed currentColor;border-radius:4px;padding:0 .4em}
.blank.now{background:#FFE14D;border-style:solid;color:#121C45;animation:pulse 1.4s infinite}
.numform{display:flex;flex-direction:column;gap:12px}
.numrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.num-wrap{display:flex;align-items:center;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding-left:12px;flex:1;min-width:160px}
.num-wrap span{font-family:var(--mono);font-weight:700}
.num-in{font:inherit;font-family:var(--mono);font-size:1.25rem;border:0;background:transparent;color:var(--ink);padding:10px 12px 10px 6px;width:100%;min-width:0}
.num-in:focus{outline:none}
.num-wrap:focus-within{outline:3px solid var(--biro);outline-offset:2px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.pricecard{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:24px;box-shadow:0 5px 0 var(--ink);display:grid;gap:10px}
.tag{font-family:var(--display);font-weight:800;font-size:clamp(3rem,10vw,5.4rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.timer span{display:block;height:100%;width:100%;background:var(--biro)}
.timer.low span{background:var(--flag)}
.secs{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.checklist{margin:4px 0 0;padding-left:1.3em;font-size:.92rem;display:grid;gap:3px}

/* Statement */
.prompt.wide{margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:10px 0 20px;font-size:.88rem;color:var(--muted)}
.legend .stamp{margin-right:6px;transform:rotate(-3deg)}
.detective{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:980px){.detective{grid-template-columns:1fr}}
.records{display:grid;gap:12px}
@media (max-width:980px){.records{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.rec{background:var(--thermal);color:var(--thermal-ink);font-family:var(--mono);font-stretch:87.5%;font-size:.74rem;padding:10px 12px;border-radius:4px;box-shadow:var(--shadow);transform:rotate(var(--r,0deg))}
.rec b{display:block;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.tablewrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
table.stmt{border-collapse:collapse;width:100%;min-width:820px;font-family:var(--mono);font-stretch:87.5%;font-size:.76rem;font-variant-numeric:tabular-nums}
.stmt th{text-align:left;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.stmt td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.stmt .num{text-align:right;white-space:nowrap}
.stmt tr.open td{color:var(--muted)}
.stmt tr.is-right td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.stmt tr.is-wrong td:first-child{box-shadow:inset 4px 0 0 var(--flag)}
.stmt tr.reason td{font-family:var(--body);font-stretch:100%;font-size:.88rem;background:var(--sunk)}
.stmt tr.reason.r-ok b{color:var(--ok)} .stmt tr.reason.r-bad b{color:var(--flag)}
.stamps{display:flex;gap:5px}
.st{font-family:var(--display);font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:5px;padding:4px 7px;cursor:pointer;white-space:nowrap;transition:transform .1s}
.st:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.st[aria-pressed="true"]{border:2.5px solid currentColor;transform:rotate(-4deg)}
.st-match[aria-pressed="true"]{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.st-wrong[aria-pressed="true"]{color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.st-dupe[aria-pressed="true"]{color:var(--biro);background:color-mix(in srgb,var(--biro) 12%,transparent)}
.st-chase[aria-pressed="true"]{color:var(--flag);background:color-mix(in srgb,var(--flag) 12%,transparent)}
.st:disabled{cursor:default}
.checkrow{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.checkrow .btn{align-self:flex-end}
.casefile{background:var(--thermal);color:var(--thermal-ink);font-family:var(--mono);font-stretch:87.5%;font-size:.8rem;padding:18px 20px;border-radius:6px;box-shadow:var(--shadow)}
.casefile .eyebrow{color:#56607F}
.casefile ul{list-style:none;margin:10px 0;padding:0}
.casefile li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-bottom:1px dashed #b9bec9}
.casefile li small{grid-column:2/-1;color:#9A3A12}
.casefile .closing{display:flex;justify-content:space-between;font-weight:700;padding-top:6px}

/* Enterprise */
.quote{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:24px;box-shadow:0 5px 0 var(--ink);display:grid;gap:12px}
.quote p.q{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.4}
.bee{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:24px;box-shadow:0 5px 0 var(--ink);display:grid;gap:12px}
.bee-text{font-size:1.3rem;line-height:1.75}
.gap{border-bottom:2px dashed var(--muted);color:var(--muted);padding:0 .2em}
.gap.filled{border-bottom:0;color:var(--on-hi);background:linear-gradient(transparent 6%,var(--hi) 6%,var(--hi) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.step{display:flex;flex-direction:column;gap:10px}
.answers{display:grid;gap:12px}
.ans{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px}
.ans b{font-family:var(--display);font-size:1.4rem;line-height:1}

/* Boss */
.meters{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.meter{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;min-width:160px}
.meter b{font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.meter .of{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.delta{position:absolute;right:10px;top:8px;font-family:var(--mono);font-size:.8rem;font-weight:700;animation:floatup 1.6s ease forwards}
.delta.up{color:var(--ok)} .delta.down{color:var(--flag)}
@keyframes floatup{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.scene{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:22px;box-shadow:0 5px 0 var(--ink);display:grid;gap:14px;min-width:0}
.scene h2{font-size:1.9rem;font-weight:800}
.scene .mock{box-shadow:none}

/* Results */
.done{display:grid;gap:16px;max-width:760px}
.done h2{font-size:clamp(2.4rem,7vw,4.2rem);font-weight:800}
.standings{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:460px}
.standings li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-weight:700}
.standings li:first-child{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}
.standings span:last-child{font-family:var(--mono)}
.rank{font-family:var(--display);font-weight:800;font-size:1.6rem}
.learned{margin:0;padding-left:1.2em;display:grid;gap:6px}

/* Overlay, toast, fx */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,#060a1c 55%,transparent)}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:24px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;display:grid;gap:16px;box-shadow:0 6px 0 var(--ink)}
.panel h2{font-size:1.8rem;font-weight:800}
.seg-toggle{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg-toggle button{border:0;background:var(--card);padding:10px;font-weight:700;cursor:pointer}
.seg-toggle button.on{background:var(--ink);color:var(--paper)}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.88rem}
.field input,.field select{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink)}
.field input:focus,.field select:focus{border-color:var(--ink);outline:none}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.names{grid-template-columns:1fr}}
.panel-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>

<header class="bar">
  <div class="wrap gutter">
    <a class="brand" href="#"><span class="brand-mark">Y10</span> Business Arcade</a>
    <div class="board" id="board" aria-label="Scores"></div>
    <div class="actions">
      <button class="small-btn" id="teams-btn" type="button">Teams</button>
      <button class="small-btn" id="sound-btn" type="button" aria-pressed="true">Sound on</button>
    </div>
  </div>
</header>
<main id="app" class="wrap gutter"></main>
<div class="overlay" id="setup" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" hidden></canvas>

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;

    el.append(k.nodeType ? k : document.createTextNode(String(k)));

const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const r2 = n => Math.round(n * 100) / 100;
const money = n => (n < 0 ? '−$' : '$') + Math.abs(r2(n)).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const store = {
  get(k, d) { try { const v = localStorage.getItem('y10arcade:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('y10arcade:' + k, JSON.stringify(v)); } catch (e) {} }
};
const DEFAULT_NAMES = ['Gross', 'Net', 'Super', 'GST', 'PAYG', 'BPAY'];
const S = {
  mode: store.get('mode', 'solo'),
  teams: store.get('teams', [{ name: 'You', score: 0 }]),
  turn: 0,
  sound: store.get('sound', true),
  best: store.get('best', {})
};
if (!Array.isArray(S.teams) || !S.teams.length) S.teams = [{ name: 'You', score: 0 }];
function persist() { store.set('mode', S.mode); store.set('teams', S.teams); store.set('sound', S.sound); store.set('best', S.best); }

/* ---------- sound ---------- */
let ac;
function tone(freq, dur, type = 'sine', when = 0, vol = .14) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}

const sfx = {
  good() { tone(660, .12, 'triangle'); tone(990, .2, 'triangle', .1); },
  bad() { tone(190, .28, 'sawtooth', 0, .07); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .22, 'triangle', i * .12)); }
};

/* ---------- scoreboard ---------- */
const teamSuffix = () => S.teams.length > 1 ? ' to ' + S.teams[S.turn].name : '';
function renderBoard(bumpIdx) {
  const b = $('#board'); b.innerHTML = '';
  S.teams.forEach((t, i) => {
    b.append(h('button', {
      class: 'team' + (S.teams.length > 1 && i === S.turn ? ' on' : '') + (i === bumpIdx ? ' bump' : ''),
      type: 'button',
      title: S.teams.length > 1 ? 'Give ' + t.name + ' the turn' : 'Your score',
      onclick: () => { if (S.teams.length > 1) { S.turn = i; renderBoard(); const tn = $('.turn-name'); if (tn) tn.textContent = t.name; } }
    }, h('span', { class: 'tname' }, t.name), h('span', { class: 'tscore' }, t.score.toLocaleString('en-AU'))));
  });
}
function award(pts) { const i = S.turn; S.teams[i].score += pts; persist(); renderBoard(i); }
function passTurn() { if (S.teams.length > 1) { S.turn = (S.turn + 1) % S.teams.length; renderBoard(); } }

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

function confetti() {
  if (reduced()) return;
  const c = $('#fx'), x = c.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  c.hidden = false; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--hi', '--flag', '--biro', '--ok'].map(v => cs.getPropertyValue(v).trim() || '#FFE14D');
  const P = Array.from({ length: 150 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 240, y: innerHeight * .35, vx: (Math.random() - .5) * 15, vy: -Math.random() * 14 - 4, s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: pick(cols) }));
  const t0 = performance.now();
  (function f(now) {
    const t = now - t0;
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - t / 2600); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore();
    }
    if (t < 2600) requestAnimationFrame(f); else { x.clearRect(0, 0, innerWidth, innerHeight); c.hidden = true; }
  })(t0);
}

/* ---------- shared UI ---------- */
const UNITS = { scams: 'Scams', money: 'Follow the Money', enterprise: 'Enterprise', all: 'Everything' };
const unitChip = u => h('span', { class: 'chip u-' + u }, UNITS[u]);

function feedback({ ok, pts = 0, head, line, text, extra, tip }) {
  return h('div', { class: 'feedback ' + (ok ? 'good' : 'bad') },
    h('div', { class: 'fb-head' }, h('strong', {}, head || (ok ? 'Correct' : 'Not quite')), pts > 0 ? h('span', { class: 'pts' }, '+' + pts + teamSuffix()) : null),
    line ? h('p', { class: 'fb-line' }, line) : null,
    text ? h('p', {}, text) : null,
    extra || null,
    tip ? h('p', { class: 'tip' }, h('b', {}, 'Do this: '), tip) : null);
}

function mcq(side, it, ctx, opt = {}) {
  if (it.prompt) side.append(h('p', { class: 'prompt' }, it.prompt));
  const idx = it.options.map((_, i) => i);
  const order = it.fixed ? idx : shuffle(idx);
  const wrap = h('div', { class: 'choices' + (it.options.length > 4 ? ' grid' : '') });
  const base = it.points || 100;
  order.forEach((oi, k) => {
    const b = h('button', { class: 'choice', type: 'button', 'data-i': oi }, h('span', { class: 'key' }, String(k + 1)), h('span', { class: 'ctext' }, it.options[oi]));
    b.addEventListener('click', () => {
      opt.onAnswer && opt.onAnswer();
      wrap.querySelectorAll('button').forEach(x => { x.disabled = true; if (+x.dataset.i === it.answer) x.classList.add('correct'); else if (x !== b) x.classList.add('dim'); });
      const ok = oi === it.answer;
      if (!ok) b.classList.add('wrong');
      ok ? sfx.good() : sfx.bad();
      const pts = ok ? (opt.scoreFn ? opt.scoreFn() : base) : 0;
      side.append(feedback({ ok, pts, text: it.why, extra: it.extra ? it.extra() : null }));
      ctx.resolve(pts, side);
    });
    wrap.append(b);
  });
  side.append(wrap);
  return wrap;
}

function numQ(side, it, ctx, onDone) {
  const input = h('input', { id: 'answer', class: 'num-in', type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: '0.00' });
  const btn = h('button', { class: 'btn primary', type: 'submit' }, 'Check');
  const msg = h('p', { class: 'hint' }, 'Two tries. First try +100, second try +50.');
  const form = h('form', { class: 'numform' },
    h('label', { for: 'answer', class: 'prompt' }, it.prompt),
    h('div', { class: 'numrow' }, h('div', { class: 'num-wrap' }, h('span', {}, '$'), input), btn), msg);
  let tries = 0, over = false;
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (over) return;
    const val = parseFloat(input.value.replace(/[$,\s]/g, ''));
    if (isNaN(val)) { msg.textContent = 'Type a number, like 480 or 57.60.'; return; }
    const ok = Math.abs(val - it.answer) < 0.011;
    if (ok || tries >= 1) {
      over = true; input.disabled = true; btn.disabled = true;
      const pts = ok ? (tries ? 50 : 100) : 0;
      ok ? sfx.good() : sfx.bad();
      onDone && onDone();
      side.append(feedback({ ok, pts, line: ok ? null : 'The answer is ' + money(it.answer) + '.', extra: h('p', { class: 'working' }, it.working), text: it.why }));
      ctx.resolve(pts, side);
    } else {
      tries++; sfx.bad();
      const w = input.parentNode; w.classList.add('shake'); setTimeout(() => w.classList.remove('shake'), 400);
      msg.textContent = 'Not quite. One more try. Check your working.';
      input.select();
    }
  });

  setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) {} }, 60);
}

/* ---------- message mock-ups ---------- */
function segs(arr, reg) {
  const frag = document.createDocumentFragment();
  (Array.isArray(arr) ? arr : [arr]).forEach(s => {
    const seg = typeof s === 'string' ? { t: s } : s;
    const span = h('span', { class: 'seg' }, seg.t);
    reg.push({ el: span, seg });

}
const initial = s => ((String(s).match(/[A-Za-z0-9]/) || ['?'])[0]).toUpperCase();
function renderMsg(m) {
  const reg = [], X = a => segs(a, reg);
  let el;
  if (m.kind === 'email') {
    el = h('article', { class: 'mock email' },
      h('div', { class: 'email-row' }, h('span', { class: 'lbl' }, 'From'), h('span', {}, X(m.from))),
      h('div', { class: 'email-row' }, h('span', { class: 'lbl' }, 'Subject'), h('span', { class: 'subj' }, X(m.subject))),
      h('div', { class: 'email-body' }, X(m.body)));
  } else if (m.kind === 'call') {
    el = h('article', { class: 'mock call' },
      h('div', { class: 'call-top' }, h('span', { class: 'call-dot' }), h('span', {}, m.from)),
      h('p', { class: 'call-label' }, 'What the caller says'),
      h('blockquote', { class: 'call-body' }, X(m.body)));
  } else if (m.kind === 'shop') {
    el = h('article', { class: 'mock shop' },
      h('div', { class: 'shop-top' }, X(m.url)),
      h('h3', { class: 'shop-name' }, m.from),
      h('ul', { class: 'shop-lines' }, m.body.map(line => h('li', {}, X(line)))));
  } else if (m.kind === 'ad') {
    el = h('article', { class: 'mock ad' },
      h('div', { class: 'ph-top' }, h('span', { class: 'avatar' }, initial(m.from)), h('div', {}, h('div', { class: 'ph-name' }, m.from), h('div', { class: 'ph-meta' }, 'Sponsored'))),
      h('div', { class: 'ad-creative' }, m.creative),
      h('div', { class: 'ad-body' }, X(m.body)),
      h('div', { class: 'ad-cta' }, m.cta || 'Learn more'));
  } else {
    el = h('article', { class: 'mock phone ' + m.kind },
      h('div', { class: 'ph-top' }, h('span', { class: 'avatar' }, initial(m.from)), h('div', {}, h('div', { class: 'ph-name' }, m.from), h('div', { class: 'ph-meta' }, m.meta || ''))),
      h('div', { class: 'bubble' }, X(m.body)));
  }
  el._reg = reg;
  return el;
}
function revealMsg(el) {
  let n = 0; el.classList.add('revealed');
  el._reg.forEach(r => { if (r.seg.f || r.seg.ok) { n++; r.el.classList.add(r.seg.f ? 'flag' : 'okseg'); r.el.append(h('span', { class: 'num' }, n)); } });
}
function reasonsList(el) {
  const items = el._reg.filter(r => r.seg.f || r.seg.ok);
  if (!items.length) return null;

    { type: 'mcq', prompt: 'Jordan’s bank statement shows the wage credit for this pay. What amount should it be?', options: [money(net), money(gross), money(net + sup), money(gross + sup)], answer: 0, why: 'The bank only ever sees net pay. If the credit doesn’t match the pay slip, ask your employer.' },

        wrap.append(b);
      });
      side.append(wrap);
    },
    summary() {
      const rank = st.smarts >= 1050 ? 'Scam-proof boss' : st.smarts >= 700 ? 'Mostly money-smart' : 'Jordan needs a do-over';
      return h('div', { class: 'done' },
        h('div', { class: 'meters' }, meter('Started with', money(150)), meter('Finished with', money(st.bal)), meter('Money smarts', String(st.smarts), 'out of 1,200')),
        h('p', { class: 'rank' }, rank),
        h('ul', { class: 'learned' },
          h('li', {}, h('b', {}, 'Enterprise: '), 'spot a problem and act on it, like Bowerman did.'),
          h('li', {}, h('b', {}, 'Money: '), 'check net pay against the bank, read every line, and plug the leaks.'),
          h('li', {}, h('b', {}, 'Scams: '), 'stop, check using contact details you already have, and never hand your TFN, codes or money to a message.')));
    }
  };
}

/* ---------- rounds registry ---------- */
const ROUNDS = [
  { id: 'scam-or-legit', unit: 'scams', title: 'Scam or Legit?', blurb: 'Ten realistic texts, emails, DMs, ads and calls. Make the call, then see the red flags.', meta: '10 messages · about 8 min', build: buildScamLegit },
  { id: 'red-flag-hunt', unit: 'scams', title: 'Red Flag Hunt', blurb: 'Tap every red flag in a fake tax refund, a romance DM and a dodgy online shop. Wrong taps cost points.', meta: '3 messages · about 6 min', build: buildHunt },
  { id: 'payday', unit: 'money', title: 'Payday', blurb: 'Fill in Jordan’s pay slip: gross pay, PAYG tax, net pay and super. New numbers every game.', meta: '7 questions · about 8 min', build: buildPayday },
  { id: 'paper-trail', unit: 'money', title: 'Paper Trail', blurb: 'Receipt or tax invoice? Then GST Snap: find the GST hiding in a price, against the clock.', meta: '12 questions · about 7 min', build: buildPaper },
  { id: 'statement-detective', unit: 'money', title: 'Statement Detective', blurb: 'Match Jordan’s receipts to the bank statement and stamp every line. Find the duplicate, the overcharge and the scam.', meta: '4 tasks · about 10 min', build: buildStatement },
  { id: 'enterprise-moves', unit: 'enterprise', title: 'Enterprise Moves', blurb: 'Match Bill Bowerman’s moves to enterprising behaviours, then build a full Behaviour + Evidence + Explanation answer.', meta: '9 questions · about 8 min', build: buildEnterprise },
  { id: 'boss-round', unit: 'all', title: 'Boss Round: Jordan’s First Month', blurb: 'A new job, a first pay, a dodgy text, a 50-cent charge and a $39 “bargain”. Eight decisions that use every unit at once. Watch Jordan’s bank balance.', meta: '8 decisions · about 10 min', build: buildBoss }
];

/* ---------- views ---------- */
const app = $('#app');
function heroArt() {
  const art = h('div', { class: 'hero-art', 'aria-hidden': 'true' });
  art.innerHTML =
    '<div class="art-sms"><span class="art-from">TOLLROAD · 7:42 am</span><p><mark>URGENT:</mark> Your account has an unpaid toll of $4.85. Pay within 24 hrs: <mark>tollpay-au.help/x7</mark></p></div>' +
    '<div class="art-stmt"><div class="art-h">STATEMENT · JORDAN LEE · OCT 2026</div>' +
    '<div class="art-row"><span>07 Oct</span><span>EFTPOS KMART WERRIBEE</span><span>$54.00</span><i class="stamp s-wrong">Wrong amount</i></div>' +
    '<div class="art-row"><span>08 Oct</span><span>XYZ TECH SVCS SINGAPORE</span><span>$0.50</span><i class="stamp s-chase">Chase it</i></div>' +
    '<div class="art-row"><span>10 Oct</span><span>EFTPOS BURRITO BAR</span><span>$16.50</span><i class="stamp s-match">Match</i></div></div>';
  return art;
}
function renderHome() {
  app.innerHTML = '';
  const hero = h('section', { class: 'hero' },
    h('div', {},
      h('p', { class: 'eyebrow' }, 'Year 10 Economics and Business · Review'),
      h('h1', {}, 'Tick it or ', h('span', { class: 'hl' }, 'chase it.')),
      h('p', { class: 'lead' }, 'Seven rounds on everything so far: scams, pay slips, tax invoices, GST, bank statements and Bill Bowerman’s waffle iron. Play solo, or split the class into teams and battle it out on the projector.'),
      h('div', { class: 'cta' },
        h('a', { class: 'btn primary', href: '#scam-or-legit' }, 'Start with Scam or Legit?'),
        h('button', { class: 'btn', type: 'button', onclick: openSetup }, S.mode === 'teams' ? 'Edit class teams' : 'Set up class teams'))),
    heroArt());
  const cover = h('div', { class: 'coverage' },
    h('span', {}, h('b', {}, 'Scams'), ' red flags, phishing, money mules'),
    h('span', {}, h('b', {}, 'Follow the Money'), ' pay slips, GST, tax invoices, statements'),
    h('span', {}, h('b', {}, 'Enterprise'), ' Bowerman and the waffle iron'));
  const grid = h('section', { class: 'rounds', 'aria-label': 'Rounds' }, ROUNDS.map((r, i) =>
    h('a', { class: 'card u-' + r.unit + (r.id === 'boss-round' ? ' boss' : ''), href: '#' + r.id },
      h('div', { class: 'card-top' }, h('span', { class: 'eyebrow' }, 'Round ' + (i + 1)), unitChip(r.unit)),
      h('h2', {}, r.title), h('p', {}, r.blurb),
      h('div', { class: 'card-foot' }, h('span', { class: 'meta' }, r.meta), S.best[r.id] != null ? h('span', { class: 'best' }, 'Best ' + S.best[r.id]) : null, h('span', { class: 'go' }, 'Play →')))));
  const how = h('section', { class: 'howto' },
    h('div', {}, h('h3', {}, 'On the projector'), h('p', {}, 'Set up 2 to 6 teams. Each question passes to the next team, and points go to whoever’s turn it is. Tap a team’s score to hand them the turn.')),
    h('div', {}, h('h3', {}, 'On a laptop'), h('p', {}, 'Play solo and chase your best score in each round. Payday makes new numbers every game, and the questions shuffle.')),
    h('div', {}, h('h3', {}, 'Shortcuts'), h('p', {}, 'Press 1 to 6 to pick an answer. Scores stay in this browser until you reset them in Teams.')));
  const foot = h('p', { class: 'foot' }, 'All scam messages here are made up for practice. Report real ones at ', h('a', { href: 'https://www.scamwatch.gov.au', target: '_blank', rel: 'noopener' }, 'scamwatch.gov.au'), '.');
  app.append(hero, cover, grid, how, foot);
}

function playRound(r) {
  app.innerHTML = ''; window.scrollTo(0, 0);
  const spec = r.build(), items = spec.items;
  let i = 0, total = 0;
  const nextR = ROUNDS[ROUNDS.indexOf(r) + 1];
  const head = h('div', { class: 'round-head' }, h('a', { class: 'back', href: '#' }, '← All rounds'), h('div', { class: 'round-title' }, unitChip(r.unit), h('h1', {}, r.title)));
  const meta = h('div', { class: 'round-meta' });
  const prog = h('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(items.length), 'aria-label': 'Round progress' }, h('span'));
  const body = h('section', { class: 'qbody' });
  app.append(head, meta, prog, body);
  function show() {
    meta.innerHTML = '';
    meta.append(h('span', { class: 'count' }, (spec.label || 'Question') + ' ' + (i + 1) + ' of ' + items.length),
      S.teams.length > 1 ? h('span', { class: 'turn' }, h('span', { class: 'dot' }), h('span', { class: 'turn-name' }, S.teams[S.turn].name), ' to answer') : null,
      h('span', { class: 'roundpts' }, total + ' pts this round'));
    prog.firstChild.style.width = (i / items.length * 100) + '%';
    prog.setAttribute('aria-valuenow', String(i));
    body.innerHTML = '';
    let resolved = false;
    const ctx = {
      resolve(pts, target) {
        if (resolved) return; resolved = true;
        pts = Math.max(0, Math.round(pts)); total += pts;
        if (pts > 0) award(pts);
        const rp = meta.querySelector('.roundpts'); if (rp) rp.textContent = total + ' pts this round';
        const btn = h('button', { class: 'btn primary', type: 'button', onclick: next }, i + 1 < items.length ? 'Next →' : 'See results →');
        const row = h('div', { class: 'nextrow' }, btn);
        (target || body).append(row);
        setTimeout(() => { try { btn.focus({ preventScroll: true }); row.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' }); } catch (e) {} }, 40);
      }
    };
    spec.render(body, items[i], ctx);
  }
  function next() {
    passTurn(); i++;
    if (i < items.length) { show(); const y = head.getBoundingClientRect().top + scrollY - 90; if (scrollY > y) window.scrollTo(0, Math.max(0, y)); }
    else done();
  }
  function done() {
    prog.firstChild.style.width = '100%'; meta.innerHTML = '';
    const prev = S.best[r.id];
    S.best[r.id] = Math.max(prev || 0, total); persist();
    sfx.win(); confetti(); window.scrollTo(0, 0);
    body.innerHTML = '';
    const teams = S.teams.length > 1;
    body.append(h('div', { class: 'done' },
      h('p', { class: 'eyebrow' }, 'Round complete'),
      h('h2', {}, total.toLocaleString('en-AU') + ' points'),
      h('p', { class: 'lead' }, (teams ? 'Earned across all teams. ' : '') + (prev == null ? 'First run of this round in this browser.' : total > prev ? 'New best for this round.' : 'Best so far: ' + S.best[r.id] + '.')),
      spec.summary ? spec.summary() : null,
      teams ? h('div', {}, h('p', { class: 'eyebrow' }, 'Standings'), h('ol', { class: 'standings' }, [...S.teams].sort((a, b) => b.score - a.score).map(t => h('li', {}, h('span', {}, t.name), h('span', {}, t.score.toLocaleString('en-AU')))))) : null,
      h('div', { class: 'cta' },
        h('button', { class: 'btn primary', type: 'button', onclick: () => playRound(r) }, 'Play again'),
        nextR ? h('a', { class: 'btn', href: '#' + nextR.id }, 'Next: ' + nextR.title) : null,
        h('a', { class: 'btn ghost', href: '#' }, 'All rounds'))));
  }
  show();
}

/* ---------- teams setup ---------- */
function openSetup() {
  const ov = $('#setup'); ov.innerHTML = '';
  let mode = S.mode, count = S.mode === 'teams' ? S.teams.length : 4;
  const names = S.mode === 'teams' ? S.teams.map(t => t.name) : [];
  const content = h('div', { class: 'setup-body', style: 'display:grid;gap:14px' });
  const draw = () => {
    content.innerHTML = '';
    const toggle = h('div', { class: 'seg-toggle', role: 'radiogroup', 'aria-label': 'Play mode' });
    [['solo', 'Solo'], ['teams', 'Class teams']].forEach(([v, l]) => toggle.append(h('button', { type: 'button', role: 'radio', 'aria-checked': String(mode === v), class: mode === v ? 'on' : null, onclick: () => { mode = v; draw(); } }, l)));
    content.append(toggle);
    if (mode === 'teams') {
      content.append(h('div', { class: 'field' }, h('label', { for: 'team-count' }, 'Number of teams'),
        h('select', { id: 'team-count', onchange: e => { count = +e.target.value; draw(); } }, [2, 3, 4, 5, 6].map(n => h('option', { value: String(n), selected: n === count }, n + ' teams')))));
      const grid = h('div', { class: 'names' });
      for (let i = 0; i < count; i++) {
        const id = 'team-name-' + (i + 1);
        grid.append(h('div', { class: 'field' }, h('label', { for: id }, 'Team ' + (i + 1)), h('input', { id, type: 'text', maxlength: '18', value: names[i] || DEFAULT_NAMES[i], oninput: e => { names[i] = e.target.value; } })));
      }
      content.append(grid, h('p', { class: 'hint' }, 'Each question passes to the next team. Tap a team’s score in the top bar to hand them the turn.'));
    } else content.append(h('p', { class: 'hint' }, 'One player, one score. Good for revision at home or on a laptop.'));
  };
  draw();
  const close = () => { ov.hidden = true; ov.innerHTML = ''; $('#teams-btn').focus(); };
  let armed = false;
  const reset = h('button', { class: 'btn ghost', type: 'button' }, 'Reset all scores');
  reset.addEventListener('click', () => {
    if (!armed) { armed = true; reset.textContent = 'Tap again to reset'; return; }
    S.teams.forEach(t => t.score = 0); S.best = {}; persist(); renderBoard(); toast('Scores reset'); close();
    if (!location.hash || location.hash === '#') renderHome();
  });
  const saveBtn = h('button', { class: 'btn primary', type: 'button' }, 'Save');
  saveBtn.addEventListener('click', () => {
    if (mode === 'solo') S.teams = [{ name: 'You', score: S.mode === 'solo' ? S.teams[0].score : 0 }];
    else {
      const old = S.mode === 'teams' ? S.teams : [];
      S.teams = Array.from({ length: count }, (_, i) => ({ name: ((names[i] || DEFAULT_NAMES[i]).trim() || DEFAULT_NAMES[i]).slice(0, 18), score: old[i] ? old[i].score : 0 }));
    }
    S.mode = mode; S.turn = 0; persist(); renderBoard();
    toast(mode === 'teams' ? S.teams.length + ' teams ready. ' + S.teams[0].name + ' goes first.' : 'Solo mode');
    close();
    if (!location.hash || location.hash === '#') renderHome();
  });
  const panel = h('div', { class: 'panel', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'setup-title' },
    h('h2', { id: 'setup-title' }, 'Teams'), content,
    h('div', { class: 'panel-foot' }, reset, h('div', { class: 'cta' }, h('button', { class: 'btn', type: 'button', onclick: close }, 'Cancel'), saveBtn)));
  ov.append(panel);
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.hidden = false;
  setTimeout(() => saveBtn.focus(), 30);
}

/* ---------- wiring ---------- */
function syncSound() { const b = $('#sound-btn'); b.setAttribute('aria-pressed', String(S.sound)); b.textContent = S.sound ? 'Sound on' : 'Sound off'; }
$('#sound-btn').addEventListener('click', () => { S.sound = !S.sound; persist(); syncSound(); if (S.sound) sfx.good(); });
$('#teams-btn').addEventListener('click', openSetup);
document.addEventListener('keydown', e => {
  const ov = $('#setup');
  if (!ov.hidden) { if (e.key === 'Escape') { ov.hidden = true; ov.innerHTML = ''; } return; }
  if (e.target.matches('input,select,textarea') || e.altKey || e.ctrlKey || e.metaKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) {
    const btns = [...app.querySelectorAll('.choices .choice:not(:disabled)')];
    if (btns[n - 1]) { e.preventDefault(); btns[n - 1].click(); }
  }
});
function route() {
  const id = location.hash.slice(1);
  const r = ROUNDS.find(x => x.id === id);
  if (r) playRound(r); else { renderHome(); window.scrollTo(0, 0); }
}
addEventListener('hashchange', route);
syncSound(); renderBoard(); route();
})();
</script>
