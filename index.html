<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blow the Whistle | Lesson 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --red:#D62828; --yellow:#F7B801; --pale:#FFF4CC; --teal:#1F8A70;
  --grey:#F2F4F7; --mid:#5B6573; --white:#fff; --line:#DDE2E8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--grey);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:16px}

/* Scoreboard */
.board{background:var(--ink);color:var(--white);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:14px;align-items:center;position:sticky;top:8px;z-index:5;box-shadow:0 6px 20px rgba(20,33,61,.25)}
.board .logo{display:flex;align-items:center;gap:10px}
.whistle{width:38px;height:38px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none}
.whistle svg{width:22px;height:22px;fill:#fff}
.board h1{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.5px;font-size:22px;margin:0;line-height:1}
.board small{display:block;color:#AEB8C7;font-size:11px;margin-top:3px}
.stat{text-align:center;min-width:64px}
.stat .lbl{font-size:10px;letter-spacing:1.5px;color:#AEB8C7;text-transform:uppercase}
.stat .val{font-family:Anton,Impact,sans-serif;font-size:28px;line-height:1.1;color:var(--yellow);font-variant-numeric:tabular-nums}
.stat.streak .val{color:#fff}
.stat.streak.hot .val{color:var(--yellow);text-shadow:0 0 12px rgba(247,184,1,.7)}

/* Progress */
.rounds{display:flex;gap:6px;margin:14px 0 6px}
.rounds div{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.rounds div span{display:block;height:100%;width:0;background:var(--red);transition:width .3s}

/* Cards */
.card{background:var(--white);border-radius:14px;padding:22px;margin-top:12px;box-shadow:0 2px 8px rgba(20,33,61,.06)}
.tag{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:12px;letter-spacing:1px;padding:4px 10px;border-radius:6px;text-transform:uppercase}
.tag.y{background:var(--yellow);color:var(--ink)}
h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;margin:10px 0 6px;letter-spacing:.3px}
.lead{color:var(--mid);margin:0 0 6px;line-height:1.5}
.q{font-size:20px;font-weight:800;line-height:1.4;margin:6px 0 18px}
.counter{font-size:13px;color:var(--mid);font-weight:600}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.five{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opt{background:var(--grey);border:2px solid transparent;border-radius:12px;padding:14px 16px;text-align:left;font-weight:600;font-size:16px;color:var(--ink);line-height:1.4;transition:transform .08s,border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.big{text-align:center;font-size:18px;font-weight:800;padding:20px}
.opt.right{background:#E3F4EE;border-color:var(--teal)}
.opt.wrong{background:#FDE8E8;border-color:var(--red)}
.opt.fade{opacity:.45}

.feedback{margin-top:16px;border-radius:12px;padding:14px 16px;display:none;gap:14px;align-items:flex-start}
.feedback.show{display:flex}
.feedback.good{background:#E3F4EE}
.feedback.bad{background:var(--pale)}
.fb-icon{flex:none;width:44px;height:58px;border-radius:6px;display:grid;place-items:center;font-family:Anton,Impact,sans-serif;font-size:13px;color:#fff;text-align:center;line-height:1.05;transform:rotate(-6deg)}
.good .fb-icon{background:var(--teal);width:58px;height:44px;border-radius:50%;transform:none}
.bad .fb-icon{background:var(--yellow);color:var(--ink)}
.fb-text b{display:block;font-size:17px;margin-bottom:2px}
.fb-text{line-height:1.5}
.next{margin-top:16px;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:800;font-size:16px;display:none}
.next.show{display:inline-block}
.next:hover{background:#22325a}

.btn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px 26px;font-weight:800;font-size:17px}
.btn:hover{background:#b81f1f}
.btn.ghost{background:var(--white);color:var(--ink);border:2px solid var(--ink)}
input[type=text]{font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;width:100%;max-width:340px}
input[type=text]:focus{outline:none;border-color:var(--ink)}

.roundlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}
.roundlist div{background:var(--grey);border-radius:12px;padding:12px 14px}
.roundlist b{display:block;color:var(--red);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.roundlist span{font-weight:800;font-size:16px}

/* Verdict meter */
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 18px}
.meter button{background:var(--grey);border:2px solid transparent;border-radius:12px;padding:12px 4px;font-weight:800}
.meter button span{display:block;font-size:11px;font-weight:600;color:var(--mid);margin-top:2px}
.meter button.sel{background:var(--ink);color:#fff}
.meter button.sel span{color:#C9D1DD}
.bg{background:var(--grey);border-radius:12px;padding:12px 14px;margin:0 0 14px;line-height:1.5;color:var(--ink);font-size:15px}
.step{font-size:13px;font-weight:800;letter-spacing:1px;color:var(--red);text-transform:uppercase;margin:6px 0 8px}

/* Results */
.big{font-family:Anton,Impact,sans-serif;font-size:72px;line-height:1;color:var(--red)}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.badge{border-radius:12px;padding:12px;background:var(--grey);opacity:.45;text-align:center}
.badge.on{opacity:1;background:var(--pale);border:2px solid var(--yellow)}
.badge .e{font-size:26px}
.badge b{display:block;font-size:14px;margin-top:4px}
.badge small{color:var(--mid);font-size:12px}
.verdict{background:var(--pale);border:2px solid var(--yellow);border-radius:12px;padding:16px;font-size:18px;font-weight:600;line-height:1.5}
.review{margin-top:10px}
.review div{border-left:0;background:var(--grey);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.45}
.review b{color:var(--red)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.bonus{display:inline-block;margin-left:6px;background:var(--yellow);color:var(--ink);font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

@media (max-width:640px){
  .board{grid-template-columns:1fr auto auto auto;gap:8px;padding:10px 12px}
  .board .logo small{display:none}
  .board h1{font-size:17px}
  .stat{min-width:46px}
  .stat .val{font-size:22px}
  .stat.rnd{display:none}
  h2{font-size:28px}
  .q{font-size:18px}
  .opts.two{grid-template-columns:1fr}
  .meter{grid-template-columns:repeat(5,1fr);gap:4px}
  .meter button span{display:none}
  .card{padding:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="board" aria-label="Scoreboard">
    <div class="logo">
      <div class="whistle" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.5 6C5.4 6 2 9.4 2 13.5S5.4 21 9.5 21c3.2 0 6-2.1 7-5H22V9h-7.4C13.5 7.2 11.6 6 9.5 6zm0 4a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM16 4h2v4h-2z"/></svg></div>
      <div><h1>BLOW THE WHISTLE</h1><small>Lesson 3 | Scams, the law and who pays</small></div>
    </div>
    <div></div>
    <div class="stat rnd"><div class="lbl">Round</div><div class="val" id="sRound">0/4</div></div>
    <div class="stat streak" id="streakBox"><div class="lbl">Streak</div><div class="val" id="sStreak">0</div></div>
    <div class="stat"><div class="lbl">Score</div><div class="val" id="sScore">0</div></div>
  </header>
  <div class="rounds" aria-hidden="true"><div><span id="p1"></span></div><div><span id="p2"></span></div><div><span id="p3"></span></div><div><span id="p4"></span></div></div>
  <main id="app"></main>
</div>

<script>
(function(){
"use strict";

/* ---------- Content ---------- */
const TEAM = ["ACL","ASIC","ACCC","Scamwatch","IDCARE"];
const R1 = [
  {q:"The rulebook that says businesses can't mislead or deceive customers.", a:"ACL", why:"The Australian Consumer Law is the rulebook. It sets out what businesses can and can't do."},
  {q:"A fake crypto trading app is taking people's savings. Which umpire steps in?", a:"ASIC", why:"Investments, crypto trading, banks and super are ASIC's patch. S for Securities: money that grows."},
  {q:"A fake sneaker website takes your money and never sends the shoes. Which umpire?", a:"ACCC", why:"Shopping and businesses selling to consumers are the ACCC's patch. The extra C is for Consumer."},
  {q:"The website where you report a scam so it can be shut down.", a:"Scamwatch", why:"Scamwatch is the whistle. It's run by the ACCC at scamwatch.gov.au."},
  {q:"Someone stole your identity and opened a phone plan in your name. Who helps you for free?", a:"IDCARE", why:"IDCARE is Australia's free identity and cyber support service."},
  {q:"This umpire runs Scamwatch.", a:"ACCC", why:"Scamwatch is the ACCC's reporting service."},
  {q:"This umpire watches banks, super funds and insurance companies.", a:"ASIC", why:"ASIC regulates financial services: banks, super, insurance and investments."},
  {q:"Bans conduct that is misleading, deceptive or unconscionable.", a:"ACL", why:"The ACL is the law that bans this conduct. The umpires then enforce it."}
];
const R2 = [
  {q:"A store gives you a refund for headphones that broke after a week.", a:"Fair play", why:"That's the ACL working. Faulty products get a repair, replacement or refund."},
  {q:"A salesperson pressures an elderly man who can't read English into signing a $9,000 contract on the spot.", a:"Red card", why:"Taking serious advantage of someone's vulnerability is unconscionable conduct."},
  {q:"An online ad promises \"guaranteed 40% returns, zero risk\".", a:"Red card", why:"No real investment is guaranteed with zero risk. This is misleading and a classic scam hook."},
  {q:"Your bank texts you to check a strange $5,000 transfer before it goes through.", a:"Fair play", why:"That's the bank taking its duty of care seriously: reasonable steps to protect you."},
  {q:"An ad uses a famous Australian's face saying they invest in a crypto app, but they never agreed to it.", a:"Red card", why:"A fake celebrity endorsement is misleading and deceptive. This is one of the most common scam ads."},
  {q:"A phone shop clearly shows the price, the contract length and the cancellation fee before you sign.", a:"Fair play", why:"Clear, honest information is exactly what the ACL expects."},
  {q:"A website says \"Only 1 left in stock!\" when there are 200 in the warehouse.", a:"Red card", why:"A false claim to rush you into buying is misleading conduct."},
  {q:"A business keeps pushing a confused, upset customer: \"Sign today or the deal is gone forever.\"", a:"Red card", why:"Pressuring someone who is clearly vulnerable can cross into unconscionable conduct."}
];
const R3 = [
  {q:"Should Sam have checked the website was real before paying?", a:"Fault", why:"This asks whether Sam made a good choice. That's ethics: right and wrong, not rules."},
  {q:"Does the bank have to refund Sam under the rules?", a:"Law", why:"\"Does the bank HAVE to\" is about what the rules require. That's liability."},
  {q:"Was it silly of Priya to click the link in the text?", a:"Fault", why:"Judging Priya's choice is a fault question."},
  {q:"Is Instagram required to take down the scam ad once it's reported?", a:"Law", why:"\"Is it required\" means you're asking what the law says. Law question."},
  {q:"Did ASIC have the power to shut down the fake investment website?", a:"Law", why:"A regulator's legal powers are a law question."},
  {q:"Should Priya feel embarrassed about what happened?", a:"Fault", why:"Feelings and blame are fault. And no, she shouldn't: scammers are professionals."},
  {q:"Did the seller's behaviour break the ACL?", a:"Law", why:"Whether a rule was broken is always a law question."},
  {q:"Should Dad have asked the family before sending the money?", a:"Fault", why:"This judges Dad's choice. Fault, not law."}
];
const R4 = [
  {title:"Social media apps",
   q:"Should social media apps have to refund people scammed by ads they ran?",
   bg:"Scam investment ads run on big social media apps every day, often using fake celebrity endorsements. The apps get paid for every ad. The apps say checking millions of ads is impossible.",
   reasons:[
     {t:"The app was paid to run the ad, so it profited from the scam and was in the best position to check it.", strong:true, side:"yes"},
     {t:"Apps can't check millions of ads a day, so the scammer should be held responsible, not the platform.", strong:true, side:"no"},
     {t:"People who click on ads like that are just gullible.", strong:false, note:"That's a fault answer. It blames the victim instead of asking what the rules should be."},
     {t:"Social media is annoying anyway.", strong:false, note:"That's an opinion about apps, not a reason about responsibility or law."}
   ]},
  {title:"Banks",
   q:"Should banks have to refund people who were tricked into sending money themselves?",
   bg:"Right now most Australian banks treat this as the customer's responsibility. The UK makes banks refund most victims, up to £85,000. Australia's new Scams Prevention Framework is considering automatic payback for losses under $3,000.",
   reasons:[
     {t:"Banks can see suspicious transfers before the customer can, so they have a duty of care to pause them.", strong:true, side:"yes"},
     {t:"If refunds were automatic, some people might fake being scammed, which pushes up costs for every customer.", strong:true, side:"no"},
     {t:"It's their own fault for sending it.", strong:false, note:"Careless or not, that's fault. The question is what the LAW should require."},
     {t:"Banks are rich so they can afford it.", strong:false, note:"Being rich isn't a reason. Strong answers talk about duty of care, risk or who can stop the scam."}
   ]},
  {title:"Ad networks",
   q:"Should ad networks have to verify every advertiser's identity before allowing financial ads?",
   bg:"Many scam ads use fake business names and stolen logos. ASIC has pushed platforms to check financial advertisers. Checking takes time and money, and some platforms only do it voluntarily.",
   reasons:[
     {t:"ID checks would stop many fake advertisers before their ads ever run, and regulators like ASIC have asked for it.", strong:true, side:"yes"},
     {t:"Checking every advertiser costs money and slows things down, which hurts small honest businesses trying to advertise.", strong:true, side:"no"},
     {t:"Ads are annoying, so get rid of them all.", strong:false, note:"That doesn't answer the question about verification."},
     {t:"Scammers always win, so there's no point.", strong:false, note:"Giving up isn't a reason. Strong answers weigh costs and benefits."}
   ]}
];
const METER = [["1","Strongly disagree"],["2","Disagree"],["3","Unsure"],["4","Agree"],["5","Strongly agree"]];

/* ---------- State ---------- */
const S = {name:"", score:0, streak:0, best:0, round:0, i:0, items:[], correctByRound:[0,0,0,0], mistakes:[], verdicts:[]};
const $ = id => document.getElementById(id);
const app = $("app");
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function updateBoard(bump){
  $("sScore").textContent = S.score;
  $("sStreak").textContent = S.streak;
  $("sRound").textContent = Math.min(S.round,4) + "/4";
  $("streakBox").classList.toggle("hot", S.streak >= 3);
  if(bump){ const el=$(bump); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
}
function setProgress(r, frac){ $("p"+r).style.width = Math.round(frac*100)+"%"; }

/* scoring: 10 a correct answer, +5 bonus when you are on a streak of 3 or more */
function award(ok){
  if(ok){
    S.streak++; S.best=Math.max(S.best,S.streak);
    const bonus = S.streak>=3 ? 5 : 0;
    S.score += 10 + bonus;
    S.correctByRound[S.round-1]++;
    updateBoard("sScore");
    return bonus;
  }
  S.streak=0; updateBoard(); return 0;
}

/* ---------- Screens ---------- */
function start(){
  app.innerHTML = `
  <section class="card">
    <span class="tag">Kick off</span>
    <h2>Who has your back when scams happen?</h2>
    <p class="lead">You're the umpire today. Four quick rounds. Get answers right in a row to build a streak: 3 in a row and every answer is worth bonus points.</p>
    <div class="roundlist">
      <div><b>Round 1</b><span>Know the team</span></div>
      <div><b>Round 2</b><span>Fair play or red card?</span></div>
      <div><b>Round 3</b><span>Fault or law?</span></div>
      <div><b>Round 4</b><span>Your verdict</span></div>
    </div>
    <label for="nm" style="font-weight:800;display:block;margin-bottom:6px">Your first name</label>
    <input id="nm" type="text" maxlength="30" autocomplete="off" placeholder="First name">
    <div class="rowbtns"><button class="btn" id="go">Blow the whistle</button></div>
  </section>`;
  const go = () => { S.name = $("nm").value.trim() || "Umpire"; beginRound(1); };
  $("go").onclick = go;
  $("nm").addEventListener("keydown", e => { if(e.key==="Enter") go(); });
}

const ROUND_INFO = {
  1:{tag:"Round 1", title:"Know the team", lead:"Rulebook, umpires, whistle or helper? Pick who does the job.", data:R1, opts:TEAM, cls:"five"},
  2:{tag:"Round 2", title:"Fair play or red card?", lead:"Is this business playing fair, or does it break the rules (misleading or unconscionable)?", data:R2, opts:["Fair play","Red card"], cls:"two big"},
  3:{tag:"Round 3", title:"Fault or law?", lead:"Is this question about FAULT (was someone careless?) or LAW (what do the rules require?)", data:R3, opts:["Fault","Law"], cls:"two big"}
};

function beginRound(r){
  S.round=r; S.i=0; updateBoard();
  if(r===4){ S.items=R4.slice(); return verdictIntro(); }
  S.items = shuffle(ROUND_INFO[r].data);
  roundIntro(r);
}

function roundIntro(r){
  const R=ROUND_INFO[r];
  app.innerHTML = `<section class="card"><span class="tag">${R.tag}</span><h2>${R.title}</h2><p class="lead">${R.lead}</p><p class="lead">${R.data.length} questions.</p><div class="rowbtns"><button class="btn" id="go">Start round</button></div></section>`;
  $("go").onclick = () => ask();
  $("go").focus();
}

function ask(){
  const r=S.round, R=ROUND_INFO[r], it=S.items[S.i];
  setProgress(r, S.i/S.items.length);
  const isBig = R.cls.includes("big");
  const opts = r===1 ? shuffle(R.opts) : R.opts;
  app.innerHTML = `
  <section class="card">
    <span class="tag">${R.tag}: ${R.title}</span>
    <p class="counter" style="margin-top:12px">Question ${S.i+1} of ${S.items.length}</p>
    <p class="q">${esc(it.q)}</p>
    <div class="opts ${R.cls.split(" ")[0]}">${opts.map(o=>`<button class="opt${isBig?" big":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <button class="next" id="nx">Next</button>
  </section>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b, it));
}

function answer(btn, it){
  const ok = btn.dataset.v === it.a;
  app.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if(b.dataset.v === it.a) b.classList.add("right");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("fade");
  });
  const bonus = award(ok);
  if(!ok){ btn.classList.add("shake"); S.mistakes.push({round:S.round, q:it.q, you:btn.dataset.v, a:it.a, why:it.why}); }
  showFeedback(ok, ok ? (bonus?`Play on! <span class="bonus">+${10+bonus} streak bonus</span>`:"Play on! +10") : `Yellow card. It's ${esc(it.a)}.`, it.why);
  const nx=$("nx"); nx.classList.add("show"); nx.focus();
  nx.textContent = S.i+1 < S.items.length ? "Next" : "Finish round";
  nx.onclick = () => { S.i++; if(S.i < S.items.length) ask(); else endRound(); };
}

function showFeedback(ok, head, body){
  const fb=$("fb");
  fb.className = "feedback show " + (ok?"good":"bad");
  fb.innerHTML = `<div class="fb-icon" aria-hidden="true">${ok?"PLAY<br>ON":"YELLOW<br>CARD"}</div><div class="fb-text"><b>${head}</b>${esc(body)}</div>`;
}

function endRound(){
  const r=S.round; setProgress(r,1);
  const total = r===4 ? R4.length : ROUND_INFO[r].data.length;
  const got = S.correctByRound[r-1];
  const titles = {1:"Know the team",2:"Fair play or red card?",3:"Fault or law?"};
  const msg = got===total ? "Perfect round. Badge unlocked." : got>=total-2 ? "Solid round." : "Check the mistake review at the end.";
  app.innerHTML = `<section class="card"><span class="tag y">Round ${r} done</span><h2>${titles[r]}: ${got}/${total}</h2><p class="lead">${msg}</p><div class="rowbtns"><button class="btn" id="go">Next round</button></div></section>`;
  $("go").onclick = () => beginRound(r+1);
  $("go").focus();
}

/* ---------- Round 4 ---------- */
function verdictIntro(){
  app.innerHTML = `<section class="card"><span class="tag">Round 4</span><h2>Your verdict</h2>
  <p class="lead">Three real debates happening in Australia right now. For each one:</p>
  <p class="lead"><b>1.</b> Vote 1 to 5. There is no wrong vote.<br><b>2.</b> Pick the STRONGEST reason. Strong reasons use law or business thinking (duty of care, risk, costs, who profits, who can stop it). Weak reasons just blame someone or give a feeling. Both sides have a strong reason.</p>
  <div class="rowbtns"><button class="btn" id="go">Start round</button></div></section>`;
  $("go").onclick = () => verdict();
  $("go").focus();
}

function verdict(){
  const it=S.items[S.i]; let vote=null;
  setProgress(4, S.i/S.items.length);
  const reasons = shuffle(it.reasons);
  app.innerHTML = `
  <section class="card">
    <span class="tag">Round 4: ${esc(it.title)}</span>
    <p class="counter" style="margin-top:12px">Debate ${S.i+1} of ${S.items.length}</p>
    <p class="q">${esc(it.q)}</p>
    <div class="bg">${esc(it.bg)}</div>
    <div class="step">Step 1: your vote</div>
    <div class="meter">${METER.map(([n,l])=>`<button data-n="${n}">${n}<span>${l}</span></button>`).join("")}</div>
    <div id="s2" style="display:none">
      <div class="step">Step 2: pick the strongest reason</div>
      <div class="opts">${reasons.map((x,k)=>`<button class="opt" data-k="${it.reasons.indexOf(x)}">${esc(x.t)}</button>`).join("")}</div>
    </div>
    <div class="feedback" id="fb"></div>
    <button class="next" id="nx">Next</button>
  </section>`;
  app.querySelectorAll(".meter button").forEach(b => b.onclick = () => {
    if(app.querySelector(".opt:disabled")) return;
    app.querySelectorAll(".meter button").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); vote=+b.dataset.n;
    $("s2").style.display="block";
  });
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const pick = it.reasons[+b.dataset.k];
    app.querySelectorAll(".opt").forEach(x => {
      x.disabled=true;
      const r = it.reasons[+x.dataset.k];
      if(r.strong) x.classList.add("right"); else if(x===b) x.classList.add("wrong"); else x.classList.add("fade");
    });
    app.querySelectorAll(".meter button").forEach(x=>x.disabled=true);
    const ok = pick.strong;
    const bonus = award(ok);
    let extra = "";
    if(ok && vote!==3 && ((vote>3 && pick.side==="no")||(vote<3 && pick.side==="yes"))) extra = " Strong reason, but it argues the other side to your vote. In your own answer, match your reason to your vote.";
    if(!ok){ b.classList.add("shake"); S.mistakes.push({round:4, q:it.q, you:pick.t, a:"Either reason highlighted in green", why:pick.note}); }
    S.verdicts.push({title:it.title, q:it.q, vote, reason:pick.t, strong:ok, side:pick.side});
    showFeedback(ok, ok ? (bonus?`Strong reason! <span class="bonus">+${10+bonus} streak bonus</span>`:"Strong reason! +10") : "Yellow card. That reason is weak.",
      ok ? "This uses business or law thinking, not blame. Both green answers are strong, one for each side." + extra : pick.note + " The green ones are the strong reasons, one for each side.");
    const nx=$("nx"); nx.classList.add("show"); nx.focus();
    nx.textContent = S.i+1 < S.items.length ? "Next debate" : "See my results";
    nx.onclick = () => { S.i++; if(S.i < S.items.length) verdict(); else results(); };
  });
}

/* ---------- Results ---------- */
function bankSentence(){
  const v = S.verdicts.find(x=>x.title==="Banks");
  if(!v) return "";
  const should = v.vote>=4 ? "should" : v.vote<=2 ? "should not" : "might need to";
  let reason;
  if(v.strong && ((v.vote>=4 && v.side==="yes")||(v.vote<=2 && v.side==="no")||v.vote===3)) reason = v.reason.charAt(0).toLowerCase()+v.reason.slice(1).replace(/\.$/,"");
  else if(v.vote<=2) reason = "if refunds were automatic, some people might fake being scammed, which pushes up costs for every customer";
  else reason = "banks can see suspicious transfers before the customer can, so they have a duty of care to pause them";
  return `I think banks ${should} refund people who were tricked into sending money, because ${reason}.`;
}

function results(){
  setProgress(4,1); S.round=5; updateBoard();
  const totals=[R1.length,R2.length,R3.length,R4.length];
  const right = S.correctByRound.reduce((a,b)=>a+b,0), all = totals.reduce((a,b)=>a+b,0);
  const badges = [
    ["📘","Rulebook Pro","Perfect Round 1", S.correctByRound[0]===totals[0]],
    ["🟥","Fair Umpire","Perfect Round 2", S.correctByRound[1]===totals[1]],
    ["⚖️","Law Brain","Perfect Round 3", S.correctByRound[2]===totals[2]],
    ["🧠","Clear Verdict","Strong reason in every debate", S.correctByRound[3]===totals[3]],
    ["🔥","Hot Whistle","Streak of 8 or more", S.best>=8]
  ];
  const earned = badges.filter(b=>b[3]).length;
  const rank = right>=all-1 ? "Grand Final Umpire" : right>=all-5 ? "AFL Umpire" : right>=all-10 ? "Local League Umpire" : "Umpire in Training";
  const sentence = bankSentence();
  app.innerHTML = `
  <section class="card">
    <span class="tag y">Full time</span>
    <h2>${esc(S.name)}, your rank: ${rank}</h2>
    <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;margin:10px 0 6px">
      <div><div class="big">${S.score}</div><div class="counter">points</div></div>
      <div><div class="big" style="color:var(--ink)">${right}/${all}</div><div class="counter">correct</div></div>
      <div><div class="big" style="color:var(--teal)">${S.best}</div><div class="counter">best streak</div></div>
    </div>
    <p class="counter">Round by round: ${S.correctByRound.map((c,k)=>`R${k+1} ${c}/${totals[k]}`).join("  |  ")}</p>
    <div class="badges">${badges.map(b=>`<div class="badge${b[3]?" on":""}"><div class="e">${b[0]}</div><b>${b[1]}</b><small>${b[2]}</small></div>`).join("")}</div>
    <p class="counter">${earned} of ${badges.length} badges earned</p>
  </section>
  <section class="card">
    <span class="tag">Exit ticket</span>
    <h2>Your verdict sentence</h2>
    <p class="lead">Built from your bank vote. Copy it into your book, then add one word from today if it's not already there (ACL, ASIC, ACCC, regulator, unconscionable, duty of care).</p>
    <div class="verdict" id="vs">${esc(sentence)}</div>
  </section>
  ${S.mistakes.length ? `<section class="card"><span class="tag">Mistake review</span><h2>Learn from the yellow cards</h2><div class="review">${S.mistakes.map(m=>`<div><b>Round ${m.round}:</b> ${esc(m.q)}<br>You said: ${esc(m.you)}<br>Answer: <strong>${esc(m.a)}</strong>. ${esc(m.why)}</div>`).join("")}</div></section>`
    : `<section class="card"><span class="tag y">Mistake review</span><h2>No yellow cards</h2><p class="lead">Flawless match. Try writing a second verdict sentence arguing the opposite side.</p></section>`}
  <section class="card">
    <p class="lead"><b>Show your teacher this screen.</b> Then play again to beat your score.</p>
    <div class="rowbtns"><button class="btn" id="again">Play again</button></div>
  </section>`;
  $("again").onclick = () => {
    Object.assign(S,{score:0,streak:0,best:0,round:0,i:0,items:[],correctByRound:[0,0,0,0],mistakes:[],verdicts:[]});
    [1,2,3,4].forEach(r=>setProgress(r,0)); updateBoard(); beginRound(1); window.scrollTo(0,0);
  };
  window.scrollTo(0,0);
}

updateBoard();
start();
})();
</script>
