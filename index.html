<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shock Proof</title>
<style>
:root{
  --ink:#1F2328; --muted:#5B6168; --line:#E3E5E8; --bg:#FFFFFF; --soft:#F6F7F8;
  --amber:#A8561B; --amber-soft:#FBEFE4; --green:#1E7A4C; --green-soft:#E6F4EC;
  --red:#B83227; --red-soft:#FBEAE8; --navy:#22344A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
header.bar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{font-weight:800;letter-spacing:.02em;color:var(--amber);font-size:1.1rem;margin-right:auto}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--navy)}
.chip.streak b{color:var(--amber)}
.meter{width:100%;padding:0 16px 10px;max-width:860px;margin:0 auto}
.meter-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.track{height:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:var(--green);transition:width .5s ease}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
h1{font-size:2rem;margin:.4em 0 .2em;color:var(--navy)}
h2{font-size:1.35rem;margin:.2em 0 .4em;color:var(--navy)}
p.lead{font-size:1.05rem;color:var(--muted);margin-top:0}
.card{border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0;background:#fff}
.roundtag{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:3px 8px}
.progress{font-size:.85rem;color:var(--muted);float:right}
.prompt{font-size:1.2rem;font-weight:600;margin:14px 0 16px}
.scenario{background:var(--soft);border-radius:10px;padding:12px 14px;margin:10px 0 14px;font-size:1rem}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;font-size:1rem;color:var(--ink);transition:border-color .15s,background .15s}
.opts.two .opt{text-align:center;font-weight:700;padding:18px 10px}
.opt:hover:not(:disabled){border-color:var(--amber)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;display:none}
.feedback.ok{display:block;background:var(--green-soft);color:#14512F}
.feedback.no{display:block;background:var(--red-soft);color:#7A1F17}
.actions{display:flex;justify-content:flex-end;margin-top:14px;gap:10px}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;background:var(--navy);color:#fff}
.btn.alt{background:var(--amber)}
.btn:disabled{opacity:.4;cursor:default}
input[type=text]{font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:10px;width:100%;max-width:360px}
input[type=text]:focus{outline:none;border-color:var(--amber)}
.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}
.rounds div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.rounds b{display:block;color:var(--navy)}
.order-pool,.order-picked{display:grid;gap:8px;margin:10px 0}
.order-picked{min-height:40px}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--amber);color:var(--ink);background:var(--amber-soft)}
.slot.right{border-color:var(--green);background:var(--green-soft)}
.slot.wrong{border-color:var(--red);background:var(--red-soft)}
.num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.badge{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.9rem;background:#fff}
.badge.got{background:var(--amber-soft);border-color:var(--amber);font-weight:600}
.badge:not(.got){color:#9AA0A6}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;transition:transform .35s;z-index:20}
.toast.show{transform:translateX(-50%) translateY(0)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--soft);border-radius:10px;padding:12px}
.stat .v{font-size:1.6rem;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.stat .k{font-size:.82rem;color:var(--muted)}
.review{border-left:0;background:var(--red-soft);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:.95rem}
.review .ans{color:#14512F;font-weight:600}
.hidden{display:none}
.timeup{color:var(--red)}
@media (max-width:560px){h1{font-size:1.6rem}.opts.two{grid-template-columns:1fr}.prompt{font-size:1.08rem}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand">SHOCK PROOF</div>
    <span class="chip">Score <b id="score">0</b></span>
    <span class="chip streak">Streak <b id="streak">0</b></span>
    <span class="chip">Time <b id="clock">15:00</b></span>
  </div>
  <div class="meter">
    <div class="meter-label"><span>Emergency fund</span><span><b id="fund">$0</b> of $6,000 (3 months of expenses)</span></div>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ---------- CONTENT ---------- */
const ROUNDS = [
  {
    title:"Income shock or expense shock?",
    blurb:"Something changes in someone's life. Is it hitting the money coming IN or the money going OUT?",
    time:"2 min",
    type:"two",
    labels:["Income shock","Expense shock"],
    items:[
      {q:"Mia loses her part-time job at a café.", a:0, why:"Her money coming in drops. That is an income shock."},
      {q:"Electricity prices go up 15% this winter.", a:1, why:"The same household now pays more to run the house. That is an expense shock."},
      {q:"Jayden's shifts get cut from 15 hours to 8 hours a week.", a:0, why:"Fewer hours means less pay. That is an income shock."},
      {q:"The landlord raises the rent by $40 a week.", a:1, why:"Rent is money going out, and it just went up. Expense shock."},
      {q:"The RBA lifts the cash rate and the bank raises a variable home loan repayment.", a:1, why:"The repayment is money going out. A rate rise makes it bigger, so it is an expense shock."},
      {q:"A parent stops getting overtime at work.", a:0, why:"Overtime is extra income. Losing it is an income shock."},
      {q:"The car needs $1,500 of repairs after a crash.", a:1, why:"An unexpected cost. Expense shock, and exactly what an emergency fund is for."},
      {q:"Inflation pushes the weekly grocery bill from $180 to $205.", a:1, why:"Prices rising means the same groceries cost more. Expense shock."}
    ]
  },
  {
    title:"Fixed or variable?",
    blurb:"Fixed expenses stay the same each time. Variable expenses change, and they are usually the easiest place to cut.",
    time:"2 min",
    type:"two",
    labels:["Fixed","Variable"],
    items:[
      {q:"Rent of $420 a week on a 12-month lease", a:0, why:"The lease locks the amount in. Fixed."},
      {q:"Petrol", a:1, why:"It changes with how much you drive and the price per litre. Variable."},
      {q:"A $35 a month phone plan", a:0, why:"Same amount every month. Fixed."},
      {q:"Eating out and takeaway", a:1, why:"You choose how much to spend each week. Variable, and a common place to cut."},
      {q:"Groceries", a:1, why:"The bill changes week to week with what you buy and with prices. Variable."},
      {q:"A $20 a month streaming subscription", a:0, why:"Same charge every month, so it is fixed. It is still a 'want' you can cancel to fix a deficit."},
      {q:"Entertainment like movies and concerts", a:1, why:"It changes with your choices. Variable."},
      {q:"Annual car registration", a:0, why:"A set amount, but it only comes once a year. That is why people forget it. Save a bit each week so it does not catch you out."}
    ]
  },
  {
    title:"Run the numbers",
    blurb:"Quick calculations an adviser does every day. Working out on paper is fine.",
    time:"4 min",
    type:"mc",
    items:[
      {q:"Sam's weekly net income is $480. How much should Sam save to hit the 20% rule?", o:["$48","$96","$120","$240"], a:1, why:"20% of $480: 480 x 0.2 = $96."},
      {q:"Lena's car uses 40 litres of petrol a week. The price rises from $1.80 to $2.20 a litre. How much extra does she spend each week?", o:["$0.40","$8","$16","$88"], a:2, why:"Old cost 40 x $1.80 = $72. New cost 40 x $2.20 = $88. Extra: $88 - $72 = $16 a week."},
      {q:"Ari earns $620 a week and spends $680. What is the result?", o:["A $60 surplus","A $60 deficit","A $1,300 deficit","The budget is balanced"], a:1, why:"Expenses are higher than income: $680 - $620 = $60 deficit."},
      {q:"The Millers' expenses are $2,000 a month. Using the 3-month rule, how big should their emergency fund be?", o:["$2,000","$4,000","$6,000","$24,000"], a:2, why:"3 months x $2,000 = $6,000."},
      {q:"After a rate rise the Millers need an extra $200 a month. They cancel a $20 streaming service. How much more do they still need to find?", o:["$20","$180","$200","$220"], a:1, why:"$200 - $20 = $180 still to find. In the case study they cut eating out by $180 to close the gap."},
      {q:"Priya's shifts drop and she now earns $150 less each week. She cuts takeaway by $60 and her phone plan by $15. What is her weekly gap now?", o:["$75","$90","$135","$225"], a:0, why:"Cuts total $60 + $15 = $75. Gap left: $150 - $75 = $75. She still needs another fix."}
    ]
  },
  {
    title:"The adviser's call",
    blurb:"You are the financial adviser. Pick the BEST first move for each client.",
    time:"4 min",
    type:"mc",
    items:[
      {s:"Scenario A: Mia, 16, lost her café job. She was earning $200 a week and spends about $150 a week on takeaway, clothes, transport and a $20 subscription.",
       q:"What is Mia's best first move?", o:["Keep spending the same and wait for a new job","Cut wants straight away and start looking for new work","Put everything on a buy now, pay later account","Stop using public transport so she cannot get anywhere"], a:1,
       why:"An income shock needs action on both sides: cut variable wants now and look for new income. Borrowing to keep the same lifestyle just builds debt."},
      {s:"Scenario B: The Tran family's electricity bill jumps from $450 to $600 a quarter.",
       q:"Which adjustment makes the most sense?", o:["Stop paying the electricity bill","Compare plans with other energy retailers and cut usage at home","Cancel their home insurance to free up money","Ignore it because it is only once a quarter"], a:1,
       why:"Electricity is a need, so you cannot just drop it. Find a cheaper provider and use less. Cancelling insurance swaps a small saving for a big risk."},
      {s:"Scenario C: Josh needs $1,500 for car repairs to get to work. He has $0 in savings.",
       q:"Why is Josh in a tough spot?", o:["He spends too much on petrol","He has no emergency fund, so he may have to borrow at high interest","His car is too old","His income is too high"], a:1,
       why:"Without a buffer, an unexpected cost often goes on a credit card, which charges high interest. That is why the emergency fund matters."},
      {s:"Scenario C continued: Josh puts the $1,500 on a credit card to fix the car.",
       q:"What should Josh do next?", o:["Only ever pay the minimum repayment","Cut variable spending to pay the card off fast, then start building an emergency fund","Get a second credit card","Keep the debt and stop budgeting"], a:1,
       why:"Pay the high interest debt off quickly by cutting wants, then build the buffer so the next shock does not end up on a card."},
      {s:"Scenario D: The Millers have a variable rate mortgage. Rates rise and their repayment goes from $2,500 to $2,700 a month.",
       q:"Why did their repayment change?", o:["They chose to pay more","Their lender passed on a rise in interest rates, and a variable rate moves with the market","Their house went up in value","The government taxed their mortgage"], a:1,
       why:"The RBA lifts the cash rate, and lenders usually pass that on. Variable rate repayments move straight away. A fixed rate would have stayed the same for the fixed period."},
      {s:"Scenario E: Ella built her budget assuming 20 hours of work a week. Most weeks she only gets 12.",
       q:"What went wrong with Ella's budget?", o:["She forgot irregular expenses","She overestimated her income","She saved too much","Nothing, the budget is fine"], a:1,
       why:"Planning on shifts you do not actually get is overestimating income, one of the common reasons budgets fail. Budget on what you reliably earn."}
    ]
  },
  {
    title:"Fix the budget in order",
    blurb:"Tap the steps in the correct order to fix a deficit caused by rising costs.",
    time:"1 min",
    type:"order",
    steps:["Identify the new deficit amount","Review variable expenses to cut","Implement the spending changes","Monitor the budget next month"],
    why:"Find the size of the gap first, look for what you can cut, make the changes, then check next month that it worked. A budget is a living document."
  }
];

const BADGES = [
  {id:"first", name:"First deposit", test:s=>s.correct>=1},
  {id:"streak3", name:"Steady saver (3 in a row)", test:s=>s.bestStreak>=3},
  {id:"streak6", name:"Shock absorber (6 in a row)", test:s=>s.bestStreak>=6},
  {id:"half", name:"Halfway buffer ($3,000)", test:s=>s.fund>=3000},
  {id:"full", name:"Fully shock proof ($6,000)", test:s=>s.fund>=6000},
  {id:"numbers", name:"Number cruncher (Round 3 perfect)", test:s=>s.perfect[2]},
  {id:"adviser", name:"Trusted adviser (Round 4 perfect)", test:s=>s.perfect[3]}
];

/* ---------- STATE ---------- */
const S = {name:"", score:0, streak:0, bestStreak:0, fund:0, correct:0, total:0,
  round:0, item:0, mistakes:[], roundWrong:[0,0,0,0,0], perfect:[false,false,false,false,false],
  got:new Set(), started:false, startTime:0};
const FUND_TARGET = 6000;
const $ = id => document.getElementById(id);
const app = $("app");

function money(n){return "$"+Math.max(0,Math.round(n)).toLocaleString("en-AU")}
function updateHud(){
  $("score").textContent = S.score;
  $("streak").textContent = S.streak;
  $("fund").textContent = money(S.fund);
  $("fill").style.width = Math.min(100, S.fund/FUND_TARGET*100)+"%";
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800);
}
function checkBadges(){
  BADGES.forEach(b=>{ if(!S.got.has(b.id) && b.test(S)){ S.got.add(b.id); toast("Badge: "+b.name); } });
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* Scoring: correct = +10 points and +$150 into the fund, doubled once your streak hits 3.
   Wrong = streak resets and a "shock" drains $100 from the fund. */
function award(ok, record){
  S.total++;
  if(ok){
    S.correct++; S.streak++; S.bestStreak=Math.max(S.bestStreak,S.streak);
    const mult = S.streak>=3 ? 2 : 1;
    S.score += 10*mult; S.fund = Math.min(FUND_TARGET, S.fund + 150*mult);
    if(S.streak===3) toast("Streak bonus: double deposits!");
  } else {
    S.streak=0; S.fund=Math.max(0,S.fund-100);
    S.roundWrong[S.round]++; S.mistakes.push(record);
    const tr=$("track"); tr.classList.remove("shake"); void tr.offsetWidth; tr.classList.add("shake");
  }
  updateHud(); checkBadges();
}

/* ---------- TIMER ---------- */
function tick(){
  if(!S.started) return;
  const left = 15*60 - Math.floor((Date.now()-S.startTime)/1000);
  const c=$("clock");
  if(left<=0){ c.textContent="0:00"; c.classList.add("timeup"); return; }
  c.textContent = Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  setTimeout(tick,1000);
}

/* ---------- SCREENS ---------- */
function intro(){
  app.innerHTML = `
  <h1>Shock Proof</h1>
  <p class="lead">Life throws budget shocks: prices rise, shifts get cut, cars break. Every correct answer puts money into your emergency fund. Every wrong answer is a shock that drains it. Can you build a full 3-month buffer of $6,000?</p>
  <div class="card">
    <label for="nm"><b>Your name</b></label><br><br>
    <input type="text" id="nm" placeholder="First name and last initial" maxlength="40" autocomplete="off">
    <div class="rounds">
      ${ROUNDS.map((r,i)=>`<div><b>Round ${i+1}</b>${esc(r.title)}<br><span style="color:var(--muted)">about ${r.time}</span></div>`).join("")}
    </div>
    <p style="font-size:.92rem;color:var(--muted);margin:0">Correct: +$150 into the fund. Get 3 in a row and deposits double. Wrong: a $100 shock.</p>
    <div class="actions"><button class="btn alt" id="go">Start</button></div>
  </div>`;
  const go=()=>{ S.name=$("nm").value.trim()||"Student"; S.started=true; S.startTime=Date.now(); tick(); roundIntro(); };
  $("go").onclick=go;
  $("nm").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}

function roundIntro(){
  const r=ROUNDS[S.round];
  app.innerHTML = `
  <div class="card">
    <span class="roundtag">Round ${S.round+1} of ${ROUNDS.length}</span>
    <h2 style="margin-top:10px">${esc(r.title)}</h2>
    <p class="lead">${esc(r.blurb)}</p>
    <p style="color:var(--muted);font-size:.9rem">Aim for about ${r.time}.</p>
    <div class="actions"><button class="btn alt" id="go">Go</button></div>
  </div>`;
  $("go").onclick = ()=>{ S.item=0; r.type==="order" ? orderRound() : question(); };
  $("go").focus();
}

function question(){
  const r=ROUNDS[S.round], it=r.items[S.item];
  const opts = r.type==="two" ? r.labels.map((l,i)=>({t:l,i})) : shuffle(it.o.map((t,i)=>({t,i})));
  app.innerHTML = `
  <div class="card">
    <span class="roundtag">Round ${S.round+1}: ${esc(r.title)}</span>
    <span class="progress">${S.item+1} / ${r.items.length}</span>
    ${it.s?`<div class="scenario">${esc(it.s)}</div>`:""}
    <div class="prompt">${esc(it.q)}</div>
    <div class="opts ${r.type==="two"?"two":""}">
      ${opts.map(o=>`<button class="opt" data-i="${o.i}">${esc(o.t)}</button>`).join("")}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="actions"><button class="btn" id="next" disabled>Next</button></div>
  </div>`;
  const correctText = r.type==="two" ? r.labels[it.a] : it.o[it.a];
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const pick=+b.dataset.i, ok = pick===it.a;
    app.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.i===it.a) x.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    const fb=$("fb"); fb.className="feedback "+(ok?"ok":"no");
    fb.innerHTML = (ok?"<b>Correct.</b> ":"<b>Not quite.</b> The answer is <b>"+esc(correctText)+"</b>. ")+esc(it.why);
    award(ok,{round:S.round, q:(it.s?it.s+" ":"")+it.q, picked:(r.type==="two"?r.labels[pick]:it.o[pick]), ans:correctText, why:it.why});
    const n=$("next"); n.disabled=false; n.focus();
  });
  $("next").onclick = nextItem;
}

function nextItem(){
  const r=ROUNDS[S.round];
  S.item++;
  if(S.item < r.items.length) question(); else endRound();
}

function endRound(){
  const r=ROUNDS[S.round];
  if(S.roundWrong[S.round]===0) S.perfect[S.round]=true;
  checkBadges();
  S.round++;
  if(S.round < ROUNDS.length) roundIntro(); else finish();
}

function orderRound(){
  const r=ROUNDS[S.round];
  const pool = shuffle(r.steps.map((t,i)=>({t,i})));
  const picked=[];
  function draw(done){
    app.innerHTML = `
    <div class="card">
      <span class="roundtag">Round ${S.round+1}: ${esc(r.title)}</span>
      <div class="prompt">${esc(r.blurb)}</div>
      <div class="order-picked">
        ${r.steps.map((_,k)=>{
          const p=picked[k];
          let cls="slot"+(p?" filled":"");
          if(done&&p) cls+= p.i===k?" right":" wrong";
          return `<div class="${cls}"><span class="num">${k+1}</span>${p?esc(p.t):"Tap a step below"}</div>`;
        }).join("")}
      </div>
      ${done?"":`<div class="order-pool">${pool.filter(p=>!picked.includes(p)).map(p=>`<button class="opt" data-i="${p.i}">${esc(p.t)}</button>`).join("")}</div>`}
      <div class="feedback" id="fb"></div>
      <div class="actions">
        ${done?`<button class="btn" id="next">See results</button>`:`<button class="btn alt" id="undo" ${picked.length?"":"disabled"}>Undo</button><button class="btn" id="check" ${picked.length===r.steps.length?"":"disabled"}>Check</button>`}
      </div>
    </div>`;
    if(done){
      const ok = picked.every((p,k)=>p.i===k);
      const fb=$("fb"); fb.className="feedback "+(ok?"ok":"no");
      fb.innerHTML=(ok?"<b>Correct.</b> ":"<b>Not quite.</b> The order is: "+r.steps.map((s,k)=>(k+1)+". "+esc(s)).join(", ")+". ")+esc(r.why);
      $("next").onclick=endRound; $("next").focus(); return;
    }
    app.querySelectorAll(".order-pool .opt").forEach(b=>b.onclick=()=>{ picked.push(pool.find(p=>p.i===+b.dataset.i)); draw(false); });
    $("undo").onclick=()=>{ picked.pop(); draw(false); };
    $("check").onclick=()=>{
      const ok = picked.every((p,k)=>p.i===k);
      award(ok,{round:S.round,q:"Put the steps to fix a deficit in order.",picked:picked.map(p=>p.t).join(" > "),ans:r.steps.join(" > "),why:r.why});
      draw(true);
    };
  }
  draw(false);
}

function finish(){
  const pct = Math.round(S.correct/S.total*100);
  const mins = Math.max(1,Math.round((Date.now()-S.startTime)/60000));
  let verdict = S.fund>=FUND_TARGET ? "Fully shock proof. Your buffer could cover 3 months of expenses."
    : S.fund>=3000 ? "Solid buffer. A few more good calls and you would be fully protected."
    : "Your buffer is thin. Use the review below to see where the shocks hit.";
  app.innerHTML = `
  <h1>Results: ${esc(S.name)}</h1>
  <p class="lead">${verdict}</p>
  <div class="stats">
    <div class="stat"><div class="v">${S.correct}/${S.total}</div><div class="k">Correct (${pct}%)</div></div>
    <div class="stat"><div class="v">${S.score}</div><div class="k">Score</div></div>
    <div class="stat"><div class="v">${money(S.fund)}</div><div class="k">Emergency fund</div></div>
    <div class="stat"><div class="v">${S.bestStreak}</div><div class="k">Best streak</div></div>
  </div>
  <div class="card">
    <h2>Badges</h2>
    <div class="badges">${BADGES.map(b=>`<span class="badge ${S.got.has(b.id)?"got":""}">${esc(b.name)}</span>`).join("")}</div>
    <p style="color:var(--muted);font-size:.9rem;margin-bottom:0">Finished in about ${mins} minute${mins===1?"":"s"}. Show this screen to your teacher.</p>
  </div>
  <div class="card">
    <h2>Mistake review</h2>
    ${S.mistakes.length? S.mistakes.map(m=>`
      <div class="review"><div><b>Round ${m.round+1}:</b> ${esc(m.q)}</div>
      <div>You said: ${esc(m.picked)}</div>
      <div class="ans">Answer: ${esc(m.ans)}</div>
      <div style="color:var(--muted)">${esc(m.why)}</div></div>`).join("")
    : `<p style="margin:0">No mistakes. Perfect run.</p>`}
  </div>
  <div class="card">
    <h2>In your book</h2>
    <p style="margin:0">Write ONE sentence: "If my income dropped by $50 a week, the first thing I would cut is ... because ..."</p>
  </div>
  <div class="actions"><button class="btn alt" id="again">Play again</button></div>`;
  $("again").onclick=()=>location.reload();
  S.started=false;
}

updateHud();
intro();
</script>
</body>
</html>
